  },

  async memberChangePw(email, curPw, newPw, keepSession){
    const e = authEmailOf(email);
    if(!LIVE){
      const m = this.memberStore.all();
      const rec = m[e];
      if(!rec || rec.pw !== this._hash(curPw))
        return {ok:false, msg:'아이디 또는 현재 비밀번호가 올바르지 않습니다.'};
      rec.pw = this._hash(newPw); rec.mustChangePw = false; m[e] = rec; this.memberStore.save(m);
      const s = this.memberStore.session(); if(s && s.email === e){ s.mustChangePw = false; this.memberStore.setSession(s); }
      return {ok:true};
    }
    const {error} = await sb.auth.signInWithPassword({email:e, password:curPw});
    if(error) return {ok:false, msg:'이메일 또는 현재 비밀번호가 올바르지 않습니다.'};
    const {error:e2} = await sb.auth.updateUser({password:newPw, data:{must_change_pw:false}});
    if(!keepSession){ try{ await sb.auth.signOut(); }catch(_){} }   // v178: 첫 로그인 설정에서는 로그인 유지
    if(e2) return {ok:false, msg:'비밀번호를 바꾸지 못했습니다: ' + e2.message};
    return {ok:true};
  },

  async memberSignIn(email, password, company){
    const e = authEmailOf(email);
    if(!LIVE){
      const m = this.memberStore.all();
      const rec = m[e];
      if(!rec || rec.pw !== this._hash(password))
        return {ok:false, msg:'아이디 또는 비밀번호가 올바르지 않습니다.'};
      // 로그인 시 회사를 다시 고르면 최신값으로 갱신(데모)
      const co = company || rec.company || '';
      if(company && company !== rec.company){ rec.company = company; m[e]=rec; this.memberStore.save(m); }
      const u = {name:rec.name, email:e, company:co, phone:rec.phone||null, empno:rec.empno||null,
                 profile:rec.profile||null, baselineAt:rec.baselineAt||null, mustChangePw: !!rec.mustChangePw};
      this.memberStore.setSession(u);
      return {ok:true, user:u};
    }
    const {data, error} = await sb.auth.signInWithPassword({email:e, password});
    if(error) return {ok:false, msg:'이메일 또는 비밀번호가 올바르지 않습니다.'};
    const md = data.user?.user_metadata || {};
    const name = md.name || e.split('@')[0];
    const co = company || md.company || '';
    const ph = md.phone || null;
    // 새 구조: employees 행이 없으면 이때 만들어 둡니다.
    await this.syncEmployee(name, co, ph);
    return {ok:true, user:{name, email:e, company:co, phone:ph, empno: md.empno || null,
                           profile: md.sex ? {sex: md.sex, age: md.age_band, birth_year: md.birth_year} : null,
                           baselineAt: md.baseline_at || null,
                           mustChangePw: !!md.must_change_pw}};        // v178: 발급 계정은 첫 로그인 때 비밀번호 변경
  },

  /* ---------- 초기 문진 ----------
     데모: 브라우저에만 저장합니다.
     운영(LIVE): 아래 두 RPC 가 필요합니다. (변경사항.md 에 SQL 을 적어 두었습니다)
        save_baseline_intake(p_intake jsonb)
        get_baseline_intake() returns jsonb
     민감정보이므로 JWT(user_metadata)에는 답을 넣지 않고,
     '작성했는지' 여부(baseline_at)만 넣어 화면 전환에 씁니다. */
  /* 저장 형식 (jsonb 한 칸)
       { ans:{...가입 문진}, at:'ISO', history:[{at:'ISO', ans:{...재확인}}, ...] }
     재확인은 history 에 쌓이므로 회차별 변화를 그대로 볼 수 있습니다. */
  async saveBaseline(ans){
    const now = new Date().toISOString();
    const rec = {ans, at: now, history: []};
    return this._putIntake(rec, now);
  },

  /* 회차별 측정 기록을 한 건 쌓습니다.
     한 건 = { at, ans, program, round } — 어떤 프로그램의 몇 회차인지 남깁니다.
     program 은 상담을 먼저 받는 구조라 신청이 끝난 뒤 tagLastMeasure 로 채웁니다. */
  async saveRecheck(ans, meta){
    const now = new Date().toISOString();
    const cur = (await this.getBaseline()) || {ans:{}, at:now, history:[]};
    const hist = cur.history || [];
    const rec = {ans: cur.ans || {}, at: cur.at || now,
                 history: [...hist, {at: now, ans,
                                     program: (meta && meta.program) || null,
                                     round: hist.length + 2}]};
    return this._putIntake(rec, cur.at || now);
  },

  /* 방금 신청한 프로그램을 마지막 측정 기록에 연결합니다. */
  async tagLastMeasure(program){
    const cur = await this.getBaseline();
    if(!cur || !cur.history || !cur.history.length) return {ok:true};
    const hist = [...cur.history];
    const last = hist[hist.length - 1];
    if(last.program) return {ok:true};
    hist[hist.length - 1] = {...last, program};
    return this._putIntake({...cur, history: hist}, cur.at);
  },

  async _putIntake(rec, baselineAt){
    if(!LIVE){
      const s = this.memberStore.session();
      if(!s) return {ok:false, msg:'로그인 정보가 없습니다.'};
      const m = this.memberStore.all();
      const r = m[s.email];
      if(r){ r.baseline = rec; r.baselineAt = baselineAt; this.memberStore.save(m); }
      this.memberStore.setSession({...s, baselineAt});
      return {ok:true, at: rec.at, rec};
    }
    try{
      const {error} = await sb.rpc('save_baseline_intake', {p_intake: rec});
      if(error) throw error;
    }catch(e){
      console.error(e);
      return {ok:false, msg:'저장에 실패했습니다. 잠시 후 다시 시도해 주세요.'};
    }
    await sb.auth.updateUser({ data:{ baseline_at: baselineAt } });
    return {ok:true, at: rec.at, rec};
  },

  async getBaseline(){
    let raw = null;
    if(!LIVE){
      const s = this.memberStore.session();
      if(!s) return null;
      raw = (this.memberStore.all()[s.email] || {}).baseline;
    }else{
      try{
        const {data, error} = await sb.rpc('get_baseline_intake');
        if(error) throw error;
        raw = data;
      }catch(e){ console.error(e); return null; }
    }
    if(!raw) return null;
    // 예전 형식(답만 저장) 호환
    if(!raw.ans) return {ans: raw, at: null, history: []};
    return {ans: raw.ans, at: raw.at || null, history: raw.history || []};
  },

  // 로그인한 사람의 employees 행이 없으면 만들어 둡니다 (메일 인증 후 첫 로그인 등).
  async syncEmployee(name, company, phone){
    if(!LIVE) return;
    try{ await sb.rpc('ensure_employee', {p_name:name||'', p_company:company||null, p_phone:phone||null}); }
    catch(e){ console.error(e); }
  },

  async currentUser(){
    if(!LIVE) return this.memberStore.session();
    const {data} = await sb.auth.getSession();
    const u = data?.session?.user;
    if(!u) return null;
    const md = u.user_metadata || {};
    return {name: md.name || u.email.split('@')[0], email: u.email,
            company: md.company || '', phone: md.phone || null, empno: md.empno || null,
            profile: md.sex ? {sex: md.sex, age: md.age_band, birth_year: md.birth_year} : null,
            baselineAt: md.baseline_at || null, mustChangePw: !!md.must_change_pw};
  },

  // 로그인한 사람의 소속 회사를 정합니다. (회사 연결 화면에서 호출)
  async setCompany(companyId){
    if(!LIVE){
      const s = this.memberStore.session();
      if(!s) return {ok:false, msg:'로그인 정보가 없습니다.'};
      const m = this.memberStore.all();
      const rec = m[s.email];
      if(rec){ rec.company = companyId; this.memberStore.save(m); }
      this.memberStore.setSession({...s, company:companyId});
      return {ok:true};
    }
    const {error} = await sb.auth.updateUser({ data:{ company: companyId } });
    if(error) return {ok:false, msg:error.message};
    const u = await this.currentUser();
    try{ await sb.rpc('ensure_employee',
      {p_name:u?.name || '', p_company:companyId, p_phone:null}); }
    catch(e){ console.error(e); return {ok:false, msg:'회사 연결에 실패했습니다. 잠시 후 다시 시도해 주세요.'}; }
    return {ok:true};
  },

  /* 내 정보를 고치기 전에 본인인지 한 번 더 확인합니다. */
  async verifyPassword(pw){
    const s = await this.currentUser();
    if(!s) return {ok:false, msg:'로그인 정보가 없습니다.'};
    if(!LIVE){
      const rec = this.memberStore.all()[s.email];
      if(!rec || rec.pw !== this._hash(pw))
        return {ok:false, msg:'비밀번호가 일치하지 않습니다.'};
      return {ok:true};
    }
    const {error} = await sb.auth.signInWithPassword({email:s.email, password:pw});
    if(error) return {ok:false, msg:'비밀번호가 일치하지 않습니다.'};
    return {ok:true};
  },

  /* 이름은 계정에, 소속·성별·연령대는 사전 상담 응답에 저장합니다. */
  async updateProfile({name, dept, sex, age, extra}){
    try{
      if(!LIVE){
        const s = this.memberStore.session();
        if(!s) return {ok:false, msg:'로그인 정보가 없습니다.'};
        const m = this.memberStore.all();
        if(m[s.email]){ m[s.email].name = name; this.memberStore.save(m); }
        this.memberStore.setSession({...s, name});
      }else{
        const {error} = await sb.auth.updateUser({data:{name}});
        if(error) return {ok:false, msg:error.message};
        await this.syncEmployee(name, (await this.currentUser())?.company || null);

const today = new Date(); today.setHours(0,0,0,0);
let maxDate = new Date(today); maxDate.setDate(maxDate.getDate() + CONFIG.horizonDays);
/* v185: 운영 종료일(openTo)이 더 뒤면 그날까지 캘린더를 엽니다. */
PROGRAMS.forEach(p => { if(p.openTo){ const d = new Date(p.openTo + 'T00:00:00'); if(d > maxDate) maxDate = d; } });
const dstrOf = d => (d instanceof Date) ? iso(d) : String(d || '');
/* 운영 기간 안의 날짜인지 (openFrom/openTo 가 없으면 항상 true) */
function inPeriod(prog, date){
  const ds = dstrOf(date);
  if(prog.openFrom && ds < prog.openFrom) return false;
  if(prog.openTo   && ds > prog.openTo)   return false;
  return true;
}
/* 운영 기간을 주차별로 나눈 안내문: '1주차 11/2~11/5 · 2주차 …' */
function periodWeeks(prog){
  if(!prog.openFrom || !prog.openTo) return [];
  const out = []; let cur = null;
  for(let d = new Date(prog.openFrom + 'T00:00:00'); iso(d) <= prog.openTo; d.setDate(d.getDate() + 1)){
    if(!prog.workDays.includes(d.getDay())) continue;
    const wk = `${d.getFullYear()}-${Math.floor((d - new Date(d.getFullYear(),0,1)) / 864e5 / 7)}-${d.getDay() === 0 ? 1 : 0}`;
    const mon = new Date(d); mon.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    const key = iso(mon);
    if(!cur || cur.key !== key){ cur = {key, from: iso(d), to: iso(d)}; out.push(cur); }
    else cur.to = iso(d);
  }
  return out;
}
const mdShort = ds => { const [,m,d] = ds.split('-').map(Number); return `${m}/${d}`; };
function periodLabel(prog){
  if(!prog.openFrom || !prog.openTo) return `${CONFIG.horizonDays}일 이내로 신청할 수 있습니다.`;
  const dn = ['일','월','화','수','목','금','토'];
  const wd = prog.workDays.map(i => dn[i]).join('·');
  return `${prog.openFrom.replace(/-/g,'.')} ~ ${prog.openTo.replace(/-/g,'.')} 운영 · ${wd}요일`;
}

/* 한 시간대(예: 09:00)의 자리는 5분 간격으로 시작합니다: 09:00 · 09:05 · 09:10 (자리 수 = 담당 운동처방사 수) */
const SUB_STEP_MIN = 5;
/* v189: 타임 버튼 표기 — 'plain' = "1타임", 'time' = "1타임(13:10~)" */
const TIME_LABEL_STYLE = 'time';   // v190: 1타임(13:10~) 형식
const timeLabel = (p, t) => `${p.slots.indexOf(t) + 1}타임${TIME_LABEL_STYLE === 'time' ? `(${t}~)` : ''}`;
const toMin = t => { const [h, m] = String(t).split(':').map(Number); return h*60 + (m||0); };
const fromMin = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
/* v171: 시간대 기준 시각 — 13:30·13:35 는 13:25 시간대로 묶입니다 (기준 시각이 정각이 아니어도 됨) */
function slotKey(t, pid){
  const prog = programById(pid || S.program); const m = toMin(t);
  let best = null;
  ((prog && prog.slots) || []).forEach(b => { const bm = toMin(b); if(bm <= m && (best === null || bm > toMin(best))) best = b; });
  return best || (String(t).slice(0,2) + ':00');
}
const hourKey = slotKey;   // 이전 이름 호환
function subTimesOf(base, cap){
  const b = toMin(base);
  return Array.from({length: cap}, (_, i) => fromMin(b + i * SUB_STEP_MIN));
}
/* v174: 시간대마다 운동처방사를 1·2·3번 자리에 무작위로 배치합니다.
   배치는 '프로그램|날짜|시간대'를 씨앗으로 정하므로 누가 언제 보아도 같은 날·같은 시간대는 같은 배치입니다.
   1번 자리 = 기준 시각, 2번 = +5분, 3번 = +10분 (예: 1T → 13:25 · 13:30 · 13:35) */
function seedOf(str){ let h = 2166136261; for(const ch of String(str)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h || 1; }
/* v185: 자리 목록 — rooms 가 있으면 휴게실 순서(1번 C · 2번 B · 3번 A)가 곧 자리이고, 없으면 예전처럼 운동처방사 수만큼입니다. */
function programSeats(p){
  if(p && p.rooms && p.rooms.length) return p.rooms.map((r, i) => ({...r, n:i + 1}));
  return programHosts(p).map((t, i) => ({code:'', name:'', sex:'', trainer:t.name, n:i + 1}));
}
/* 지금 로그인한 임직원의 성별('남성'|'여성'). 관리자·운동처방사 화면이거나 모르면 '' (= 모든 자리 표시) */
function bookingSex(){
  if(S.admin && S.admin.authed) return '';
  const u = S.auth && S.auth.user; if(!u) return '';
  const sx = (BASE.saved && BASE.saved.sex) || (u.profile && u.profile.sex) || (u.sex) || '';
  return sx === '남' ? '남성' : sx === '여' ? '여성' : sx;
}
/* 시작 시각 → 그 자리(휴게실). 13:15 → 2번 B 여자휴게실 */
function seatOfTime(p, t){
  if(!p || !t) return null;
  const base = slotKey(t, p.id); const i = Math.round((toMin(t) - toMin(base)) / SUB_STEP_MIN);
  return programSeats(p)[i] || null;
}
/* 예약의 장소: 'KIC 본사 휴게실 · A 남자휴게실' */
function placeOf(p, b){
  const t = b && (b.slot_time || b.t); const seat = seatOfTime(p, t ? String(t).slice(0,5) : '');
  return seat && seat.name ? `${p.location} · ${seat.name}` : p.location;
}
window.placeOf = placeOf;
function slotOrder(dstr, base, pid){
  const p = pid || S.program;
  const prog = programById(p);
  if(prog.rooms && prog.rooms.length)
    return programSeats(prog).map(r => ({name:r.trainer, role:'운동처방사', room:r}));   // 고정 배치
  const hosts = programHosts(prog).slice();
  let x = seedOf(`${p}|${dstr}|${base}`);
  const rnd = () => { x ^= x << 13; x >>>= 0; x ^= x >>> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; };
  for(let i = hosts.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); const tmp = hosts[i]; hosts[i] = hosts[j]; hosts[j] = tmp; }
  return hosts;
}
/* 이 시간대의 자리들: {n:자리 번호, t:시작 시각, trainer:담당, free:비어 있음} */
function positionsOf(dstr, hour, pid){
  const p = pid || S.program; const base = slotKey(hour, p);
  const order = slotOrder(dstr, base, p);
  const usedT  = (S.takenSub && S.takenSub.get(`${p}|${dstr}|${base}`)) || [];
  const usedTr = (S.taken && S.taken.get(`${p}|${dstr}|${base}`)) || [];
  const sx = bookingSex();
  return subTimesOf(base, order.length).map((t, i) => {
    const room = order[i].room || null;
    const eligible = !sx || !room || !room.sex || room.sex === sx;      // 내 성별이 쓰는 휴게실인가
    const nm = order[i].name || '';
    return { n:i + 1, t, trainer:nm, room, eligible,
      free: eligible && !usedT.includes(t) && !(nm && usedTr.includes(nm)) && slotTimeOK(dstr, t) };
  });
}
/* 이 시간대에서 비어 있는 시작 시각 */
function freeSubTimes(dstr, hour, pid){ return positionsOf(dstr, hour, pid).filter(x => x.free).map(x => x.t); }
function nextSubTime(dstr, hour, pid){ return freeSubTimes(dstr, hour, pid)[0] || null; }

/* 이 시간에 이미 잡힌 운동처방사들 */
function bookedTrainers(dstr, t, pid){
  const p = pid || S.program;
  return S.taken.get(`${p}|${dstr}|${slotKey(t, p)}`) || [];
}
/* 이 시간대에서 아직 자리가 비어 있는 운동처방사들 (v174: 자리 배치 기준) */
function freeTrainers(dstr, t, pid){
  const p = pid || S.program;
  return positionsOf(dstr, t, p).filter(x => x.free).map(x => ({name:x.trainer, role:'운동처방사', room:x.room}));
}
function slotTimeOK(dstr, t){
  const [y,m,d] = dstr.split('-').map(Number);
  const [hh,mi] = t.split(':').map(Number);
  return new Date(y, m-1, d, hh, mi).getTime() > Date.now() + CONFIG.leadHours*3600e3;
}
function slotOpen(dstr, t, pid){
  return slotTimeOK(dstr, t) && freeTrainers(dstr, t, pid).length > 0;
}
function dayOpen(date, pid){
  const prog = pid ? programById(pid) : P();
  if(date < today || date > maxDate) return false;
  if(!inPeriod(prog, date)) return false;                 // v185: 운영 기간 밖
  if(!prog.workDays.includes(date.getDay())) return false;
  const dstr = iso(date);
  return prog.slots.some(t => slotOpen(dstr, t, pid || S.program));
}

/* 프로그램별 '가장 빠른 신청 가능 시각'과 '이번 주(7일) 남은 자리'를 계산합니다.
   이미 받아둔 예약 현황(S.taken)만 쓰기 때문에 서버 요청이 더 필요하지 않습니다. */
function availability(pid){
  const prog = programById(pid);
  const weekEnd = new Date(today); weekEnd.setDate(weekEnd.getDate() + 7);
  let next = null, week = 0;

  for(let i=0; i<400; i++){
    const date = new Date(today); date.setDate(date.getDate() + i);
    if(date > maxDate) break;
    if(!inPeriod(prog, date)) continue;
    if(!prog.workDays.includes(date.getDay())) continue;
    const dstr = iso(date);
    for(const t of prog.slots){
      const free = slotTimeOK(dstr, t) ? freeTrainers(dstr, t, pid).length : 0;
      if(!free) continue;
      if(!next) next = {d:dstr, t};
      if(date < weekEnd) week += free;      // 운동처방사 수만큼 자리가 있습니다
    }
  }
  return {next, week};
}

async function loadTaken(){
  const from = iso(today);
  const to = iso(maxDate);
  try{
    const rows = await DB.takenSlots(from, to);
    const m = new Map(), sub = new Map();
    rows.forEach(r => {
      const t5 = String(r.t).slice(0,5);
      const k = `${r.p||'pt'}|${r.d}|${slotKey(t5, r.p||'pt')}`;   // 13:30 도 13:25 시간대로 묶음
      const who = r.tr || '';
      m.set(k, (m.get(k) || []).concat(who ? [who] : ['']));
      sub.set(k, (sub.get(k) || []).concat([t5]));
    });
    S.taken = m; S.takenSub = sub;
  }catch(e){ console.error(e); toast('예약 현황을 불러오지 못했습니다.'); }
}

/* "기타" 를 골랐는지 확인합니다. */
const ETC = '기타';
function etcPicked(q, v){
  if(!q.options || !q.options.includes(ETC)) return false;
  return Array.isArray(v) ? v.includes(ETC) : v === ETC;
}
/* "기타" 를 고른 문항에만 직접 적는 칸을 붙입니다.
   입력할 때 화면을 다시 그리지 않으므로 한글 조합이 끊기지 않습니다. */
function etcInput(q, v, store, ns, inputCls){
  if(!etcPicked(q, v)) return '';
  const key = q.id + '_etc';
  const err = S.errors[ns + '-' + key];
  return `<div class="mt-sm">
    <input class="${inputCls} ${err?'border-error':''}" type="text" autocomplete="off"
           value="${esc(store[key] || '')}"
           placeholder="기타 — 어떤 것인지 직접 적어 주세요"
           oninput="setAns('${ns}','${key}',this.value,true)">
    ${err ? `<p class="text-label-sm text-error mt-xs qerr">${esc(err)}</p>` : ''}
  </div>`;
}

function renderQuestions(list, store, ns){
  const inputCls = 'w-full rounded border-surface-container-high focus:border-on-surface focus:ring-0 px-md py-sm bg-surface-container-lowest text-body-md';
  const optCls = on => `flex items-center gap-md p-md border rounded cursor-pointer transition-colors
      ${on ? 'border-primary bg-primary-container/30' : 'border-surface-variant hover:bg-surface-container-high'}`;

  // 숨김 문항과, 조건(when)이 맞지 않는 문항은 그리지 않습니다.
  return list.filter(q => !q.hidden && (!q.when || q.when(store))).map(q=>{
    const v = store[q.id];
    const err = S.errors[ns+'-'+q.id];
    let body = '';

    if(q.type==='radio'){
      body = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-sm">${q.options.map(o=>`
        <label class="${optCls(v===o)}">
          <input type="radio" name="${ns}-${q.id}" class="w-4 h-4" value="${esc(o)}" ${v===o?'checked':''}
                 onchange="setAns('${ns}','${q.id}',this.value)">
          <span class="text-body-md text-on-surface">${esc(o)}</span>
        </label>`).join('')}</div>${etcInput(q, v, store, ns, inputCls)}`;
    }
    else if(q.type==='checkbox'){
      const arr = Array.isArray(v)?v:[];
      body = `<div class="grid grid-cols-1 sm:grid-cols-2 gap-sm">${q.options.map(o=>`
        <label class="${optCls(arr.includes(o))}">
          <input type="checkbox" class="w-4 h-4 rounded-sm border-surface-variant" value="${esc(o)}"
                 ${arr.includes(o)?'checked':''} onchange="toggleAns('${ns}','${q.id}',this.value)">
          <span class="text-body-md text-on-surface">${esc(o)}</span>
        </label>`).join('')}</div>${etcInput(q, v, store, ns, inputCls)}`;
    }
    else if(q.type==='bodymap'){
      const arr = Array.isArray(v)?v:[];
      // mapOnly 문항은 보기 목록 없이 그림에서만 고릅니다.
      const list = q.mapOnly ? '' :
        `<div class="grid grid-cols-2 sm:grid-cols-3 gap-sm">${q.options.map(o=>`
          <label class="${optCls(arr.includes(o))}">
            <input type="checkbox" class="w-4 h-4 rounded-sm border-surface-variant" value="${esc(o)}"
                   ${arr.includes(o)?'checked':''} onchange="toggleBody('${ns}','${q.id}',this.value)">
            <span class="text-body-md text-on-surface">${esc(o)}</span>
          </label>`).join('')}</div>${etcInput(q, v, store, ns, inputCls)}`;
      body = `${list}
        ${bodyMapHTML(ns, q.id, arr, store[q.id+'_etc'], q, vasOf(store, q.id))}`;
    }
    else if(q.type==='rrn'){
      body = rrnFieldHTML(ns, q.id);
    }
    else if(q.type==='auto'){
      body = `<div class="autoval${hasVal(v)?' on':''}">${
        hasVal(v) ? esc(String(v)) : '가입할 때 입력하신 주민등록번호로 채워집니다'}</div>`;
    }
    else if(q.type==='scale'){
      const nums=[]; for(let i=q.min;i<=q.max;i++) nums.push(i);
      body = `<div class="flex flex-wrap gap-sm">${nums.map(n=>`
        <button type="button" onclick="setAns('${ns}','${q.id}',${n})"
          class="w-11 h-11 rounded text-label-lg transition-all
            ${v===n ? 'bg-primary-container text-on-primary-fixed'
                    : 'border border-surface-container-high text-on-surface hover:border-primary'}">${n}</button>`).join('')}
        </div>
        <div class="flex justify-between max-w-md mt-xs text-label-sm text-tertiary">
          <span>${esc(q.low||'')}</span><span>${esc(q.high||'')}</span></div>`;
    }
    else if(q.type==='stars'){
      body = `<div class="flex gap-xs">${[1,2,3,4,5].map(n=>`
        <button type="button" aria-label="${n}점" onclick="setAns('${ns}','${q.id}',${n})"
          class="text-[32px] leading-none transition-transform hover:scale-110
                 ${v>=n?'text-primary-container':'text-surface-container-highest'}">
          <span class="material-symbols-outlined ${v>=n?'msf':''} text-[32px]">star</span></button>`).join('')}
        </div>`;
    }
    else if(q.type==='text'){
      body = `<input type="text" class="${inputCls}" value="${esc(v||'')}"
               placeholder="${esc(q.placeholder||'')}" oninput="setAns('${ns}','${q.id}',this.value,true)">`;
    }
    else if(q.type==='textarea'){
      body = `<textarea rows="3" class="${inputCls}" placeholder="${esc(q.placeholder||'')}"
               oninput="setAns('${ns}','${q.id}',this.value,true)">${esc(v||'')}</textarea>`;
    }
    else if(q.type==='consent'){
      return `<div id="f-${ns}-${q.id}" class="pt-md border-t border-surface-variant">
        <label class="flex items-start gap-md cursor-pointer">
          <input type="checkbox" class="mt-1 w-4 h-4 rounded-sm border-surface-variant" ${v?'checked':''}
                 onchange="setAns('${ns}','${q.id}',this.checked)">
          <span class="text-body-md text-on-surface-variant">${esc(q.q)}
            <span class="text-error">*</span></span>
        </label>
        ${err?`<p class="text-label-sm text-error mt-xs qerr">${err}</p>`:''}
      </div>`;
    }

    return `<div id="f-${ns}-${q.id}" class="flex flex-col gap-sm">
      <label class="text-label-lg text-on-surface">${esc(q.q)}
        ${q.required?'<span class="text-error">*</span>':'<span class="text-tertiary font-normal">(선택)</span>'}
        ${q.hint?`<span class="text-label-sm text-tertiary font-normal ml-xs">${esc(q.hint)}</span>`:''}
      </label>
      ${body}
      ${err?`<p class="text-label-sm text-error qerr">${err}</p>`:''}
    </div>`;
  }).join('');
}

/* 문항 응답이 들어가는 곳 — ns 로 구분합니다.
   intake 예약 문진 · survey 만족도 · base 초기 문진 */
function ansStore(ns){
  return ns==='intake' ? S.intake : ns==='base' ? BASE.ans
       : ns==='chk'    ? CHK.ans
       : ns==='prof'   ? PROF.ans   : S.survey;
}
window.setAns = (ns, id, val, quiet) => {
  const store = ansStore(ns);
  store[id] = val;
  delete S.errors[ns+'-'+id];
  // '통증이 없다'로 바꾸면 앞서 고른 부위와 강도를 비웁니다.
  // (안 비우면 화면에서 사라진 답이 그대로 저장됩니다)
  if(id === 'pain_has' && !PAIN_YES.includes(val)){
    store.injury = []; store.injury_vas = {}; store.pain = 0;
    delete S.errors[ns+'-injury'];
  }
  if(!quiet) render();
};
window.toggleAns = (ns, id, val) => {
  const store = ansStore(ns);
  const arr = Array.isArray(store[id]) ? [...store[id]] : [];
  const i = arr.indexOf(val);
  i>=0 ? arr.splice(i,1) : arr.push(val);
  store[id] = arr;
  delete S.errors[ns+'-'+id];
  render();
};
/* 바디맵·부위 문항 전용 토글 — '없음'은 다른 부위와 함께 고를 수 없습니다. */
window.toggleBody = (ns, id, val) => {
  const store = ansStore(ns);
  let arr = Array.isArray(store[id]) ? [...store[id]] : [];
  if(val === '없음'){
    arr = arr.includes('없음') ? [] : ['없음'];
  }else{
    arr = arr.filter(x => x !== '없음');
    const i = arr.indexOf(val);
    i >= 0 ? arr.splice(i, 1) : arr.push(val);
  }
  store[id] = arr;
  // 목록에서 켠 부위도 곧바로 강도를 고를 수 있게 '고른 부위'로 둡니다.
  if(val !== '없음' && arr.includes(val)) setFocus(ns, id, val);
  else if(!arr.includes(val) && focusOf(ns, id) === val)
    setFocus(ns, id, arr[arr.length - 1] || null);
  // 고르지 않은 부위의 통증 강도는 함께 지웁니다.
  const vm = {...vasOf(store, id)};
  Object.keys(vm).forEach(k => { if(!arr.includes(k)) delete vm[k]; });
  store[id + '_vas'] = vm;
  syncPain(store, id);
  delete S.errors[ns+'-'+id];
  delete S.errors[ns+'-'+id+'_vas'];
  // 방금 고른 부위가 지금 보고 있는 그림에 없으면, 보이는 쪽으로 넘겨 줍니다.
  if(typeof BM_VIEWS === 'object' && val !== '없음' && val !== '기타' && arr.includes(val)){
    const cur = bmViewOf(ns, id);
    if(!bmNamesIn(cur).includes(val)){
      const other = BM_VIEW_ORDER.find(v => bmNamesIn(v).includes(val));
      if(other) BMVIEW[ns + '-' + id] = other;
    }
  }
  render();
};

function validate(list, store, ns){
  S.errors = {};
  // 화면에 나오지 않는 문항은 검사하지 않습니다.
  list = list.filter(q => !q.when || q.when(store));
  for(const q of list){
    if(!q.required) continue;
    const v = store[q.id];
    const empty = v===undefined || v===null || v==='' ||
                  (Array.isArray(v) && v.length===0) || (q.type==='consent' && !v);
    if(empty) S.errors[ns+'-'+q.id] =
        q.type==='consent' ? '동의가 필요합니다.'
      : q.type==='rrn'     ? '주민등록번호 앞 7자리를 정확히 입력해 주세요.'
      : q.type==='bodymap' ? '그림에서 아픈 부위를 눌러 주세요.'
      : '필수 항목입니다.';
  }
  // 부위를 골랐다면 부위마다 통증 강도도 골라야 합니다.
  for(const q of list){
    if(q.type !== 'bodymap' || q.novas) continue;
    const sel = Array.isArray(store[q.id]) ? store[q.id] : [];
    const m = vasOf(store, q.id);
    const miss = sel.filter(p => p !== '없음' && typeof m[p] !== 'number');
    if(miss.length)
      S.errors[ns + '-' + q.id] = `${miss.join(', ')} 의 통증 강도를 골라 주세요.`;
  }

  // "기타" 를 골랐다면 무엇인지 적어야 합니다.
  for(const q of list){
    if(!etcPicked(q, store[q.id])) continue;
    if(!String(store[q.id + '_etc'] || '').trim())
      S.errors[ns + '-' + q.id + '_etc'] = '기타를 고르셨습니다. 어떤 것인지 직접 적어 주세요.';
  }
  return Object.keys(S.errors).length===0;
}

   공통 뼈대 — 상단바 / 사이드바 / 푸터

/* 신청 단계
   기본은 세 단계입니다.  프로그램 선택 → 일정 선택 → 신청 완료
   앞선 프로그램을 마치고 다시 신청하는 경우에만
   '스트레스 확인' 한 단계가 사이에 들어갑니다. */
const STEP_PROGRAM  = {key:'program',  label:'Program',  ko:'프로그램 선택'};
const STEP_SCHEDULE = {key:'schedule', label:'Schedule', ko:'일정 선택'};
const STEP_CHECK    = {key:'check',    label:'Check-in', ko:'통증 확인'};
const STEP_DONE     = {key:'done',     label:'Done',     ko:'신청 완료'};

/* 앞선 프로그램을 마치고 다시 신청하는 경우에는
   '통증 상담'이 프로그램 선택보다 먼저 옵니다.
     통증 상담 → 프로그램 선택 → 일정 선택 → 신청 완료 */
function stepList(){
  const base = S.needCheck
    ? [STEP_CHECK, STEP_PROGRAM, STEP_SCHEDULE, STEP_DONE]
    : [STEP_PROGRAM, STEP_SCHEDULE, STEP_DONE];
  return base.map((d, i) => ({n: i+1, ...d}));
}
/* S.step 은 언제나 1=프로그램 2=일정 3=완료 입니다.
   통증 상담은 그 앞에 붙는 별도 단계(S.checkDone)로 다룹니다. */
function doneStep(){ return 3; }
function curStepNo(){
  if(S.needCheck && !S.checkDone) return 1;
  return S.step + (S.needCheck ? 1 : 0);
}

/* 휴대폰 번호: 숫자만 받아 010-1234-5678 형태로 자동 하이픈 */
function fmtPhone(v){
  const d = String(v||'').replace(/\D/g,'').slice(0,11);
  if(d.length < 4)  return d;
  if(d.length < 8)  return d.slice(0,3) + '-' + d.slice(3);
  return d.slice(0,3) + '-' + d.slice(3, d.length-4) + '-' + d.slice(-4);
}
function validPhone(v){
  return /^01[016789]-\d{3,4}-\d{4}$/.test(String(v||'').trim());
}
window.setAuthPhone = (el) => {
  AUTH.phone = fmtPhone(el.value);
  el.value = AUTH.phone;
};

const JOIN = { query:'', picked:null, msg:'', busy:false };

window.joinConfirm = async () => {
  if(!JOIN.picked) return;
  JOIN.busy = true; JOIN.msg = ''; render();
  const res = await DB.setCompany(JOIN.picked.id);
  JOIN.busy = false;
  if(!res.ok){ JOIN.msg = res.msg || '연결에 실패했습니다.'; return render(); }
  S.auth.user = { ...S.auth.user, company: JOIN.picked.id };
  S.form.company = JOIN.picked.id;
  toast(`${JOIN.picked.name} 소속으로 연결했습니다.`);
  JOIN.picked = null; JOIN.query = '';
  S.nav.emp = 'home';
  // 회사가 정해졌으니 이 회사 기준으로 목록을 다시 받습니다.

};

/* ============================================================
   통증 강도 VAS — 숫자 대신 색의 진하기로 고릅니다.
   0(아주 연함) ~ 10(아주 진함). 저장 값은 예전과 같은 숫자라
   '나의 변화' 그래프와 관리자 집계는 그대로 씁니다.
   ============================================================ */
/* 통증 강도는 1~5 다섯 단계입니다.
   부위를 칠한다는 것 자체가 '아프다'는 뜻이라 0(통증 없음)은 고르개에서 뺐습니다.
   통증이 없으면 부위를 고르지 않거나 '없음'을 선택하면 됩니다. */
const VAS_MIN = 1;
const VAS_MAX = 5;
const VAS_WORDS = ['통증 없음','약함','조금 있음','보통','심함','매우 심함'];

/* 가장 진한 5단계는 예전 10단계 눈금의 8단계 색입니다.
   거기서부터 노랑 쪽으로 크게 벌려, 옆 단계와 색상 자체가 달라 보이게 했습니다. */
const VAS_STOPS = [
  [235, 235, 225],  // 0  쓰이지 않음 (통증 없음)
  [255, 225, 140],  // 1  약함
  [255, 186,  60],  // 2  조금 있음
  [252, 140,  30],  // 3  보통
  [238,  88,  36],  // 4  심함
  [214,  40,  44],  // 5  매우 심함
];
function vasRGB(n){
  const i = Math.max(0, Math.min(VAS_MAX, Math.round(n)));
  return VAS_STOPS[i].map(x => x / 255);
}
function vasColor(n){
  const c = VAS_STOPS[Math.max(0, Math.min(VAS_MAX, Math.round(n)))];
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
const vasInk = n => (n >= VAS_MAX ? '#fff' : '#7A3B00');

/* ---------- 부위별 통증 강도 ----------
   저장 형태
     injury      : ['목','허리']            고른 부위
     injury_vas  : { '목':2, '허리':4 }      부위마다 고른 강도
     pain        : 4                        그중 가장 센 값 (그래프·집계용)
   pain 은 예전과 같은 숫자 한 칸이라 '나의 변화'와 관리자 집계는 그대로 씁니다. */
function vasOf(store, qid){
  const m = store[qid + '_vas'];
  return (m && typeof m === 'object') ? m : {};
}

/* 고른 부위 중 가장 센 강도를 pain 에 옮겨 둡니다. */
function syncPain(store, qid){
  if(qid !== 'injury') return;                 // 주된 부위 문항만 대표값을 만듭니다
  const sel = Array.isArray(store[qid]) ? store[qid] : [];
  const m = vasOf(store, qid);
  const vals = sel.map(p => m[p]).filter(v => typeof v === 'number');
  if(sel.includes('없음')) { store.pain = 0; return; }
  store.pain = vals.length ? Math.max(...vals) : undefined;
}

/* 지금 강도를 고르고 있는 부위 (문항마다 따로 기억).
   부위를 먼저 누르고, 그다음 아래에서 강도를 고르는 순서입니다. */
const BMSEL = {};
const focusOf = (ns, qid) => BMSEL[ns + '-' + qid] || null;
const setFocus = (ns, qid, part) => { BMSEL[ns + '-' + qid] = part; };

/* 부위를 누르면 지금 고른 강도로 칠합니다.
   같은 강도로 다시 누르면 선택이 풀리고, 다른 강도면 그 색으로 바뀝니다. */
/* 그림에서 부위를 누릅니다.
   처음 누르면 고른 부위가 되고, 강도는 아래에서 이어서 고릅니다.
   이미 고르고 있는 부위를 다시 누르면 선택이 풀립니다. */
window.paintBody = (ns, qid, part) => {
  const store = ansStore(ns);
  let arr = Array.isArray(store[qid]) ? [...store[qid]] : [];
  const m = {...vasOf(store, qid)};
  arr = arr.filter(x => x !== '없음');

  if(arr.includes(part)){
    if(focusOf(ns, qid) === part){                 // 같은 부위를 다시 → 선택 해제
      arr = arr.filter(x => x !== part);
      delete m[part];
      setFocus(ns, qid, arr[arr.length - 1] || null);
    }else{
      setFocus(ns, qid, part);                     // 이미 고른 부위 → 강도만 다시
    }
  }else{
    arr.push(part);                                // 새 부위 → 강도는 아직 없음
    setFocus(ns, qid, part);
  }

  store[qid] = arr;
  store[qid + '_vas'] = m;
  syncPain(store, qid);
  delete S.errors[ns + '-' + qid];
  render();
};

/* 지금 고른 부위의 통증 강도를 정합니다. */
window.setFocusLevel = (ns, qid, lv) => {
  const part = focusOf(ns, qid);
  if(!part) return;
  const store = ansStore(ns);
  const m = {...vasOf(store, qid)};
  m[part] = lv;
  store[qid + '_vas'] = m;
  syncPain(store, qid);
  delete S.errors[ns + '-' + qid];
  render();
};

window.setPartVas = (ns, qid, part, lv) => {
  const store = ansStore(ns);
  const m = {...vasOf(store, qid)};
  m[part] = lv;
  store[qid + '_vas'] = m;
  syncPain(store, qid);
  render();
};

/* 통증 강도 고르개를 그림 옆에 둘지(true) 위에 둘지(false).
   두 배치를 한 파일에서 바꿔 볼 수 있게 상수로 뺐습니다. */
const BM_VAS_SIDE = false;
/* true 면 위/옆의 큰 고르개 대신, 누른 부위 바로 옆에 작은 말풍선으로 강도를 고릅니다. */
const BM_VAS_POP = true;

/* 통증 강도 고르개.
   여기서 강도를 고른 다음 그림에서 부위를 누르면 그 색으로 칠해집니다. */
function vasBrushBar(ns, q){
  if(q.novas) return '';
  const store = ansStore(ns);
  const sel = (Array.isArray(store[q.id]) ? store[q.id] : []).filter(x => x !== '없음');
  const part = focusOf(ns, q.id);
  const lv = part ? vasOf(store, q.id)[part] : undefined;
  const nums = [];
  for(let i = VAS_MIN; i <= VAS_MAX; i++) nums.push(i);

  if(!part){
    return `<div class="bmbrush wait">
      <div class="bmbrush-h">${ico('touch_app','')}
        <b>그림에서 아픈 부위를 먼저 눌러 주세요.</b>
        부위를 고르면 여기에서 통증 강도를 정합니다.</div>
    </div>`;
  }

  const left = sel.filter(p => typeof vasOf(store, q.id)[p] !== 'number').length;
  return `<div class="bmbrush">
    <div class="bmbrush-h">${ico('colorize','')}
      <b>${esc(part)}</b> 의 통증 강도를 골라 주세요.
      ${left ? `<span>강도를 정하지 않은 부위 ${left}곳</span>` : ''}</div>
    <div class="bmbrush-row">${nums.map(i => `
      <button type="button" class="bru${lv === i ? ' on' : ''}"
        style="background:${vasColor(i)};color:${vasInk(i)}"
        data-w="${esc(VAS_WORDS[i])}"
        aria-label="${esc(part)} ${i}단계 · ${VAS_WORDS[i]}"
        onclick="setFocusLevel('${ns}','${q.id}',${i})">${i}</button>`).join('')}
    </div>
    <div class="bmbrush-l"><span>약함</span>
      <b>${typeof lv === 'number' ? lv + ' · ' + esc(VAS_WORDS[lv]) : '아직 고르지 않음'}</b>
      <span>매우 심함</span></div>
  </div>`;
}

/* 그림 아래 요약 — 부위마다 고른 강도를 색 칩으로 */
function vasChips(sel, vasMap, etc){
  const picked = sel.filter(x => x !== '없음');
  if(!picked.length) return '';
  return `<div class="pv-cells">${picked.map(p => {
    const lv = vasMap[p];
    const nm = (p === '기타' && String(etc || '').trim()) ? '기타 · ' + etc : p;
    return `<span class="vas-cell"><i style="background:${
      typeof lv === 'number' ? vasColor(lv) : '#E4E8DA'}"></i>${esc(nm)}${
      typeof lv === 'number' ? ` <b>${lv}</b><small>/${VAS_MAX}</small>` : ''}</span>`;
  }).join('')}</div>`;
}

/* MY·관리자 화면에서 부위별 강도를 한 칸으로 */
function partVasCardHTML(ans){
  const m = (ans && ans.injury_vas) || {};
  const sel = Array.isArray(ans && ans.injury) ? ans.injury : [];
  const rows = sel.filter(p => typeof m[p] === 'number');

    <div class="pv-cells">${rows.map(p => `<span class="vas-cell">
      <i style="background:${vasColor(m[p])}"></i>${esc(p)}
      <b>${m[p]}</b><small>/${VAS_MAX}</small></span>`).join('')}</div>
  </div>`;
}

/* 관리자 화면에서 한 칸으로 보여 줄 때 */
function vasCellHTML(v){

}

               width="${BM_IMG_W * BM_SCALE}" height="${BM_VIEWS.front.h * BM_SCALE}"/>
        <!-- 뼈의 명암은 살리고 색만 바꿉니다. 투명한 배경은 그대로 둡니다.
             통증 강도(1~5)마다 하나씩 만들어, 부위 색이 강도에 따라 달라집니다. -->
        ${(() => { const out = [];
          for(let i = VAS_MIN; i <= VAS_MAX; i++){
            const c = vasRGB(i);
            const lo = c.map(x => x * 0.55);   // 너무 어두워지면 핏빛으로 보입니다
            out.push(`<filter id="bmMark${i}" color-interpolation-filters="sRGB">
              <feColorMatrix type="saturate" values="0"/>
              <feComponentTransfer>
                <feFuncR type="table" tableValues="${lo[0].toFixed(3)} ${c[0].toFixed(3)}"/>
                <feFuncG type="table" tableValues="${lo[1].toFixed(3)} ${c[1].toFixed(3)}"/>
                <feFuncB type="table" tableValues="${lo[2].toFixed(3)} ${c[2].toFixed(3)}"/>
              </feComponentTransfer>
            </filter>`);
          }
          // 강도를 아직 고르지 않은 부위용 — 옅은 회색
          out.push(`<filter id="bmMarkSel" color-interpolation-filters="sRGB">
            <feColorMatrix type="saturate" values="0"/>
            <feComponentTransfer>
              <feFuncR type="table" tableValues="0.42 0.78"/>
              <feFuncG type="table" tableValues="0.44 0.80"/>
              <feFuncB type="table" tableValues="0.40 0.74"/>
            </feComponentTransfer>
          </filter>`);
          return out.join(''); })()}
      </defs>
    </svg>`;
  const svg = wrap.firstElementChild;
  // 이미지 주소는 여기서 한 번만 넣습니다. (구형 뷰어를 위해 xlink 도 함께)
  [['bmSkelF', BM_SKELETON_FRONT]].forEach(([id, src]) => {
    const im = svg.querySelector('#' + id);
    im.setAttribute('href', src);
    im.setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', src);
  });
  document.body.appendChild(svg);
})();

/* 누른 부위 옆에 붙는 작은 강도 고르개(말풍선).
   위치는 그림이 그려진 뒤 bmPlacePopovers() 가 잡습니다. */
function vasPopover(ns, q, uid){
  if(q.novas || q.readonly) return '';
  const store = ansStore(ns);
  const part = focusOf(ns, q.id);
  if(!part) return '';
  const m = vasOf(store, q.id);
  const lv = m[part];
  const sel = (Array.isArray(store[q.id]) ? store[q.id] : []).filter(x => x !== '없음');
  const left = sel.filter(p => typeof m[p] !== 'number').length;
  const nums = [];
  for(let i = VAS_MIN; i <= VAS_MAX; i++) nums.push(i);
  return `<div class="bmpop" id="bmpop-${uid}" role="group" aria-label="${esc(part)} 통증 강도">
    <div class="bmpop-t"><b>${esc(part)}</b>
      <span>${typeof lv === 'number' ? lv + ' · ' + esc(VAS_WORDS[lv]) : '강도를 골라 주세요'}</span></div>
    <div class="bmpop-row">${nums.map(i => `
      <button type="button" class="bru${lv === i ? ' on' : ''}"
        style="background:${vasColor(i)};color:${vasInk(i)}"
        title="${i} · ${esc(VAS_WORDS[i])}" aria-label="${esc(part)} ${i}단계 · ${VAS_WORDS[i]}"
        onclick="setFocusLevel('${ns}','${q.id}',${i})">${i}</button>`).join('')}
    </div>
    <div class="bmpop-l"><span>약함</span>${left > 1 ? `<em>미정 ${left}곳</em>` : ''}<span>매우 심함</span></div>
  </div>`;
}

/* 그림 안에서 지금 고른 부위(.bmp.focus)의 위치를 재서 말풍선을 그 옆에 둡니다.
   그림 오른쪽에 자리가 없으면 왼쪽에, 위아래는 그림 안으로 맞춥니다. */
function bmPlacePopovers(){
  document.querySelectorAll('.bmpop').forEach(pop => {
    const body = pop.closest('.bmbody');
    const svg  = body && body.querySelector('svg.bmsvg');
    if(!svg){ pop.style.visibility = 'hidden'; return; }
    const rects = svg.querySelectorAll('.bmp.focus .hit rect');
    if(!rects.length){ pop.style.visibility = 'hidden'; return; }
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    rects.forEach(r => {
      const b = r.getBBox();
      x1 = Math.min(x1, b.x); y1 = Math.min(y1, b.y);
      x2 = Math.max(x2, b.x + b.width); y2 = Math.max(y2, b.y + b.height);
    });
    const sr = svg.getBoundingClientRect(), br = body.getBoundingClientRect();
    const k  = sr.width / BM_VW;
    const ox = sr.left - br.left, oy = sr.top - br.top;
    const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 10;
    // 이름표를 가리지 않도록 그림 바깥(오른쪽 → 왼쪽)을 먼저 쓰고, 자리가 없으면 부위 옆에 둡니다.
    let left, side;
    const roomR = br.width - (ox + sr.width), roomL = ox;
    if(br.width < 480){                                  // 폰: 그림 위를 덮지 않도록 부위 아래에
      left = Math.max(4, Math.min(br.width - pw - 4, ox + ((x1 + x2) / 2) * k - pw / 2));
      pop.style.left = left + 'px'; pop.style.top = (oy + y2 * k + gap) + 'px';
      pop.dataset.side = 'b'; pop.style.visibility = 'visible'; return;
    }
    if(roomR >= pw + gap){ left = ox + sr.width + 2; side = 'r'; }
    else if(roomL >= pw + gap){ left = ox - pw - 2; side = 'l'; }
    else { left = ox + x2 * k + gap; side = 'r';
      if(left + pw > br.width - 4){ left = ox + x1 * k - pw - gap; side = 'l'; } }
    if(left < 4){ left = Math.max(4, Math.min(br.width - pw - 4, ox + ((x1 + x2) / 2) * k - pw / 2)); side = 'b'; }
    let top = oy + ((y1 + y2) / 2) * k - ph / 2;
    if(side === 'b') top = oy + y2 * k + gap;
    top = Math.max(4, Math.min(br.height - ph - 4, top));
    pop.style.left = left + 'px';
    pop.style.top  = top + 'px';
    pop.dataset.side = side;
    pop.style.visibility = 'visible';
  });
}
window.addEventListener('resize', () => bmPlacePopovers());

function bodyMapHTML(ns, qid, sel, etc, q, vasMap){
  sel = Array.isArray(sel) ? sel : [];
  q = q || {id: qid};
  vasMap = vasMap || {};
  const uid  = (ns + '-' + qid).replace(/[^A-Za-z0-9_-]/g, '');
  const vkey = bmViewOf(ns, qid);
  const view = BM_VIEWS[vkey];

  const focus = focusOf(ns, q.id || qid);
  const clips = [], parts = [], labels = [], lbhits = [];
  view.regions.forEach((r, i) => {
    const name = r[0], boxes = r[1];
    const cid  = 'bmc-' + uid + '-' + vkey + '-' + i;
    const rects = boxes.map(b =>
      `<rect x="${bmX(b[0]).toFixed(1)}" y="${bmY(b[1]).toFixed(1)}" `
      + `width="${((b[2]-b[0]) * BM_SCALE).toFixed(1)}" `
      + `height="${((b[3]-b[1]) * BM_SCALE).toFixed(1)}" rx="7"/>`).join('');

    clips.push(`<clipPath id="${cid}">${rects}</clipPath>`);

    const lb = view.labels[name] || [0, 'right', 0, 0];
    const ly = bmY(lb[0]), lx = (lb[1] === 'right') ? 258 : 2;
    const label =
      `<line class="lead" x1="${lb[2]}" y1="${(ly-4).toFixed(1)}" `
      + `x2="${lb[3]}" y2="${(ly-4).toFixed(1)}"/>`
      + `<text x="${lx}" y="${ly.toFixed(1)}">${name}</text>`;

    const on = sel.includes(name) ? ' on' : '';
    const fx = (focus === name) ? ' focus' : '';
    // 이 부위에 칠해진 강도. 아직 없으면 지금 고른 강도로 미리 보여 줍니다.
    // 강도를 아직 안 고른 부위는 옅은 회색으로 '고른 상태'만 보여 줍니다.
    const lv = vasMap[name];
    const picked = (typeof lv === 'number');
    const act = q.readonly ? ''
              : q.novas    ? `toggleBody('${ns}','${qid}','${name}')`
                           : `paintBody('${ns}','${qid}','${name}')`;
    // 강도 색 필터는 1~VAS_MAX 만 있으므로 범위를 벗어나지 않게 잠급니다.
    // (예전에 bmMark10 을 쓰던 코드가 남아 있어 색이 아예 칠해지지 않았습니다)
    const fil = picked ? ('bmMark' + Math.max(VAS_MIN, Math.min(VAS_MAX, lv)))
                       : 'bmMarkSel';
    // 이름표는 그림보다 아래 층에 깔아, 지시선이 뼈 뒤로 지나가게 합니다.
    labels.push(
      `<g class="bmp${on}${fx}${q.readonly?' ro':''}" ${act?`onclick="${act}"`:''}>${label}</g>`);
    // v132: 부위 이름(글씨)도 눌러서 고를 수 있게, 그림 위층에 투명한 누름 영역을 둡니다.
    if(act) lbhits.push(
      `<rect class="bmlh" x="${lx - 3}" y="${(ly - 13).toFixed(1)}" width="${Math.max(44, name.length * 10 + 8)}" height="19" rx="4"
             role="button" tabindex="0" aria-label="${name}" onclick="${act}"><title>${name}</title></rect>`);
    parts.push(
      `<g class="bmp${on}${fx}${q.readonly?' ro':''}" ${act?`role="button" tabindex="0" onclick="${act}"`:''}>
         <title>${name}${on && typeof vasMap[name] === 'number'
           ? ` · 통증 ${vasMap[name]}/${VAS_MAX}` : ''}</title>
         <use class="tint" href="#${view.img}" xlink:href="#${view.img}"
              clip-path="url(#${cid})" filter="url(#${fil})"/>
         <g class="hit">${rects}</g>
       </g>`);
  });

  // 앞/뒤 탭 — 각 시점에서 표시되는 선택 개수를 함께 보여 줍니다.
  const tabs = BM_VIEW_ORDER.map(v => {
    const cnt = sel.filter(x => bmNamesIn(v).includes(x)).length;
    return `<button type="button" class="bmtab${v === vkey ? ' on' : ''}"
              onclick="setBodyView('${ns}','${qid}','${v}')">${BM_VIEWS[v].label}
              ${cnt ? `<span class="bmtab-n">${cnt}</span>` : ''}</button>`;
  }).join('');

  // 다른 시점에서만 짚을 수 있는 부위를 골랐다면 알려 줍니다.
  const here  = bmNamesIn(vkey);
  const other = sel.filter(x => x !== '없음' && x !== '기타' && !here.includes(x));

  const picked = sel.filter(x => x !== '없음');
  return `<div class="bmwrap">
    ${BM_VAS_POP || BM_VAS_SIDE ? '' : vasBrushBar(ns, q)}
    ${BM_VIEW_ORDER.length > 1 ? `<div class="bmtabs">${tabs}</div>` : ''}
    <div class="bmbody${BM_VAS_SIDE && !BM_VAS_POP ? ' side' : ' one'}${BM_VAS_POP ? ' pop' : ''}">
      <svg class="bmsvg" viewBox="0 0 ${BM_VW} ${BM_VH}"
           xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
           role="img" aria-label="인체 골격 ${view.label}면 그림에서 불편한 부위를 선택합니다">
        <defs>${clips.join('')}</defs>
        ${labels.join('')}
        <use href="#${view.img}" xlink:href="#${view.img}"/>
        ${parts.join('')}
        ${lbhits.join('')}
      </svg>
      ${BM_VAS_POP ? vasPopover(ns, q, uid) : BM_VAS_SIDE ? vasBrushBar(ns, q) : ''}
    </div>
    ${q.readonly ? ''
      : sel.includes('없음')
      ? `<div class="bmfoot">불편한 곳이 <b>없음</b>으로 표시되어 있습니다.</div>`
      : picked.length
        ? `<div class="bmfoot">${q.novas ? '선택한 부위 · <b>' + picked.map(esc).join(', ') + '</b>'
            : '고른 부위와 통증 강도'}</div>${q.novas ? '' : vasChips(sel, vasMap, etc)}`
        : `<div class="bmfoot">아직 고른 부위가 없습니다.${
             (q.options || []).includes('없음')
               ? ' 해당 없으면 위 목록에서 <b>없음</b>을 골라 주세요.'
               : ' 아픈 곳을 그림에서 눌러 주세요.'}</div>`}
    ${other.length ? `<div class="bmnote">${ico('swap_horiz','')}
      <b>${other.map(esc).join(', ')}</b> · 다른 쪽 그림에서 보실 수 있습니다</div>` : ''}
  </div>`;
}


/* ---------- 주민등록번호 앞 7자리 → 성별 · 연령대 ----------
   원본 숫자는 화면에서만 잠깐 들고 있고(RRNBUF), 저장소에는
   판정 결과(생년 · 성별 · 연령대)만 남깁니다. */
const RRNBUF = {};

function ageBandOf(age){
  if(age < 20) return '10대';
  if(age < 30) return '20대';
  if(age < 40) return '30대';
  if(age < 50) return '40대';
  if(age < 60) return '50대';
  return '60대 이상';
}

/* 뒷자리 첫 숫자로 출생 세기와 성별을 읽습니다.
     1 · 3 → 남자      2 · 4 → 여자
     5 · 7 → 남자(외국인)   6 · 8 → 여자(외국인)
     9    → 남자(1800년대)  0    → 여자(1800년대) */
const RRN_CENTURY = {1:1900, 2:1900, 3:2000, 4:2000, 5:1900, 6:1900, 7:2000, 8:2000, 9:1800, 0:1800};
const RRN_SEX = {1:'남성', 3:'남성', 5:'남성', 7:'남성', 9:'남성',
                 2:'여성', 4:'여성', 6:'여성', 8:'여성', 0:'여성'};

function rrnInfo(front, g){
  front = String(front || '').replace(/\D/g, '');
  g     = String(g     || '').replace(/\D/g, '');
  if(front.length < 6 || g.length < 1)
    return {ok:false, msg:'앞 6자리와 뒷자리 첫 숫자를 모두 입력해 주세요.'};

  const gd = Number(g);
  const century = RRN_CENTURY[gd];
  if(century === undefined)
    return {ok:false, msg:'뒷자리 첫 숫자를 다시 확인해 주세요.'};

  const yy = Number(front.slice(0,2)), mm = Number(front.slice(2,4)), dd = Number(front.slice(4,6));
  const year = century + yy;
  const d = new Date(year, mm - 1, dd);
  if(d.getFullYear() !== year || d.getMonth() !== mm - 1 || d.getDate() !== dd)
    return {ok:false, msg:'생년월일을 다시 확인해 주세요.'};

  const now = new Date();
  let age = now.getFullYear() - year;
  const bd = new Date(now.getFullYear(), mm - 1, dd);
  if(now < bd) age--;
  if(age < 0 || age > 120)
    return {ok:false, msg:'생년월일을 다시 확인해 주세요.'};

  return {ok:true, year, age, sex: RRN_SEX[gd], band: ageBandOf(age)};
}

function rrnResultHTML(info, touched){
  if(!touched) return '';
  return info.ok
    ? `<div class="rrn-res ok">${ico('check_circle','')}
         ${info.year}년생 · 만 ${info.age}세 · ${info.sex} · ${info.band}</div>`
    : `<div class="rrn-res no">${ico('error','')}${esc(info.msg)}</div>`;
}

function rrnFieldHTML(ns, qid){
  const k = ns + '-' + qid;
  const b = RRNBUF[k] || (RRNBUF[k] = {front:'', g:''});
  const info = rrnInfo(b.front, b.g);
  return `<div class="rrnbox">
    <div class="rrnrow">
      <input id="rrnF-${k}" class="rrn-i rrn-f" type="text" inputmode="numeric"
             autocomplete="off" maxlength="6" placeholder="생년월일 6자리"
             value="${esc(b.front)}" oninput="setRRN('${ns}','${qid}','front',this)">
      <span class="rrn-dash">–</span>
      <input id="rrnG-${k}" class="rrn-i rrn-g" type="text" inputmode="numeric"
             autocomplete="off" maxlength="1" placeholder="0"
             value="${esc(b.g)}" oninput="setRRN('${ns}','${qid}','g',this)">
      <span class="rrn-mask" aria-hidden="true">${'<i>●</i>'.repeat(6)}</span>
    </div>
    <p class="rrn-help">뒤 <b>6자리는 입력할 수 없고 저장되지도 않습니다.</b>
      앞 7자리는 성별·연령대를 계산하는 데만 쓰이며, 계산이 끝나면 숫자는 남기지 않습니다.</p>
    <div id="rrnRes-${k}">${rrnResultHTML(info, !!(b.front || b.g))}</div>
  </div>`;
}

/* 입력할 때마다 화면 전체를 다시 그리면 포커스가 끊기므로,
   결과 칸만 직접 갈아 끼웁니다. */
window.setRRN = (ns, qid, which, el) => {
  const k = ns + '-' + qid;
  const b = RRNBUF[k] || (RRNBUF[k] = {front:'', g:''});
  const max = (which === 'front') ? 6 : 1;
  const clean = String(el.value || '').replace(/\D/g, '').slice(0, max);
  if(el.value !== clean) el.value = clean;
  b[which] = clean;

  const store = ansStore(ns);
  const info  = rrnInfo(b.front, b.g);
  if(info.ok){
    store[qid]       = info.year + '년생 · ' + info.sex + ' · ' + info.band;
    store.sex        = info.sex;
    store.age        = info.band;
    store.birth_year = info.year;
    delete S.errors[ns + '-' + qid];
  }else{
    store[qid] = ''; store.sex = ''; store.age = '';
    delete store.birth_year;
  }

  const box = document.getElementById('rrnRes-' + k);
  if(box) box.innerHTML = rrnResultHTML(info, true);

  // 자동 판정 결과 칸(성별·연령대)도 즉시 갱신합니다.
  ['sex','age'].forEach(id => {
    const cell = document.querySelector('#f-' + ns + '-' + id + ' .autoval');
    if(!cell) return;
    const val = store[id];
    cell.className = 'autoval' + (val ? ' on' : '');
    cell.textContent = val || '위 주민등록번호 입력에 따라 자동으로 채워집니다';
  });

  if(which === 'front' && clean.length === 6){
    const g = document.getElementById('rrnG-' + k);
    if(g && !g.value) g.focus();
  }
};

window.submitBaseline = async () => {
  BASE.msg = '';
  if(!validate(BASELINE_Q, BASE.ans, 'base')){
    render();
    document.querySelector('.qerr, .err')?.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  BASE.busy = true; render();
  const res = await DB.saveBaseline(BASE.ans);
  BASE.busy = false;
  if(!res.ok){ BASE.msg = res.msg || '저장에 실패했습니다.'; return render(); }

  BASE.saved = {...BASE.ans};
  BASE.savedAt = res.at;
  BASE.history = [];
  S.auth.user = {...S.auth.user, baselineAt: res.at};
  toast('첫 문진을 저장했습니다.');
  render(); window.scrollTo(0,0);
};

window.submitFirstPw = async () => {
  if(FPW.busy) return; const u = S.auth.user; let msg = '';
  const rr = rrnInfo(AUTH.rrnF, AUTH.rrnG);
  if(!String(FPW.name||'').trim()) msg = '이름을 입력해 주세요.';
  else if(!rr.ok) msg = rr.msg;
  else if(!validPhone(AUTH.phone)) msg = '휴대폰 번호를 확인해 주세요. (예: 010-1234-5678)';
  else if(!FPW.cur) msg = '임시 비밀번호를 입력해 주세요.';
  else if((FPW.pw||'').length < 6) msg = '새 비밀번호는 6자 이상으로 입력해 주세요.';
  else if(FPW.pw !== FPW.pw2) msg = '새 비밀번호가 서로 다릅니다.';
  else if(FPW.pw === FPW.cur) msg = '임시 비밀번호와 다른 비밀번호를 입력해 주세요.';
  if(msg){ FPW.msg = msg; return render(); }
  FPW.busy = true; FPW.msg = ''; render();
  let res; try{ res = await DB.memberChangePw(u.email, FPW.cur, FPW.pw, true); }catch(e){ res = {ok:false, msg:'변경하지 못했습니다.'}; }
  if(res && res.ok){
    const profile = {sex: rr.sex, age: rr.band, birth_year: rr.year};
    try{ await DB.setFirstLoginInfo(u.email, FPW.name.trim(), profile, AUTH.phone.trim()); }catch(e){ console.error(e); }
    Object.assign(u, {mustChangePw:false, name:FPW.name.trim(), profile, phone:AUTH.phone.trim()});
    S.form.name = u.name;
    AUTH.rrnF = ''; AUTH.rrnG = ''; FPW.cur = FPW.pw = FPW.pw2 = '';
    toast(u.company ? '저장했습니다. 이어서 사전 상담을 진행해 주세요.' : '저장했습니다. 소속 회사를 선택해 주세요.');
  } else FPW.msg = (res && res.msg) || '변경하지 못했습니다.';
  FPW.busy = false; render();
};

window.closePwBox = () => { const b = document.getElementById('pwbox'); if(b) b.remove(); };
window.submitPwChange = async () => {
  if(PWC.busy) return;
  const email = (PWC.email||'').trim();
  let msg = '';
  if(!email) msg = '아이디를 입력해 주세요.';
  else if(!PWC.cur) msg = '현재 비밀번호를 입력해 주세요.';
  else if((PWC.pw||'').length < 6) msg = '새 비밀번호는 6자 이상으로 입력해 주세요.';
  else if(PWC.pw !== PWC.pw2) msg = '새 비밀번호가 서로 다릅니다.';
  else if(PWC.pw === PWC.cur) msg = '현재 비밀번호와 다른 비밀번호를 입력해 주세요.';
  if(msg){ PWC.msg = msg; drawPwBox(); return; }
  PWC.busy = true; PWC.msg = ''; drawPwBox();
  let res;
  try{ res = await DB.memberChangePw(email, PWC.cur, PWC.pw); }
  catch(e){ res = {ok:false, msg:'변경하지 못했습니다. 잠시 후 다시 시도해 주세요.'}; }
  PWC.busy = false;
  if(res && res.ok){ PWC.done = true; PWC.cur = PWC.pw = PWC.pw2 = ''; AUTH.email = email; AUTH.pw = ''; }
  else PWC.msg = (res && res.msg) || '변경하지 못했습니다.';
  drawPwBox();
  if(PWC.done){ try{ render(); }catch(e){} }
};

/* 올해 쓴 횟수와 남은 신청 기회.
   MG.list 는 취소분을 빼고 세며, 목록을 아직 못 받았으면 null 을 돌려줍니다. */
function usedThisYearCount(){
  if(!MG.list) return null;
  const y = new Date().getFullYear();
  return MG.list.filter(b => b.status !== 'canceled'
    && new Date(b.slot_date).getFullYear() === y).length;
}
function quotaLeft(){
  const used = usedThisYearCount();
  if(used === null || CONFIG.quota == null) return null;
  return Math.max(0, CONFIG.quota - used);
}
/* 더 신청할 수 있는지 (모르면 일단 열어 둡니다 — 확정 판정은 신청할 때 서버가 합니다) */
function canBookMore(){
  const left = quotaLeft();
  return left === null || left > 0;
}

function programCard(p, slim){
  const a = availability(p.id);
  const none = !a.next;
  const noQuota = !canBookMore();          // 이미 다 썼거나 예약 중
  const blocked = none || noQuota;
  const when = a.next ? `${fmtDateShort(a.next.d)} ${a.next.t}` : '신청 가능일 없음';
  const tags = (p.tags||[]).map(t=>`<span class="prog-tag">#${esc(t)}</span>`).join('');
  return `
    <div class="program-card bg-surface-container-lowest border border-surface-container-high
                p-lg rounded-lg flex flex-col justify-between h-full shadow-[0_8px_30px_rgba(0,0,0,0.04)]
                ${blocked?'opacity-60':''}">
      <div>
        <div class="w-full rounded overflow-hidden mb-lg relative bg-surface-container progimg">
          ${p.img
            ? `<img class="w-full h-full object-contain" loading="lazy" alt="${esc(p.name)}" src="${esc(p.img)}">`
            : `<div class="w-full h-full flex items-center justify-center text-on-surface-variant/50">
                 ${ico(ICON[p.icon]||p.icon||'fitness_center','text-[40px]')}</div>`}
        </div>
        ${slim ? '' : `<h3 class="text-headline-md text-on-surface mb-xs">${esc(p.name)}</h3>
        <p class="text-body-md text-on-surface-variant mb-md">${esc(p.blurb||'')}</p>`}
        ${tags?`<div class="prog-tags mb-md">${tags}</div>`:''}
        <div class="flex flex-col gap-xs mb-md text-label-sm text-on-surface-variant">
          <span class="flex items-center gap-xs">${ico('schedule','text-[16px]')} ${p.durationMin}분 ·
            담당 ${programHosts(p).map(t => esc(t.name)).join(', ') || '배정 예정'}</span>
          <span class="flex items-center gap-xs">
            <button type="button" class="hostbtn${S.showHosts ? ' on' : ''}" onclick="toggleHostCards()"
                    aria-expanded="${S.showHosts ? 'true' : 'false'}">
              ${ico('badge','')}<span>운동처방사 프로필</span>
              <i class="hostbtn-c">${S.showHosts ? '▴' : '▾'}</i></button></span>

        </button>
      </div>
    </div>`;
}

/* 관리자가 고친 카드 내용·사진은 localStorage 에 두고, 기본값 위에 덮어씁니다.
   실서비스: trainer_cards(name pk, data jsonb, photo_url) 한 표. */
const TCARD_KEY = 'trainerCards', TPHOTO_KEY = 'trainerPhotos';
function trainerCardOvr(){ try{ return JSON.parse(KSTORE.getItem(TCARD_KEY) || '{}'); }catch{ return {}; } }
function trainerPhotoOvr(){ try{ return JSON.parse(KSTORE.getItem(TPHOTO_KEY) || '{}'); }catch{ return {}; } }
/* v191: 프로필·사진을 코드에서 새로 넣었으므로, 이 브라우저에 남아 있던 관리자 수정본(옛 사진 포함)은 한 번만 비웁니다. */
try{ if(!KSTORE.getItem('trainerOvrMig_v214')){ KSTORE.removeItem(TCARD_KEY); KSTORE.removeItem(TPHOTO_KEY); KSTORE.setItem('trainerOvrMig_v214','1'); } }catch(e){}
function trainerPhotoOf(name){ return trainerPhotoOvr()[name] || TRAINER_PHOTO[name] || ''; }
function trainerCardBase(name){
  const base = TRAINER_CARD[name];
  if(base) return Object.assign({}, base);
  const p = trainerProfile(name);
  return {theme:'blue', icon:'fitness_center', years:careerYears(name) || 0,
          quote:esc(p.intro || ''), certs:p.certs || [],
          edu: p.edu ? [p.edu] : [],
          career:(p.career || []).map(([w, t]) => careerLine(w, t)),
          spec:p.spec || []};
}
function trainerCardInfo(name){
  const b = trainerCardBase(name), o = trainerCardOvr()[name];
  const c = o ? Object.assign(b, o) : b;
  if(!Array.isArray(c.career)) c.career = [];          // v140: 예전 저장값 호환
  if(!Array.isArray(c.edu)) c.edu = c.edu ? [String(c.edu)] : [];   // v144
  return c;
}
window.saveTrainerCard = (name, patch) => {
  const all = trainerCardOvr(); all[name] = Object.assign({}, all[name] || {}, patch);
  KSTORE.setItem(TCARD_KEY, JSON.stringify(all));
};
window.resetTrainerCard = (name) => {
  const all = trainerCardOvr(); delete all[name]; KSTORE.setItem(TCARD_KEY, JSON.stringify(all));
  const ph = trainerPhotoOvr(); delete ph[name]; KSTORE.setItem(TPHOTO_KEY, JSON.stringify(ph));
  toast(`${name} 카드를 기본값으로 되돌렸습니다.`); render();
};
window.uploadTrainerPhoto = (name, input) => {
  const f = input.files && input.files[0]; if(!f) return;
  const img = new Image();
  img.onload = () => {
    // v155: 흰 배경 사진을 그대로 올려도 카드에 어울리게 — ① 흰 배경을 투명으로 ② 여백을 잘라내고 ③ PNG(투명 유지)로 저장
    const k = Math.min(1, 900 / img.naturalHeight, 700 / img.naturalWidth);
    const c = document.createElement('canvas');
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, c.width, c.height);
    const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
    // 배경 판정: 네 모서리 색이 거의 흰색이면 '흰 배경 사진'으로 보고 비슷한 색을 투명 처리
    const corner = (x, y) => { const i = (y * c.width + x) * 4; return [px[i], px[i+1], px[i+2]]; };
    const cs = [corner(2,2), corner(c.width-3,2), corner(2,c.height-3), corner(c.width-3,c.height-3)];
    const whiteBg = cs.every(v => v[0] > 225 && v[1] > 225 && v[2] > 225);
    if(whiteBg){
      for(let i = 0; i < px.length; i += 4){
        const r = px[i], g = px[i+1], b = px[i+2], a = px[i+3];
        if(a === 0) continue;
        const m = Math.min(r, g, b);
        if(m > 236) px[i+3] = 0;                                   // 거의 흰색 → 투명
        else if(m > 215) px[i+3] = Math.round(a * (236 - m) / 21);  // 경계는 부드럽게
      }
      ctx.putImageData(d, 0, 0);
    }
    // 내용이 있는 부분만 남기기 (투명 여백 제거)
    let minX = c.width, minY = c.height, maxX = 0, maxY = 0;
    for(let y = 0; y < c.height; y++) for(let x = 0; x < c.width; x++){ if(px[(y * c.width + x) * 4 + 3] > 24){ if(x < minX) minX = x; if(x > maxX) maxX = x; if(y < minY) minY = y; if(y > maxY) maxY = y; } }
    let out = c;
    if(maxX > minX && maxY > minY){
      out = document.createElement('canvas'); out.width = maxX - minX + 1; out.height = maxY - minY + 1;
      out.getContext('2d').drawImage(c, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    }
    const ph = trainerPhotoOvr(); ph[name] = whiteBg ? out.toDataURL('image/png') : out.toDataURL('image/jpeg', 0.85);
    try{ KSTORE.setItem(TPHOTO_KEY, JSON.stringify(ph)); }
    catch(e){ toast('사진이 너무 커서 저장하지 못했습니다. 더 작은 파일로 올려 주세요.'); return; }
    toast(`${name} 사진을 바꿨습니다.${whiteBg ? ' (흰 배경을 투명하게 처리)' : ''}`); render();
  };
  img.src = URL.createObjectURL(f);
};

const MG = {list:null, info:null, state:'load', changing:false, msg:''};
// state: load | list | ok | expired | canceled | changed | empty

/* 예약 상세에서 쓰는 남은 시간 — 그 예약의 '일정' 기준입니다. */
function remainMs(){
  if(!MG.info) return 0;
  return cutoffLeft(MG.info.d, MG.info.t);
}

/* 며칠 앞선 일정도 있으므로 일·시간 단위까지 표기합니다. */
function fmtRemain(ms){
  if(ms <= 0) return '마감';
  const total = Math.floor(ms/1000);
  const d = Math.floor(total/86400);
  const h = Math.floor(total%86400/3600);
  const m = Math.floor(total%3600/60);
  const s = total%60;
  if(d > 0) return `${d}일 ${h}시간`;
  if(h > 0) return `${h}시간 ${m}분`;
  return `${m}분 ${pad(s)}초`;
}

/* '프로그램 시작 1시간 전까지' 처럼 사람이 읽는 마감 안내 */
function cutoffText(dstr, tstr){
  const dt = slotAt(dstr, tstr);
  if(!dt) return `프로그램 시작 ${cutoffLabel()}까지`;
  const c = new Date(dt.getTime() - EDIT_CUTOFF_MIN*60000);
  return `${fmtDate(iso(c))} ${fmtTime(pad(c.getHours())+':'+pad(c.getMinutes()))}까지`;
}

/* ---------- 만족도 조사 ----------
   메뉴에서 따로 들어가지 않고, 예약 상세의 '일정 변경 · 예약 취소' 옆으로 들어옵니다.
   취소된 예약에는 나오지 않고, 이미 응답한 예약은 '응답 완료'로 보여 줍니다. */
const SV = {code:'', info:null, state:'load', msg:''};  // load | form | done | error

/* 예약 상세에 붙는 만족도 조사 버튼 */
/* v167: 프로그램 종료 판정 — 예약 시각 + 프로그램 길이(40분)가 지나야 '완료'. 취소는 제외. */
function sessionEndAt(b){
  if(!b || !b.slot_date || !b.slot_time) return null;
  const p = programById(b.program || 'pt') || {};
  const [y,m,d] = String(b.slot_date).split('-').map(Number);
  const [hh,mi] = String(b.slot_time).slice(0,5).split(':').map(Number);
  return new Date(y, m-1, d, hh, mi).getTime() + (p.durationMin || 40) * 60000;
}
function sessionEnded(b){
  if(!b || b.status === 'canceled') return false;
  if(b.status === 'done') return true;
  const end = sessionEndAt(b); return !!end && Date.now() >= end;
}
/* 종료 시각이 되면 화면을 다시 그려 만족도 버튼이 저절로 나타나게 합니다. */
let SESSION_END_TIMER = null;
function scheduleSessionEndRefresh(rows){
  if(SESSION_END_TIMER){ clearTimeout(SESSION_END_TIMER); SESSION_END_TIMER = null; }
  const now = Date.now();
  const next = (rows || []).map(sessionEndAt).filter(t => t && t > now).sort((a,b)=>a-b)[0];
  if(!next || next - now > 12*3600e3) return;
  SESSION_END_TIMER = setTimeout(() => { SESSION_END_TIMER = null; try{ render(); }catch(e){} }, next - now + 1000);
}
function surveyButton(i){
  const b = (MG.list || []).find(x => x.code === i.code) || i;
  if(!b || b.status === 'canceled') return '';
  if(!sessionEnded(b)){
    const end = sessionEndAt(b);
    return end ? `<span class="survey-wait">${ico('schedule','')} 만족도 조사는 프로그램 종료(${fmtTime(new Date(end).toTimeString().slice(0,5))}) 후에 열립니다</span>` : '';
  }
  if(b.survey) return `<button class="btn ghost" disabled
      style="opacity:.55;cursor:default">${ico('task_alt','')} 만족도 응답 완료</button>`;
  return `<button class="btn ghost" onclick="openSurveyFor('${esc(b.code)}')">
    ${ico('rate_review','')} 만족도 조사</button>`;
}

/* 이 예약을 대상으로 만족도 조사를 엽니다. */
window.openSurveyFor = (code) => {
  const b = (MG.list || []).find(x => x.code === code);
  if(!b){ toast('예약을 찾을 수 없습니다.'); return; }

/* ---------- 데이터 비교 분석 (부서별·연령별) ---------- */
const AGE_ORDER = AGE_BANDS;
const DEPT_ORDER = ['운용전략본부','증권운용본부','대체투자본부','투자관리부문','경영관리부문','해외지사','기타'];   // 부서별 집계 순서 (사전 상담 보기와 같아야 합니다)

// 한 그룹(부서 또는 연령)의 지표를 계산
function groupStats(rows){
  const total = rows.length;
  const done = rows.filter(r=>r.status==='done');
  const scored = rows.filter(r=>r.survey && typeof r.survey.overall==='number');
  const satVals = scored.map(r=>r.survey.overall);
  const sat = satVals.length ? satVals.reduce((a,b)=>a+b,0)/satVals.length : null;
  const npsVals = rows.filter(r=>r.survey && typeof r.survey.nps==='number').map(r=>r.survey.nps);
  const nps = npsVals.length
    ? Math.round((npsVals.filter(v=>v>=9).length - npsVals.filter(v=>v<=6).length)/npsVals.length*100)
    : null;
  const completion = total ? Math.round(done.length/total*100) : 0;
  return {count:total, done:done.length, sat, nps, completion};
}

  const rows = adminRows();

  // 데이터가 적으면 예시 데이터 안내 (KIC 실사용 빌드에서는 보이지 않음)
  const seedBar = KIC_RELEASE ? '' : `
    <div class="seed-box">
      <div>

  }

  const by = AD.analysisBy;              // 'dept' | 'age'

  const field = by==='dept' ? 'dept' : 'age';

  // 그룹별 통계
  const groups = order.map(g => {
    const gr = rows.filter(r => (r.intake?.[field]||'') === g);
    return {name:g, ...groupStats(gr)};
  }).filter(g => g.count>0);

  // 부서·연령대 정보가 없는 데이터만 있으면 비교할 그룹이 없습니다.
  if(groups.length === 0){
    return `<div class="analysis">
      <p class="sub">${by==='dept'?'부서':'연령대'} 정보가 있는 응답이 아직 없어 비교할 수 없습니다.

      ${seedBar}
    </div>`;
  }

  const metricMeta = {
    count:      {label:'참여 인원',   fmt:v=>`${v}명`,           get:g=>g.count,        color:'var(--accent)'},
    sat:        {label:'평균 만족도', fmt:v=>v==null?'–':v.toFixed(2), get:g=>g.sat,     color:'#f4a52a'},
    completion: {label:'완료율',      fmt:v=>`${v}%`,            get:g=>g.completion,   color:'#2e8b57'},
  };
  const mm = metricMeta[metric];
  const maxVal = Math.max(...groups.map(g => Math.abs(mm.get(g)||0)), 1);

  // 막대 차트
  const bars = groups.map(g=>{
    const v = mm.get(g);
    const pct = v==null ? 0 : Math.abs(v)/maxVal*100;
    return `
      <div class="abar-row">
        <div class="abar-label">${esc(g.name)}</div>
        <div class="abar-track">

  // 요약 표 (모든 지표)

          <td>${g.sat==null?'–':'★ '+g.sat.toFixed(2)}</td>
        </tr>`).join('')}

  // 부서 × 연령 교차표 (참여 인원)
  const crossRows = DEPT_ORDER.map(dep=>{
    const cells = AGE_ORDER.map(ag=>{
      const n = rows.filter(r=>(r.intake?.dept||'')===dep && (r.intake?.age||'')===ag).length;
      const intensity = n===0 ? 0 : Math.min(1, n/8);
      return `<td class="cross-cell" style="background:rgba(76,90,130,${intensity.toFixed(2)})">${n||''}</td>`;
    }).join('');
    const rowTotal = rows.filter(r=>(r.intake?.dept||'')===dep).length;
    if(rowTotal===0) return '';
    return `<tr><th class="cross-h">${esc(dep)}</th>${cells}<td class="cross-total">${rowTotal}</td></tr>`;

  const colTotals = AGE_ORDER.map(ag=>
    `<td class="cross-total">${rows.filter(r=>(r.intake?.age||'')===ag).length}</td>`).join('');

  // 간단 인사이트
  const withSat = groups.filter(g=>g.sat!=null);
  const topSat = withSat.length ? withSat.reduce((a,b)=>a.sat>=b.sat?a:b) : null;
  const topCount = groups.reduce((a,b)=>a.count>=b.count?a:b, groups[0]);
  const lowComp = groups.filter(g=>g.count>=3).reduce((a,b)=>a.completion<=b.completion?a:b, groups[0]);

  return `<div class="analysis">
    <p class="sub">부서별·연령별로 참여와 만족도를 비교합니다. ${rows.some(r=>r.__sample)?'<b style="color:var(--accent)">지금은 예시 데이터입니다.</b>':''}</p>
    ${seedBar}

    <div class="analysis-controls">
      <div class="seg">
        <button class="seg-btn ${by==='dept'?'on':''}" onclick="AD.analysisBy='dept';render()">부서별</button>
        <button class="seg-btn ${by==='age'?'on':''}" onclick="AD.analysisBy='age';render()">연령별</button>
      </div>
      <div class="seg">
        ${Object.entries(metricMeta).map(([k,m])=>
          `<button class="seg-btn ${metric===k?'on':''}" onclick="AD.analysisMetric='${k}';render()">${m.label}</button>`).join('')}
      </div>
    </div>

    <div class="acard">
      <div class="card-h">${by==='dept'?'부서별':'연령별'} · ${mm.label}</div>
      <div class="abar-chart">${bars}</div>
    </div>

    <div class="grid-2">
      <div class="acard">
        <div class="card-h">${by==='dept'?'부서별':'연령별'} 상세</div>
        ${table}
      </div>
      <div class="acard">
        <div class="card-h">부서 × 연령 참여 분포</div>
        <div class="cross-wrap">
          <table class="cross-table">
            <thead><tr><th></th>${AGE_ORDER.map(a=>`<th>${a}</th>`).join('')}<th class="cross-total">계</th></tr></thead>
            <tbody>${crossRows}
              <tr><th class="cross-h">계</th>${colTotals}<td class="cross-total">${rows.length}</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="acard insight">
      <div class="card-h">한눈에 보기</div>
      <ul class="insight-list">
        <li>참여가 가장 많은 그룹: <b>${esc(topCount.name)}</b> (${topCount.count}명)</li>
        ${topSat?`<li>만족도가 가장 높은 그룹: <b>${esc(topSat.name)}</b> (★${topSat.sat.toFixed(2)})</li>`:''}
        <li>완료율이 가장 낮은 그룹: <b>${esc(lowComp.name)}</b> (${lowComp.completion}%) — 리마인드·일정 안내를 강화해 볼 수 있습니다.</li>
      </ul>
    </div>
  </div>`;
}

// 예시 데이터 100명 생성 (데모 전용)
function seedSampleData(n){
  if(LIVE){ alert('예시 데이터는 데모 모드에서만 채울 수 있습니다.'); return; }
  const rows = local.all();
  const companies = COMPANIES.map(c=>c.id);
  const progIds = PROGRAMS.map(p=>p.id);
  // 부서·연령별로 자연스러운 분포(가중치)
  const deptW = {'운용전략본부':16,'증권운용본부':22,'대체투자본부':24,
                 '투자관리부문':14,'경영관리부문':18,'해외지사':12,'기타':4};
  const ageW  = {'20대':26,'30대':34,'40대':22,'50대':13,'60대 이상':5};
  const pick = wmap => {
    const items=Object.entries(wmap); const sum=items.reduce((a,[,w])=>a+w,0);
    let r=Math.random()*sum; for(const [k,w] of items){ if((r-=w)<0) return k; } return items[0][0];
  };
  const rint = (a,b)=>a+Math.floor(Math.random()*(b-a+1));

  const today = new Date();
  for(let i=0;i<n;i++){
    const dept = pick(deptW), age = pick(ageW);
    const company = companies[rint(0,companies.length-1)];
    const program = progIds[rint(0,progIds.length-1)];
    // 상태: 60% 완료, 30% 예약, 10% 취소
    const roll = Math.random();
    const status = roll<0.6?'done':roll<0.9?'booked':'canceled';
    // 날짜: 완료는 과거, 예약은 미래
    const offset = status==='done' ? -rint(1,40) : rint(1,20);
    const dt = new Date(today); dt.setDate(dt.getDate()+offset);
    const slot_date = dt.toISOString().slice(0,10);

    // 만족도: 부서·연령에 약간의 경향성 부여(예시가 밋밋하지 않도록)
    let survey = null;
    if(status==='done' && Math.random()<0.82){
      const base = 3.6
        + (['개발','디자인'].includes(dept)?0.5:0)
        + (age==='20대'?0.3: age==='50대'||age==='60대 이상'?-0.2:0)
        + (Math.random()*0.9-0.3);
      const clamp = v => Math.max(1, Math.min(5, Math.round(v)));
      const overall = clamp(base);
      survey = {
        overall, fit:clamp(base+ (Math.random()*0.6-0.3)),
        pro:clamp(base+0.2), place:clamp(base-0.1),
        nps: Math.max(0, Math.min(10, Math.round(overall*2 - (Math.random()<0.3?rint(1,3):0)))),
        effect: overall>=4?'많이 도움됨':overall>=3?'조금 도움됨':'잘 모르겠음',
        next: overall>=4?'네, 계속할게요':overall>=3?'조금 고민 중':'아니요',
      };
    }
    const code = 'S'+String(i+1).padStart(3,'0');
    rows.push({
      id:code, code, __sample:true, company, program,
      name:`참여자${String(i+1).padStart(3,'0')}`,
      email:`sample${i+1}@example.com`, phone:null,
      dept, // 상위 호환
      slot_date, slot_time:'14:10', status,
      intake:{dept, age, sex: Math.random()<0.52 ? '여성' : '남성',
              goal: [['체중 감량','체형 교정·자세','체력·컨디션','재활·통증 완화','근육량 증가'][rint(0,4)]],
              freq: ['거의 하지 않음','주 1~2회','주 3~4회','주 5회 이상'][rint(0,3)],
              sitting: ['4시간 미만','4~7시간','8~10시간','10시간 이상'][rint(0,3)],
              injury: (function(){
                const cand = BODY_PARTS.filter(x => x !== '없음');
                if(Math.random() < 0.15) return ['없음'];
                const a = [cand[rint(0,cand.length-1)]];
                if(Math.random() < 0.45){
                  const b = cand[rint(0,cand.length-1)];
                  if(b !== a[0]) a.push(b);
                }
                return a;
              })(),
              pain: rint(0,7)}, survey,
      created_at:new Date(today.getTime()-rint(1,60)*864e5).toISOString(),
    });
  }
  local.save(rows);
  refreshAdmin();
}

function clearSampleData(){
  const rows = local.all().filter(r=>!r.__sample);
  local.save(rows);
  refreshAdmin();
}

/* ---------- 운영자용 대시보드 ---------- */
function dashboardTab(){
  const rows = adminRows();
  const done = rows.filter(r=>r.status==='done');
  const scored = rows.filter(r=>r.survey && r.survey.overall);

  const avg = key => {
    const vals = rows.filter(r=>r.survey && typeof r.survey[key]==='number').map(r=>r.survey[key]);
    return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
  };
  const overall = avg('overall');
  const respRate = done.length ? Math.min(100, Math.round(scored.length/done.length*100)) : 0;

  // NPS (0~10): 추천 9~10 - 비추천 0~6
  const npsVals = rows.filter(r=>r.survey && typeof r.survey.nps==='number').map(r=>r.survey.nps);
  const nps = npsVals.length
    ? Math.round((npsVals.filter(v=>v>=9).length - npsVals.filter(v=>v<=6).length)/npsVals.length*100)
    : null;

  const kpis = [
    ['전체 신청', rows.filter(r=>r.status!=='canceled').length+'건', ''],
    ['이용 완료', done.length+'건', ''],
    ['평균 만족도', overall!==null?overall.toFixed(2):'–', overall!==null?stars(overall):''],
    ['피드백 응답률', respRate+'%', `${scored.length}/${done.length}`],
    ['재수강 의향', reBar(rows), ''],

  const starQs = SURVEY.filter(q=>q.type==='stars');

    const a = avg(q.id);

        ? `<div class="empty">아직 피드백이 없습니다.</div>`
        : barRows.map(b=>`
          <div class="bar-row">
            <div class="bar-label">${esc(b.label)}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${b.val?b.val/5*100:0}%"></div></div>
            <div class="bar-val">${b.val?b.val.toFixed(1):'–'}</div>
          </div>`).join('')}
    </div>

    <div class="card">
      <div class="card-h">프로그램별 신청 현황 <span class="card-sub">취소 제외</span></div>
      ${Object.keys(progCounts).length===0
        ? `<div class="empty">아직 데이터가 없습니다.</div>`
        : Object.entries(progCounts).sort((a,b)=>b[1]-a[1]).map(([g,n])=>`
          <div class="bar-row">
            <div class="bar-label" title="${esc(g)}">${esc(g)}</div>
            <div class="bar-track"><div class="bar-fill goal" style="width:${n/progMax*100}%"></div></div>
            <div class="bar-val">${n}</div>
          </div>`).join('')}
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-h">최근 회원 코멘트</div>
    ${comments.length===0
      ? `<div class="empty">아직 코멘트가 없습니다.</div>`
      : comments.map(r=>`
        <div class="quote">
          <div class="quote-t">"${esc(r.survey.comment)}"</div>
          <div class="quote-m">${esc(r.name)} · ${fmtDate(r.slot_date)} · ${r.survey.overall?'★'+r.survey.overall:''}</div>
        </div>`).join('')}
  </div>`;
}

function stars(v){
  const full = Math.round(v);
  return `<span style="color:#E0A33E;letter-spacing:1px">${'★'.repeat(full)}${'☆'.repeat(5-full)}</span>`;
}
function reBar(rows){
  const vals = rows.map(r=>r.survey?.next).filter(Boolean);
  if(!vals.length) return '–';
  const yes = vals.filter(v=>v.startsWith('네')).length;
  return Math.round(yes/vals.length*100)+'%';
}

/* ============================================================
   사전 상담 — 시각화 엔진
   문항 종류(단일선택·복수선택·척도·자유응답·동의)에 따라
   같은 답변도 그래프·칩·게이지로 바꿔서 보여 줍니다.
   ============================================================ */

// 여러 프로그램의 문항을 하나로 합칩니다. (같은 id면 보기 목록을 합칩니다)
function intakeQsFor(programIds){
  const map = new Map();
  // 사전 상담은 가입 때 한 번 받으므로, 저장된 응답은 이 문항들로 읽습니다.
  SIGNUP_INTAKE.forEach(q => map.set(q.id,
    Object.assign({}, q, {options: q.options ? q.options.slice() : undefined})));
  programIds.forEach(pid => {
    intakeFor(pid).forEach(q => {
      if(!map.has(q.id)){
        map.set(q.id, Object.assign({}, q, {options: q.options ? q.options.slice() : undefined}));
      }else if(q.options){
        const cur = map.get(q.id);
        cur.options = cur.options || [];
        q.options.forEach(o => { if(!cur.options.includes(o)) cur.options.push(o); });
      }
    });
  });
  return [...map.values()];
}

// 값이 실제로 입력됐는지 확인
function hasVal(v){
  return Array.isArray(v) ? v.length>0 : (v!==undefined && v!==null && v!=='');
}

// 담당자가 먼저 봐야 할 응답(부상·통증, 높은 스트레스)을 뽑습니다.
function riskTags(intake){
  const out = [];
  const inj = intake && intake.injury;
  (Array.isArray(inj) ? inj : (inj ? [inj] : [])).forEach(x => { if(x && x!=='없음') out.push(x); });

  return out;
}
const isWarnOpt = (qid, opt) => (qid==='injury' || qid==='stress_sign') && opt!=='없음';
const isOkOpt   = (qid, opt) => opt==='없음' || opt==='특별히 없음';

// 문항별 아이콘
const QICON = {
  dept:'apartment', age:'cake', sex:'wc', rrn:'badge', goal:'flag',
  freq:'repeat', exp:'military_tech', sitting:'chair',
  injury:'healing', pain:'e911_emergency', intensity:'speed',
  area:'accessibility_new', mode:'videocam',
  topic:'forum', first:'help', stress:'monitor_heart', meal:'restaurant',
  stress_src:'psychology', stress_sign:'vital_signs', stress_care:'self_improvement',
  skip:'free_breakfast', note:'sticky_note_2', consent:'verified_user',
  overall:'star', fit:'target', pro:'workspace_premium', place:'apartment',
  nps:'thumb_up', effect:'trending_up', next:'event_repeat', comment:'rate_review',
};
const qIcon = q => QICON[q.id] || (q.type==='scale' ? 'speed' : 'checklist');

/* ---------- 답변 1개를 그림으로 ---------- */
function answerCell(q, v, etc){
  const t = q.type;

  if(t==='consent'){
    return v
      ? `<span class="pq-consent">${ico('verified_user')}수집·이용 동의함</span>`
      : `<span class="pq-consent no">${ico('gpp_maybe')}동의하지 않음</span>`;
  }

  if(t==='text' || t==='textarea'){
    return hasVal(v)
      ? `<div class="pq-note">${esc(v)}</div>`
      : `<div class="pq-empty">작성하지 않음</div>`;
  }

  if(t==='stars'){
    const n = Number(v)||0;
    return `<div class="pb-single">
        <div class="pb-track"><div class="pb-fill" style="width:${n/5*100}%"></div></div>
        <span class="pb-val">${n||'–'}<small>/5</small></span>
      </div>
      <div class="pq-leg"><span class="pstars">${'★'.repeat(n)}${'☆'.repeat(Math.max(0,5-n))}</span></div>`;
  }

  if(t==='vas') return vasCellHTML(v);

  if(t==='scale'){
    const min = (q.min===undefined?1:q.min), max = (q.max===undefined?5:q.max);
    const n   = (typeof v==='number') ? v : null;
    const hot = (q.id==='stress') && n!==null && n>=8;
    const pct = n===null ? 0 : (n-min+1)/(max-min+1)*100;
    return `<div class="pb-single">
        <div class="pb-track"><div class="pb-fill ${hot?'hot':''}" style="width:${pct.toFixed(1)}%"></div></div>
        <span class="pb-val ${hot?'hot':''}">${n===null?'–':n}<small>/${max}</small></span>
      </div>
      ${(q.low||q.high)?`<div class="pq-leg"><span>${esc(q.low||'')}</span><span>${esc(q.high||'')}</span></div>`:''}`;
  }

  // radio · checkbox — 고른 항목만 막대로 그리고, 고르지 않은 보기는 아래 한 줄로 요약합니다.
  const sel  = Array.isArray(v) ? v : (hasVal(v) ? [v] : []);
  const opts = (q.options && q.options.length) ? q.options : sel;
  if(!opts.length) return `<div class="pq-empty">–</div>`;
  const chosen = opts.filter(o => sel.includes(o));
  const rest   = opts.filter(o => !sel.includes(o));
  const bars = chosen.length
    ? `<div class="pb">${chosen.map(o=>{
        const cls = isWarnOpt(q.id,o) ? 'on warn' : (isOkOpt(q.id,o) ? 'on ok' : 'on');
        // "기타" 는 직접 적은 내용을 함께 보여 줍니다.
        const lab = (o === '기타' && String(etc||'').trim()) ? `기타 · ${etc}` : o;
        return `<div class="pb-row ${cls}">
          <div class="pb-lab" title="${esc(lab)}">${esc(lab)}</div>
          <div class="pb-track"><div class="pb-fill"></div></div>
          <div class="pb-mark">✓</div>
        </div>`;
      }).join('')}</div>`
    : `<div class="pq-empty">응답 없음</div>`;
  return bars + (rest.length ? `<div class="pb-rest">미선택 ${rest.map(esc).join(' · ')}</div>` : '');
}

function qCardHTML(q, v, etc){
  const wide = (q.type==='text' || q.type==='textarea' || q.type==='consent');
  return `<div class="pq ${wide?'wide':''}">
    <div class="pq-q">${ico(qIcon(q))}${esc(q.q)}</div>
    ${answerCell(q, v, etc)}
  </div>`;
}
