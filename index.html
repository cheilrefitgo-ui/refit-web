<style>
  body{font-family:'Hanken Grotesk','Pretendard Variable',Pretendard,sans-serif;
       background-color:#f9f9f9;-webkit-font-smoothing:antialiased}
  .material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;
       user-select:none}
  .msf{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
  .program-card{transition:transform .2s ease-in-out}
  .program-card:hover{transform:translateY(-4px)}
  .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
  .time-slot-scroll::-webkit-scrollbar{width:4px}
  .time-slot-scroll::-webkit-scrollbar-thumb{background:#e2e2e2;border-radius:10px}
  /* 라임 액센트를 체크 표시에 반영 */
  input[type=radio]:checked,input[type=checkbox]:checked{background-color:#4C5A82;border-color:#4C5A82}
  input[type=radio]:focus,input[type=checkbox]:focus{--tw-ring-color:#DCE5F8}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(8px);opacity:0;
         background:#1a1c1c;color:#fff;padding:11px 20px;border-radius:.5rem;font-size:14px;
         transition:.2s;pointer-events:none;z-index:99}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .animate-fade-in{animation:fadeIn .4s ease-out}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  :focus-visible{outline:2px solid #4C5A82;outline-offset:2px}

  /* ============================================================
     확인 · 피드백 · 관리자 화면용 스타일

     ============================================================ */
  :root{
    --ink:#1a1c1c; --paper:#f9f9f9; --card:#fff;
    --accent:#4C5A82; --accent-dark:#3A4667; --accent-soft:#EEF2FA;
    --lime:#DCE5F8; --line:#e2e2e2; --muted:#4B5160; --danger:#ba1a1a;
  }
  .pane{max-width:1100px;margin:0 auto;width:100%}
  .pane h1{font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
  .pane h1 + .sub, .sub{color:var(--muted);font-size:16px;line-height:24px;margin-top:6px}
  .backlink{display:inline-flex;align-items:center;gap:6px;color:var(--ink);font-size:16px;
            font-weight:700;margin-bottom:18px;padding:9px 16px;border-radius:999px;
            border:1px solid var(--line);background:#fff;cursor:pointer;
            transition:border-color .15s,background .15s}
  .backlink:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  .fields{margin-top:24px;display:flex;flex-direction:column;gap:24px;max-width:640px}
  .field .q, label.q{display:block;font-size:14px;font-weight:600;letter-spacing:.02em;margin-bottom:8px;color:var(--ink)}
  .hint{font-size:12px;color:#5e5e5e;font-weight:500;margin-left:6px}
  .fields input[type=text],.fields input[type=email],.fields input[type=tel],
  .fields input[type=password],.fields input[type=number],.fields textarea,
  .card input[type=text],.card input[type=number],.toolbar input[type=text]{
    width:100%;border:1px solid #e8e8e8;border-radius:.5rem;padding:10px 16px;background:#fff;font-size:16px}
  .fields textarea{min-height:88px;resize:vertical}
  .fields input:focus,.fields textarea:focus{outline:none;border-color:var(--ink);box-shadow:none}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:.5rem;
       padding:12px 16px;font-size:16px;background:#fff;cursor:pointer}
  .opt:hover{background:#e8e8e8}
  .opt.on{background:rgba(220,229,248,.3);border-color:var(--accent)}
  .err{color:var(--danger);font-size:12px;font-weight:500}

  .barline{margin-top:32px;padding-top:24px;border-top:1px solid var(--line);
           display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .btn{background:var(--lime);color:#14161A;border-radius:.5rem;padding:14px 32px;
       font-weight:600;font-size:14px;letter-spacing:.02em;display:inline-flex;
       align-items:center;justify-content:center;gap:8px;text-decoration:none}
  .btn:hover{opacity:.9}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .btn.ghost:hover{background:#e8e8e8;opacity:1}
  .mini{font-size:12px;font-weight:500;letter-spacing:.04em;padding:8px 14px;border:1px solid var(--line);
        border-radius:.5rem;background:#fff;display:inline-flex;align-items:center;gap:6px}
  .mini:hover{border-color:var(--accent);color:var(--accent)}

  .notice{background:#f3f3f3;border:1px solid var(--line);border-left:3px solid var(--accent);
          border-radius:.5rem;padding:14px 16px;font-size:16px;color:var(--muted);margin-top:20px;max-width:640px}
  .notice.warn{border-left-color:var(--danger);background:#fff5f4}
  .notice b{font-weight:600;color:var(--ink)}
  .cd{font-variant-numeric:tabular-nums;color:var(--danger);font-weight:700}
  .privacy{display:flex;gap:10px;align-items:flex-start;background:rgba(220,229,248,.25);
           border:1px solid var(--lime);border-radius:.5rem;padding:12px 16px;margin:0 0 24px;max-width:720px}
  .privacy div{font-size:16px;line-height:24px;color:var(--muted)}
  .privacy b{font-weight:700;color:var(--ink)}

  .ticket{margin-top:24px;border:1px solid var(--line);border-radius:1rem;overflow:hidden;max-width:520px;background:#fff}
  .ticket .top{background:var(--lime);color:#3A4667;padding:24px}
  .ticket .top .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
  .ticket .top .v{font-size:24px;font-weight:600;letter-spacing:.1em;margin-top:4px}
  .ticket .body{padding:24px;display:flex;flex-direction:column;gap:12px;font-size:16px}
  .ticket .body .row{display:flex;justify-content:space-between;gap:16px}
  .ticket .body .row span{color:var(--muted);font-size:12px;letter-spacing:.04em}
  .ticket .body .row b{font-weight:600;font-size:14px;text-align:right}

  .linkcards{display:flex;gap:16px;margin-top:24px;max-width:640px;flex-wrap:wrap}
  .linkcard{flex:1;min-width:220px;border:1px solid var(--line);border-radius:1rem;padding:24px;
            background:#fff;text-decoration:none;color:var(--ink)}
  .linkcard:hover{border-color:var(--accent)}
  .linkcard.accent{background:rgba(220,229,248,.3);border-color:var(--lime)}
  .lc-t{font-weight:600;font-size:14px;letter-spacing:.02em}
  .lc-s{font-size:12px;color:var(--muted);margin-top:4px}
  .copyrow{margin-top:16px;display:flex;gap:8px;max-width:640px}
  .copyrow input{flex:1;font-size:12px;background:#f3f3f3;border:1px solid var(--line);
                 border-radius:.5rem;padding:10px 14px}

  /* 관리자 */
  .tabbar{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line);
          margin:24px 0;flex-wrap:wrap}
  .tab{padding:12px 20px;font-size:14px;font-weight:600;letter-spacing:.02em;color:var(--muted);
       border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent);border-bottom-color:var(--lime)}
  .refreshed{font-size:12px;color:var(--muted);margin-right:4px;white-space:nowrap}
  .refreshbtn.spinning .material-symbols-outlined{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── KPI 카드 ────────────────────────────────────────────
     중요도에 따라 크기 · 배경 · 그림자를 다르게 줍니다.
     hero  : 그 화면에서 가장 먼저 봐야 할 수치 (2칸 차지)
     기본  : 보조 지표
     ------------------------------------------------------ */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:14px}
  .kpi{position:relative;border:1px solid var(--line);border-radius:16px;padding:20px 20px 18px;
       background:#fff;transition:box-shadow .18s,border-color .18s,transform .18s;
       box-shadow:0 1px 2px rgba(20,28,16,.04),0 10px 24px -18px rgba(20,28,16,.30)}
  .kpi:hover{border-color:#c8cfba;transform:translateY(-1px);
       box-shadow:0 1px 2px rgba(20,28,16,.05),0 18px 34px -20px rgba(20,28,16,.38)}
  .kpi-l{font-size:11.5px;color:var(--muted);letter-spacing:.055em;font-weight:600}
  .kpi-v{font-size:33px;font-weight:700;margin-top:9px;letter-spacing:-.035em;line-height:1;
         font-variant-numeric:tabular-nums}
  .kpi-v u{text-decoration:none;font-size:15px;font-weight:600;color:var(--muted);margin-left:3px;
           letter-spacing:0}
  .kpi-s{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}

  .kpi.hero{grid-column:span 2;background:#F4F6FB;border-color:#C9D3F0;padding:24px 24px 22px;
       box-shadow:0 1px 2px rgba(20,28,16,.05),0 20px 40px -22px rgba(76,90,130,.45)}
  .kpi.hero::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:3px;
       border-radius:0 3px 3px 0;background:var(--lime)}
  .kpi.hero .kpi-l{color:#3A4667}
  .kpi.hero .kpi-v{font-size:46px;margin-top:11px;color:var(--accent)}
  .kpi.hero .kpi-v u{font-size:19px;color:#5B6B99}
  .kpi.hero .kpi-s{color:#4B5160}
  .kpi.warn .kpi-v{color:#a3492a}
  @media (max-width:640px){
    .kpi.hero{grid-column:span 1;padding:20px}
    .kpi.hero .kpi-v{font-size:38px}
  }

  /* 지표 옆 변화량 배지 */
  .kpi-d{display:inline-flex;align-items:center;gap:3px;margin-top:10px;font-size:11.5px;
         font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:-.01em}
  .kpi-d.up{background:rgba(76,90,130,.11);color:#3A4667}
  .kpi-d.down{background:rgba(192,86,46,.13);color:#8f3d1f}
  .kpi-d.flat{background:#f1f2ee;color:var(--muted)}
  .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
  .card{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff;
        box-shadow:0 1px 2px rgba(20,28,16,.035),0 10px 24px -20px rgba(20,28,16,.26)}
  .card-h{font-size:15px;font-weight:700;letter-spacing:-.02em}
  .card-sub{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
  .card-p{font-size:16px;color:var(--muted);margin:8px 0 16px}
  .bar-row{display:grid;grid-template-columns:140px 1fr 40px;gap:12px;align-items:center;margin:10px 0}
  .bar-label{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{height:10px;background:#f3f3f3;border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;background:var(--lime);border-radius:6px;transition:width .4s}
  .bar-fill.goal{background:var(--accent)}
  .bar-val{font-size:14px;font-weight:600;text-align:right;color:var(--accent)}
  .quote{border-left:3px solid var(--lime);padding:6px 0 6px 16px;margin:16px 0}
  .quote-t{font-size:16px;color:var(--muted)}
  .quote-m{font-size:12px;color:#5e5e5e;margin-top:4px}
  .code{background:#1a1c1c;color:#C9D6F2;font-family:ui-monospace,'SF Mono',monospace;font-size:12px;
        padding:16px;border-radius:.5rem;overflow-x:auto;line-height:1.5;margin:10px 0;white-space:pre}
  .qr-wrap{display:flex;gap:20px;align-items:center;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
  .qr-wrap canvas{border:1px solid var(--line);border-radius:.5rem;padding:6px;background:#fff}
  .empty{color:var(--muted);font-size:14px;padding:16px 0}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:20px}

  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:20px}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;background:#f3f3f3}
  .tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500}
  .tag.booked{background:rgba(220,229,248,.35);color:#3A4667}
  .tag.done{background:#e8e8e8;color:#5e5e5e}
  .tag.canceled{background:#ffdad6;color:#93000a}

  /* ---------- 사전 상담 대시보드 (집계) ---------- */
  .iq-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0 4px}
  .iq-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;margin-top:18px}
  .iq-card{border:1px solid var(--line);border-radius:1rem;background:#fff;padding:20px}
  .iq-card .card-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:14px}
  .iq-badge{font-size:11px;font-weight:600;letter-spacing:.03em;padding:3px 9px;border-radius:999px;
            background:var(--accent-soft);color:var(--accent-dark)}
  .iq-badge.multi{background:#e6eefc;color:#28457e}
  .iq-badge.scale{background:#fdf0d8;color:#8a5a00}
  .iq-badge.free{background:#f0e9fb;color:#5a3d8a}
  .iq-row{display:grid;grid-template-columns:106px 1fr 74px;gap:10px;align-items:center;margin:9px 0}
  .iq-lab{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iq-track{height:14px;background:#f1f1ee;border-radius:7px;overflow:hidden}
  .iq-fill{height:100%;background:var(--lime);border-radius:7px;transition:width .45s}
  .iq-fill.top{background:var(--accent)}
  .iq-fill.warn{background:#ff8a80}
  .iq-num{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
  .iq-num b{color:var(--ink);font-size:14px;font-weight:700}
  .iq-avg{display:flex;align-items:baseline;gap:8px;margin-bottom:4px}
  .iq-avg-v{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
  .iq-avg-l{font-size:12px;color:var(--muted)}
  .iq-hist{display:flex;align-items:flex-end;gap:5px;height:88px;margin-top:10px}
  .iq-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%}
  .iq-bar i{display:block;width:100%;background:var(--lime);border-radius:4px 4px 0 0;min-height:3px}
  .iq-bar.hot i{background:#ff8a80}
  .iq-bar b{font-size:11px;color:var(--ink);font-weight:700;height:13px}
  .iq-bar span{font-size:11px;color:var(--muted)}
  .iq-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
  .iq-notes{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow:auto}
  .iq-note{background:#f7f7f4;border-left:3px solid var(--lime);border-radius:0 8px 8px 0;padding:10px 13px}
  .iq-note-t{font-size:13.5px;color:var(--ink);line-height:1.55}
  .iq-note-m{font-size:11px;color:var(--muted);margin-top:5px}
  .iq-alert{border-color:#ffb4ab;background:#fffafa}
  .iq-alert .card-h{color:#93000a}
  .ialert-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .ialert{display:inline-flex;align-items:center;gap:7px;border:1px solid #ffb4ab;background:#fff;
          border-radius:999px;padding:6px 13px;font-size:12.5px;color:#93000a;cursor:pointer}
  .ialert:hover{background:#ffdad6}
  .ialert b{font-weight:700}
  .ialert em{font-style:normal;color:#b3564e}

  /* ---------- 개인별 사전 상담 카드 ---------- */
  .pcard{border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:10px;overflow:hidden}
  .pcard-head{display:flex;align-items:center;gap:10px;padding:9px 13px;background:#f8f8f5;
              border-bottom:1px solid var(--line);flex-wrap:wrap}
  .pcard-ico{flex:0 0 28px;height:28px;border-radius:8px;background:var(--lime);color:#3A4667;
             display:grid;place-items:center}
  .pcard-ico .material-symbols-outlined{font-size:17px}
  .pcard-ico.fb{background:#fdf0d8;color:#8a5a00}
  .pcard-t{font-size:13.5px;font-weight:700;color:var(--ink)}
  .pcard-s{font-size:11.5px;color:var(--muted);margin-top:1px}
  .pcard-body{padding:10px 13px}
  .pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:8px}
  .pq{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fcfcfa}
  .pq.wide{grid-column:1/-1}
  .pq-q{font-size:11.5px;font-weight:600;color:var(--muted);letter-spacing:.02em;margin-bottom:7px;
        display:flex;align-items:center;gap:5px;line-height:1.35}
  .pq-q .material-symbols-outlined{font-size:15px;color:var(--accent);flex:0 0 auto}
  /* 개인 답변 막대 — 집계 화면과 같은 가로 막대 형태 */
  .pb{display:flex;flex-direction:column;gap:4px}
  .pb-row{display:grid;grid-template-columns:minmax(52px,84px) 1fr 14px;gap:8px;align-items:center}
  .pb-lab{font-size:12px;color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pb-track{height:9px;background:#f1f1ee;border-radius:5px;overflow:hidden}
  .pb-fill{height:100%;width:0;background:var(--lime);border-radius:5px;transition:width .45s}
  .pb-row.on .pb-fill{width:100%}
  .pb-row.on.warn .pb-fill{background:#ff8a80}
  .pb-row.on.ok .pb-fill{background:#a5cf9f}
  .pb-mark{font-size:12px;color:var(--accent);text-align:right;line-height:1}
  .pb-row.on.warn .pb-mark{color:#93000a}
  .pb-rest{font-size:10.5px;color:#b3b3ab;margin-top:6px;line-height:1.45}
  .pb-single{display:flex;align-items:center;gap:10px}
  .pb-single .pb-track{flex:1;height:11px;border-radius:6px}
  .pb-single .pb-fill{border-radius:6px}
  .pb-val{font-size:16px;font-weight:800;color:var(--accent);white-space:nowrap;line-height:1}
  .pb-val small{font-size:11px;color:var(--muted);font-weight:600}
  .pb-val.hot{color:#c62828}
  .pb-single .pb-fill.hot{background:#ff8a80}
  .pq-leg{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:5px}
  .pq-note{font-size:12.5px;color:var(--ink);line-height:1.5;background:#fff;
           border-left:3px solid var(--lime);padding:7px 11px;border-radius:0 8px 8px 0}
  .pq-consent{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
              padding:4px 11px;border-radius:999px;background:#e3f2e1;color:#2c6b28}
  .pq-consent.no{background:#ffdad6;color:#93000a}
  .pq-consent .material-symbols-outlined{font-size:15px}
  .pq-empty{font-size:12px;color:#a3a39c}
  .pstars{color:#E0A33E;letter-spacing:1px;font-size:13px}
  /* 표 안에서 상세를 표 전체 너비로 펼칩니다 */
  .detailrow td{background:#f8f8f5;padding:2px 14px 16px;border-bottom:1px solid var(--line)}
  .prisk{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:4px 10px;
         border-radius:999px;background:#f1f1ee;color:var(--muted);white-space:nowrap}
  .prisk.warn{background:#ffdad6;color:#93000a;font-weight:600}
  .prisk .material-symbols-outlined{font-size:14px}
  .iq-alert .card-h .material-symbols-outlined{font-size:18px;color:#93000a}

  @media (max-width:760px){
    .iq-grid{grid-template-columns:1fr}
    .iq-row{grid-template-columns:84px 1fr 66px}
    .pgrid{grid-template-columns:1fr}
  }

  .mcards{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .mcard{border:1px solid var(--line);border-radius:1rem;background:#fff;overflow:hidden}
  .mcard.open{border-color:var(--accent)}
  .mcard-head{display:flex;align-items:center;gap:14px;padding:16px 20px;cursor:pointer}
  .mcard-head:hover{background:#f3f3f3}
  .mavatar{flex:0 0 40px;height:40px;border-radius:999px;background:var(--lime);color:#3A4667;
           display:grid;place-items:center;font-weight:700;font-size:16px}
  .mname{font-weight:600;font-size:16px}
  .memail{font-size:12px;color:var(--muted)}
  .mstats{display:flex;gap:20px}
  .mstats div{text-align:center;line-height:1.2}
  .mstats b{display:block;font-size:16px;color:var(--ink)}
  .mstats span{font-size:12px;color:var(--muted)}
  .mchev{color:var(--muted);font-size:12px;width:14px;text-align:center}
  .mtags{display:flex;flex-wrap:wrap;gap:6px;padding:0 20px 16px 74px}
  .mtag{font-size:12px;background:#f3f3f3;color:var(--muted);padding:5px 12px;border-radius:999px}
  .mtag.warn{background:#ffdad6;color:#93000a}
  .mhistory{border-top:1px solid var(--line);padding:8px 20px 16px}
  .hrow{padding:14px 0;border-bottom:1px dashed var(--line)}
  .hrow:last-child{border-bottom:none}
  .hdate{font-size:14px}
  .hdate .tag{margin-left:8px}
  .hfb{font-size:12px;color:var(--accent);margin-top:6px}
  .bigcheck{width:48px;height:48px;border-radius:999px;background:var(--lime);color:#3A4667;
            display:grid;place-items:center;font-size:24px;font-weight:700;margin-bottom:16px}
  .stars{display:flex;gap:4px}
  .star{font-size:30px;line-height:1;color:#e2e2e2}
  .star.on{color:var(--lime)}
  .scale{display:flex;gap:6px;flex-wrap:wrap}
  .sc{width:44px;height:44px;border:1px solid var(--line);border-radius:.5rem;background:#fff;font-size:14px}
  .sc.on{background:var(--lime);border-color:var(--lime);color:#14161A;font-weight:700}
  .scale-legend{display:flex;justify-content:space-between;font-size:12px;color:#5e5e5e;margin-top:6px;max-width:460px}
  .consent{display:flex;gap:10px;align-items:flex-start;font-size:16px}

  @media (max-width:760px){
    .pane h1{font-size:28px;line-height:36px}
    .dash-grid{grid-template-columns:1fr}
    .bar-row{grid-template-columns:100px 1fr 34px}
    .mstats{gap:12px}
    .mtags{padding-left:20px}
    .barline .btn{flex:1 1 100%}
    table thead{display:none}
    table,table tbody,table tr,table td{display:block;width:100%}
    table tr{border:1px solid var(--line);border-radius:.5rem;padding:14px;margin-bottom:12px}
    table td{border:none;padding:3px 0}
    table tr.detailrow{border:none;padding:0;margin:-8px 0 12px}
    table tr.detailrow td{background:transparent;padding:0;border:none}
  }
  /* ---------- 마이페이지 ---------- */
  .mp-header{display:flex;align-items:center;gap:16px;padding-bottom:24px;margin-bottom:28px;
    border-bottom:1px solid var(--line)}
  .mp-avatar{flex:0 0 56px;height:56px;border-radius:999px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
  .mp-avatar.mp-logo,.emp-main .mp-avatar.mp-logo{background:#fff!important;border:1px solid #E3E6ED;overflow:hidden;padding:4px}
  .mp-avatar.mp-logo img{width:100%;height:100%;object-fit:contain;display:block}
  .mp-id{flex:1;min-width:0}
  .mp-name{font-size:24px;line-height:30px;font-weight:700;color:var(--ink);margin:0}
  .mp-email{color:var(--muted);font-size:14px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mp-logout{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
    color:var(--muted);font-size:14px;padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s;white-space:nowrap}
  .mp-logout:hover{background:#f3f3f3;color:var(--ink)}
  .mp-lo-ico{font-size:17px}

  /* 카드가 3장이므로 3등분해 가운데(다가오는 예약)가 정중앙에 오게 합니다. */
  .mp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;
    margin-bottom:32px}
  .mp-stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 16px;text-align:center}
  .mp-stat-v{font-size:26px;font-weight:800;color:var(--accent);line-height:1.1}
  .mp-stat-l{font-size:13px;color:var(--ink);font-weight:600;margin-top:6px}
  .mp-stat-s{font-size:11px;color:var(--muted);margin-top:2px}

  .mp-section{margin-bottom:32px}
  .mp-sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .mp-sec-title{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:var(--ink);margin:0}
  .mp-sec-ico{font-size:20px;color:var(--accent)}
  .mp-empty-note{color:var(--muted);font-size:14px;background:#f3f3f3;border-radius:12px;padding:16px 18px}

  .mp-highlight{background:var(--accent-soft);border:1px solid #C9D3F0;border-radius:16px;padding:20px;margin-bottom:12px}
  .mph-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .mph-prog{font-size:18px;font-weight:700;color:var(--ink)}
  .mph-when{font-size:14px;color:var(--accent-dark);font-weight:600;margin-top:4px}
  .mph-badge{flex:0 0 auto;background:var(--accent);color:#fff;font-size:14px;font-weight:700;
    padding:6px 12px;border-radius:999px}
  .mph-meta{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);margin:12px 0 16px}
  .mph-mi{font-size:16px;vertical-align:middle}
  .btn.small{padding:9px 16px;font-size:14px}

  .mfb{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px}
  .mfb-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .mfb-prog{font-size:15px;font-weight:600;color:var(--ink)}
  .mfb-stars{font-size:15px;color:var(--accent);letter-spacing:1px}
  .mfb-date{font-size:12px;color:var(--muted);margin-top:4px}

  .mypage-empty{text-align:center;padding:48px 20px}
  .mpe-icon{font-size:56px;color:var(--accent);opacity:.6;margin-bottom:8px}
  .mpe-icon .material-symbols-outlined{font-size:56px}
  .mpe-title{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .mpe-sub{color:var(--muted);font-size:15px;margin-bottom:24px}

  @media(max-width:640px){
    .mp-stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .mp-name{font-size:20px}
  }
  /* ---------- 회사 필터 (멀티 회사) ---------- */
  .cobar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:16px 0 20px;padding:12px 14px;
    background:#fff;border:1px solid var(--line);border-radius:12px}
  .cobar-note{margin-left:auto;font-size:12px;color:#6B7280}
  .cobar-label{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);margin-right:4px}
  .cobar-ico{font-size:18px}
  .cochip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;
    color:var(--ink);font-size:13.5px;padding:6px 12px;border-radius:999px;cursor:pointer;transition:.15s}
  .cochip:hover{border-color:var(--accent)}
  .cochip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .cocount{font-size:12px;background:rgba(0,0,0,.08);padding:1px 7px;border-radius:999px}
  .cochip.on .cocount{background:rgba(255,255,255,.25)}
  .cotag{display:inline-block;margin-left:8px;font-size:11.5px;font-weight:600;color:var(--accent-dark,#3A4667);
    background:var(--accent-soft,#EEF2FA);padding:2px 8px;border-radius:999px;vertical-align:middle}

  /* ---------- 자동 알림 설정 ---------- */
  .ntoggle{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;cursor:pointer;background:#fff}
  .ntoggle input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
  .ntoggle-body{display:flex;flex-direction:column;gap:2px}
  .ntoggle-label{font-size:14px;font-weight:600;color:var(--ink)}
  .ntoggle-desc{font-size:12px;color:var(--muted)}
  .chbtn{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:13.5px;
    padding:8px 16px;border-radius:8px;cursor:pointer;transition:.15s}
  .chbtn:hover{border-color:var(--accent)}
  .chbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .nlog{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
  .nlog-row{display:grid;grid-template-columns:56px 1fr 1fr 90px;gap:8px;padding:9px 12px;
    font-size:12.5px;border-bottom:1px solid var(--line);align-items:center}
  .nlog-row:last-child{border-bottom:none}
  .nlog-type{font-weight:600;color:var(--accent);background:var(--accent-soft,#EEF2FA);
    padding:2px 6px;border-radius:6px;text-align:center;font-size:11px}
  .nlog-to{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nlog-prog{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nlog-status{color:var(--muted);font-size:11px;text-align:right}

  /* ---------- 신청 목록 필터 (날짜·프로그램) ---------- */
  .filter-group{display:inline-flex;align-items:center;gap:7px}
  .filter-label{font-size:12.5px;font-weight:600;color:var(--muted)}
  .filter-sel{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;
    background:#fff;color:var(--ink);font-family:inherit;cursor:pointer}
  .filter-sel:focus{outline:none;border-color:var(--accent)}
  .filter-count{font-size:13px;font-weight:600;color:var(--accent-dark,#3A4667);
    background:var(--accent-soft,#EEF2FA);padding:4px 12px;border-radius:999px}

  /* ---------- 관리자 로그인/가입 탭 ---------- */
  .admin-tabs{display:flex;gap:4px;background:var(--surface-2,#f2f3f5);border-radius:10px;
    padding:4px;max-width:360px;margin:4px 0 18px}
  .admin-tab{flex:1;padding:9px;border:none;background:transparent;border-radius:8px;
    font-size:14px;color:var(--muted);cursor:pointer;transition:.15s}
  .admin-tab.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* 관리자 역할 고르기 */
  .rolepick{max-width:520px;margin:0 0 18px}
  .rolepick-h{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:8px}
  .rolepick-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .rolecard{display:flex;flex-direction:column;gap:3px;align-items:flex-start;
    padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;
    cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
  .rolecard:hover{border-color:var(--accent);background:var(--accent-soft)}
  .rolecard.on{border-color:var(--accent);background:var(--accent-soft);
    box-shadow:0 0 0 2px var(--accent-soft)}
  .rolecard-i{font-size:22px!important;color:var(--accent)}
  .rolecard b{font-size:14px;color:var(--ink)}
  .rolecard span{font-size:11.5px;color:var(--muted);line-height:1.45}

  /* ---------- 프로그램 태그 ---------- */
  .prog-tag{display:inline-block;font-size:11.5px;font-weight:500;color:#3f5aa6;
    background:#eef2fb;padding:3px 9px;border-radius:999px;line-height:1.4}

  /* ---------- 카테고리 선택 (2단계 프로그램 선택) ---------- */
  .cat-card{display:block;width:100%;cursor:pointer}
  .cat-preview{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;height:150px;background:var(--line)}
  .cat-preview-img{width:100%;height:100%;object-fit:cover}
  .cat-preview-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;
    background:#eef1f0;color:#9aa3a0}
  .backlink-lite{background:#fff;border:1px solid var(--line);border-radius:999px;
    color:var(--ink);font-size:15px;font-weight:700;cursor:pointer;padding:8px 15px;
    transition:border-color .15s,background .15s}
  .backlink-lite:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}

  /* ---------- 데이터 비교 분석 ---------- */
  .analysis .sub{color:var(--muted);font-size:14px;margin:2px 0 14px}
  .seed-box{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;
    background:#f6faf0;border:1px solid #dcebc8;border-radius:12px;padding:14px 16px;margin-bottom:18px}
  .analysis-controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .seg{display:inline-flex;background:#f2f3f5;border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
  .seg-btn{border:none;background:transparent;padding:7px 13px;border-radius:8px;font-size:13px;
    color:var(--muted);cursor:pointer;transition:.15s;white-space:nowrap}
  .seg-btn.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .acard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .acard .card-h{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:14px}
  .abar-chart{display:flex;flex-direction:column;gap:10px}
  .abar-row{display:grid;grid-template-columns:88px 1fr 68px;align-items:center;gap:10px}
  .abar-label{font-size:13px;color:var(--ink);text-align:right}
  .abar-track{background:#f0f2f1;border-radius:999px;height:22px;overflow:hidden}
  .abar-fill{height:100%;border-radius:999px;min-width:2px;transition:width .4s ease}
  .abar-val{font-size:13px;font-weight:600;color:var(--ink)}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.grid-2{grid-template-columns:1fr}}
  .atable{width:100%;border-collapse:collapse;font-size:13px}
  .atable th,.atable td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
  .atable th{color:var(--muted);font-weight:600;font-size:12px}
  .atable td:first-child,.atable th:first-child{text-align:left}
  .cross-wrap{overflow-x:auto}
  .cross-table{border-collapse:collapse;font-size:12px;width:100%}
  .cross-table th,.cross-table td{padding:6px 8px;text-align:center;border:1px solid var(--line)}
  .cross-h{text-align:left !important;color:var(--ink);font-weight:600;white-space:nowrap}
  .cross-cell{color:var(--ink);font-weight:500}
  .cross-total{background:#f7f8f7;font-weight:700;color:var(--ink)}
  .insight-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
  .insight-list li{font-size:13.5px;color:var(--gray2,#3a4a45);line-height:1.5}

/* ============================================================
   역할별 셸 — 플랫폼 관리자 / 기업 관리자 / 임직원
   기존 색·글꼴·간격 토큰을 그대로 쓰고, 골격만 추가합니다.
   ============================================================ */
/* 넓은 화면에서 좌우 여백이 남지 않도록 폭을 크게 잡습니다. */
.shell{display:flex;align-items:flex-start;width:100%;max-width:1840px;margin:0 auto}
.snav{width:236px;flex:0 0 236px;position:sticky;top:64px;align-self:flex-start;
      padding:18px 10px;border-right:1px solid var(--line);min-height:calc(100vh - 64px);background:#fcfcfa}
.snav-brand{padding:0 10px 13px;border-bottom:1px solid var(--line);margin-bottom:12px}
.snav-role{font-size:11px;letter-spacing:.06em;color:var(--accent);font-weight:800}
.snav-name{font-size:15px;font-weight:700;color:var(--ink);margin-top:3px;line-height:1.3}
.snav-tree{display:block}
/* v162: 기업 관리자 — 회사명 옆 PDF 저장, 메뉴 아래 구분선(운영 요약 위와 동일), 상단 집 버튼 */
.snav-brand-co{display:flex;align-items:center;justify-content:space-between;gap:6px}
.snav-brand-co .snav-name{white-space:nowrap;font-size:14px}
.snav-brand-tools .pdfbtn{white-space:nowrap;padding:6px 9px;flex:0 0 auto}
.snav-tree-co{padding-bottom:13px;border-bottom:1px solid var(--line)}
.shell-tools .refreshed{margin-right:4px}
.shell-tools .homebtn{padding:8px 10px;display:inline-flex;align-items:center}
.shell-tools .homebtn .material-symbols-outlined{font-size:18px}
.snav-group{margin-bottom:2px}
.snav-item{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;
           padding:9px 10px;border-radius:8px;font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer}
.snav-item:hover{background:var(--accent-soft);color:var(--accent-dark)}
.snav-item.on{background:var(--accent-dark);color:#fff}
.snav-item.on .snav-ico{color:var(--lime)}
.snav-ico{font-size:18px!important}
.snav-sub{margin:2px 0 7px 30px;display:flex;flex-direction:column;gap:1px}
.snav-kid{text-align:left;background:none;border:0;padding:6px 10px;border-radius:6px;
          font-size:12.5px;color:var(--muted);cursor:pointer;position:relative}
.snav-kid:hover{background:var(--accent-soft);color:var(--accent-dark)}
.snav-kid.on{background:var(--accent-soft);color:var(--accent-dark);font-weight:700}
.snav-chips{display:none}
.snav-foot{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.shell-main{flex:1;min-width:0;padding:18px 14px 48px}
.shell-top{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:15px}
.shell-kicker{font-size:11.5px;font-weight:800;letter-spacing:.06em;color:var(--accent)}
.shell-h1{font-size:23px;font-weight:800;color:var(--ink);margin:3px 0 0;line-height:1.3}
.shell-sub{font-size:13px;color:var(--muted);margin-top:4px}
.shell-tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

@media(max-width:900px){
  .shell{display:block}
  .snav{width:auto;flex:none;position:static;min-height:0;border-right:0;
        border-bottom:1px solid var(--line);padding:9px 10px}
  .snav-brand,.snav-foot,.snav-tree{display:none}
  .snav-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
  .snav-chip{white-space:nowrap;background:#fff;border:1px solid var(--line);border-radius:999px;
             padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
  .snav-chip.on{background:var(--accent-dark);border-color:var(--accent-dark);color:#fff}
  .shell-main{padding:14px 10px 40px}
  .shell-h1{font-size:20px}
}

/* ---------- 임직원 앱 — 하단 탭바 (모바일) ---------- */
.ebar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;
      border-top:1px solid var(--line);display:none;justify-content:space-around;
      padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.ebar-item{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
           font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;cursor:pointer}
.ebar-item.on{color:var(--accent)}
.ebar-item .material-symbols-outlined{font-size:22px!important}
@media(max-width:900px){ .ebar{display:flex} .ebar-pad{height:64px} }

/* ---------- 아직 데이터가 없는 화면 안내 ---------- */
.ph{border:1px dashed var(--line);border-radius:12px;padding:28px 20px;background:#fcfcfa;text-align:center}
.ph-ico{font-size:34px!important;color:var(--accent);opacity:.45}
.ph-t{font-size:16.5px;font-weight:800;color:var(--ink);margin:9px 0 5px}
.ph-s{font-size:13px;color:var(--muted);max-width:560px;margin:0 auto;line-height:1.65}
.ph-list{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:15px}
.ph-chip{font-size:11.5px;background:var(--accent-soft);color:var(--accent-dark);
         border-radius:999px;padding:5px 11px;font-weight:700}

/* ---------- 목록형 카드 (임직원·운동처방사·기업) ---------- */
.rowcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
         border-radius:10px;background:#fff;margin-bottom:8px}
.rowcard-av{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);
            display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex:0 0 38px}
.rowcard-main{flex:1;min-width:0}
.rowcard-t{font-size:14px;font-weight:700;color:var(--ink)}
.rowcard-s{font-size:12px;color:var(--muted);margin-top:2px}
.rowcard-n{font-size:15px;font-weight:800;color:var(--accent);text-align:right;white-space:nowrap}
.rowcard-n small{display:block;font-size:11px;color:var(--muted);font-weight:600}

/* ---------- 예약 캘린더 (관리자) ---------- */
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.mcal-h{text-align:center;font-size:11.5px;font-weight:700;color:var(--muted);padding:4px 0}
.mcal-c{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:#fff}
.mcal-c.off{background:#fafafa;opacity:.5}
.mcal-d{font-size:11.5px;font-weight:700;color:var(--muted)}
.mcal-c.today .mcal-d{color:var(--accent);}

/* ---------- 임직원 홈 ---------- */
.eh-hero{background:var(--accent-dark);border-radius:14px;padding:20px 22px;color:#fff;margin-bottom:16px}
.eh-hi{font-size:12.5px;color:#c9d6a0;font-weight:600}
.eh-t{font-size:21px;font-weight:800;margin-top:4px;line-height:1.35}
.eh-next{background:rgba(255,255,255,.1);border-radius:10px;padding:12px 14px;margin-top:14px;
         display:flex;align-items:center;gap:12px}
.eh-next-l{flex:1;min-width:0}
.eh-when{font-size:11.5px;color:var(--lime);font-weight:700}
.eh-prog{font-size:15px;font-weight:700;margin-top:2px}
.eh-where{font-size:11.5px;color:#c9d6a0;margin-top:3px}
/* 히어로 안의 실행 버튼 — 어두운 바탕 위에서 잘 보이도록 흰 타원형으로 둡니다. */
.eh-cta{background:#fff;color:var(--accent-dark);border:0;border-radius:999px;
        padding:10px 20px;font-size:13.5px;font-weight:800;cursor:pointer;white-space:nowrap;

<script>
/* ── v145 · KIC 실사용 빌드 전용 저장소 ──
   file:// 로 여는 HTML 은 같은 PC 의 모든 HTML 파일이 브라우저 저장소(localStorage)를 공유합니다.
   그래서 테스트 버전에서 만든 예약·계정이 KIC 버전에도 보였습니다. KIC 버전은 'kic:' 접두사 저장소만 씁니다. */
const KSTORE = (() => {
  const P = 'kic:';
  const raw = window.localStorage;
  const api = {
    getItem: k => raw.getItem(P + k),
    setItem: (k, v) => raw.setItem(P + k, v),
    removeItem: k => raw.removeItem(P + k),
    clear: () => { Object.keys(raw).filter(k => k.startsWith(P)).forEach(k => raw.removeItem(k)); },
  };
  // 처음 한 번: 운영 설정(운동처방사 배정·카드·사진·관리자 계정)은 예전 저장소에서 가져옵니다. 예약·임직원 계정은 가져오지 않습니다.
  if(!raw.getItem(P + '__migrated')){
    ['settings','trainerCards','trainerPhotos','adminAccts','videoLinks','exerciseVideos','notifyConfig','progEnabled']
      .forEach(k => { const v = raw.getItem(k); if(v !== null && raw.getItem(P + k) === null) raw.setItem(P + k, v); });
    raw.setItem(P + '__migrated', '1');
  }
  return api;
})();
/* ============================================================
   1. 설정  ─ 여기만 바꾸면 다른 센터·업종에도 그대로 씁니다
   ============================================================ */
const APP_TITLE = '제일리핏케어 · 임직원 웰니스';
/* 제일리핏케어 로고 (PNG, 내장). 원본 로고 파일로 바꾸려면 이 문자열만 교체하면 됩니다. */
const LOGO_DEFAULT = 'assets/logo.fce51762.png';
/* 공식 로고 주소 — 온라인이면 이 원본을 쓰고, 못 불러오면(오프라인·사내망) 내장 PNG 로 대체 */
const LOGO_URL = 'https://cheilrefitcare.com/images/logo.png';
const CONFIG = {
  brand:       '제일리핏케어',          // 이 플랫폼(운영사) 브랜드명
  company:     '제일리핏케어',          // 화면에 표시되는 브랜드명 (COMPANIES 목록과는 별개)
  /* 브라우저 탭 제목. 관리자 설정의 회사명과 무관하게 고정합니다. */
  brand:       '제일리핏케어',
  service:     '제일리핏케어 웰니스 프로그램',   // 로그인 화면에 보이는 서비스명
  logo:        LOGO_URL,            // 공식 로고 주소. 실패 시 LOGO_DEFAULT(내장) 로 자동 대체
  provider:    '제일리핏케어',            // 프로그램 운영사 (관리자 설정에서 변경)
  quota:       1,                   // 임직원 1인당 연간 지원 횟수 (KIC: 1회 서비스)
  leadHours:   3,                   // 지금부터 최소 3시간 뒤부터 신청 가능
  horizonDays: 30,                  // 오늘부터 30일 뒤까지만 열기
};


/* ============================================================
   한글 입력 보호
   ------------------------------------------------------------
   검색창에 글자를 칠 때마다 화면 전체를 다시 그리면, 한글 조합이
   끝나기 전에 입력칸이 통째로 새 것으로 바뀝니다. 그러면 '제'가
   'ㅈ', 'ㅔ' 로 쪼개져 검색이 되지 않습니다.
   조합 중에는 다시 그리지 않고, 조합이 끝난 뒤에 그립니다.
   ============================================================ */
let __ime = false;
document.addEventListener('compositionstart', () => { __ime = true; });
document.addEventListener('compositionend', e => {
  __ime = false;
  if(e.target && e.target.classList && e.target.classList.contains('livesearch')) {
    searchRender(e.target);
  }
});

window.searchRender = (el) => {
  const sel = el.getAttribute('data-sel');
  clearTimeout(window.__st);
  window.__st = setTimeout(() => {
    if(__ime) return;                    // 아직 조합 중이면 기다립니다
    render();
    const back = sel ? document.querySelector(sel) : null;
    if(back){ back.focus(); const n = back.value.length; back.setSelectionRange(n, n); }
  }, 220);
};

/* 초성 검색 — 'ㅈㅇ' 로도 '제일정형외과' 를 찾을 수 있게 합니다. */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ',
             'ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosungOf(s){
  return [...String(s || '')].map(ch => {
    const c = ch.charCodeAt(0);
    return (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c - 0xAC00) / 588)] : ch;
  }).join('');
}
const isChosung = s => /^[\u3131-\u314E]+$/.test(s);

/* ---------- 고객사(회사) 목록 ----------
   여러 회사를 한 시스템에서 운영합니다. 직원은 로그인/가입할 때 소속 회사를 고르고,
   모든 예약에 회사가 함께 저장됩니다. 관리자는 회사별로 구분해 봅니다.
   id 는 내부 식별용(영문), name 은 화면 표시용입니다. */
const COMPANIES = [
  /* headcount: 참여율 계산용 총 인원. KIC 담당자 확인 후 숫자만 고치면 됩니다 (없으면 참여율을 표시하지 않음). */
  { id:'kic',        name:'한국투자공사', headcount:300,
    /* v206: MY 상단에 보일 회사 로고 — 'assets/kic_logo.png' 같은 파일 경로나 data:image/png;base64,… 를 넣으세요. 비우면 이름 첫 글자가 나옵니다. */
    logo:'assets/img_2.d07b0739.png' },
];
const companyName = id => (COMPANIES.find(c=>c.id===id)?.name) || id || '미지정';
const companyHeadcount = id => COMPANIES.find(c=>c.id===id)?.headcount || 0;

const companyById = id => COMPANIES.find(c => c.id === id) || null;
// 회사 이름 검색. 비워 두면 전체 목록을 돌려줍니다.
// 띄어쓰기는 무시하고, 초성만 쳐도 찾아집니다.
function searchCompanies(q){
  const s = String(q || '').trim().toLowerCase().replace(/\s+/g, '');
  if(!s) return COMPANIES;
  const cho = isChosung(s);
  return COMPANIES.filter(c => {
    const name = c.name.toLowerCase().replace(/\s+/g, '');
    if(name.includes(s)) return true;
    return cho && chosungOf(name).includes(s);
  });
}

/* 프로그램별 담당 운동처방사 배정.
   관리자 화면에서 바꾸면 settings('program_hosts')에 저장되고,
   앱이 뜰 때 이 값이 프로그램 정의보다 우선합니다. */
const HOST_OVERRIDE = {};

/* 이 프로그램을 맡는 운동처방사 목록 (없으면 대표 담당자 한 명) */
function programHosts(p){
  if(!p) return [];
  const ov = HOST_OVERRIDE[p.id];
  if(ov && ov.length)
    return ov.map(nm => ({name:nm, role:(trainerProfile(nm).role) ||
      ((p.hosts||[]).find(t => t.name === nm) || {}).role || ''}));
  if(p.hosts && p.hosts.length) return p.hosts;
  return p.host ? [{name:p.host, role:p.role || ''}] : [];     // 배정 전에는 비어 있음
}

/* 배정 후보 — 프로필이 등록된 사람 + 지금 배정돼 있는 사람(새로 넣은 이름 포함) */
const TRAINER_POOL = () => {
  const out = Object.keys(TRAINER_PROFILES)
    .filter(nm => (TRAINER_PROFILES[nm].career || []).length);
  PROGRAMS.forEach(p => programHosts(p).forEach(t => {
    if(t.name && !out.includes(t.name)) out.push(t.name);
  }));
  return out;
};

/* 새 운동처방사 이름을 직접 적는 칸의 상태 — 키는 '프로그램|지금담당자' */
const TR_NEW = {};
window.openNewTrainer = (pid, oldName) => {
  TR_NEW[pid + '|' + oldName] = '';
  render();
};
window.cancelNewTrainer = (pid, oldName) => {
  delete TR_NEW[pid + '|' + oldName];
  render();
};
window.setNewTrainer = (pid, oldName, v) => { TR_NEW[pid + '|' + oldName] = v; };

/* 적은 이름으로 담당자를 교체합니다. 없는 사람이면 새로 만들어 둡니다. */
window.confirmNewTrainer = (pid, oldName) => {
  const name = String(TR_NEW[pid + '|' + oldName] || '').trim();
  if(!name){ toast('운동처방사 이름을 적어 주세요.'); return; }
  const cur = programHosts(programById(pid)).map(t => t.name);
  if(cur.includes(name) && name !== oldName){
    toast('이미 배정된 운동처방사입니다.'); return;
  }
  if(!TRAINER_PROFILES[name]){
    // 경력은 비워 두고 이름만 등록합니다. 상세는 PDF 로 올리거나 나중에 채웁니다.
    TRAINER_PROFILES[name] = {since:'', edu:'', certs:[], spec:[], career:[], intro:''};
  }
  HOST_OVERRIDE[pid] = oldName === '__add' ? cur.concat([name]) : cur.map(x => x === oldName ? name : x);
  delete TR_NEW[pid + '|' + oldName];
  toast(oldName === '__add' ? `${name} 님을 추가했습니다. 저장을 눌러 주세요.`
                            : `담당 운동처방사를 ${name} 님으로 바꿨습니다. 저장을 눌러 주세요.`);
  render();
};

/* 후보 목록에서도 지웁니다 — 모든 프로그램에서 배정을 풀고 경력·PDF 기록까지 제거 */
window.deleteTrainer = (name) => {
  const blocked = PROGRAMS.filter(p => { const c = programHosts(p).map(t => t.name); return c.includes(name) && c.length <= 1; });
  if(blocked.length){ toast(`${blocked[0].name}의 유일한 담당자입니다. 먼저 다른 운동처방사를 배정해 주세요.`); return; }
  if(!confirm(`${name} 님을 운동처방사 목록에서 삭제할까요?\n모든 프로그램 배정이 풀리고 경력 정보도 지워집니다. (지난 예약 기록은 남습니다)`)) return;
  PROGRAMS.forEach(p => {
    const c = programHosts(p).map(t => t.name);
    if(c.includes(name)) HOST_OVERRIDE[p.id] = c.filter(x => x !== name);
  });
  delete TRAINER_PROFILES[name];
  delete TR_DOC[name];
  toast(`${name} 님을 삭제했습니다. 배정 저장을 눌러 주세요.`);
  render();
};
/* 이 프로그램에 담당 자리를 하나 더 만듭니다 (후보 중 아직 배정되지 않은 사람) */

  const cur = programHosts(programById(pid)).map(t => t.name);
  const free = TRAINER_POOL().filter(nm => !cur.includes(nm));

  const cur = programHosts(programById(pid)).map(t => t.name);

  render();

/* 운동처방사 경력 PDF — 파일 자체는 브라우저에만 두고, 이름·크기·올린 날짜만 기록합니다.
   실제 운영에서는 Supabase Storage 에 올리고 경로를 settings 에 저장하면 됩니다. */
const TR_DOC = {};

window.uploadTrainerDoc = async (name, input) => {
  const f = input.files && input.files[0];
  if(!f) return;
  if(f.type !== 'application/pdf'){ toast('PDF 파일만 올릴 수 있습니다.'); input.value=''; return; }
  if(f.size > 10 * 1024 * 1024){ toast('10MB 이하 PDF 만 올릴 수 있습니다.'); input.value=''; return; }

  TR_DOC[name] = {file:f.name, size:f.size, at:new Date().toISOString(),
                  url:URL.createObjectURL(f), lines:[], busy:true};
  toast(`${name} 운동처방사 경력 파일을 읽는 중입니다…`);
  render();

  try{
    const lines = await readPdfLines(await f.arrayBuffer());
    TR_DOC[name].lines = lines;
    if(!lines.length){
      TR_DOC[name].err = '글자를 읽지 못했습니다. 스캔한 이미지 PDF 이거나 글자가 그림으로 들어간 파일입니다. 워드·한글에서 "PDF로 저장"한 파일을 올리거나, 아래 "카드 편집"에서 직접 입력해 주세요.';
    }else{
      const parsed = parseTrainerPdf(lines);
      const got = parsed.certs.length + parsed.spec.length + parsed.career.length + (parsed.edu ? 1 : 0) + (parsed.intro ? 1 : 0);
      applyPdfProfile(name, parsed);
      if(!got){
        TR_DOC[name].err = `글자 ${lines.length}줄은 읽었지만 항목 제목(경력 / 자격 / 전문 분야 / 학력 / 소개)을 찾지 못해 카드에 넣지 못했습니다. 양식(운동처방사_경력_양식.docx)대로 제목을 붙여 다시 올리거나 "카드 편집"에서 직접 입력해 주세요.`;
      }else{
        TR_DOC[name].note = `학력 ${parsed.edus.length} · 경력 ${parsed.career.length} · 자격 ${parsed.certs.length} · 전문 분야 ${parsed.spec.length}${false ? ' · 학력' : ''}${parsed.intro ? ' · 소개' : ''} 를 읽어 넣었습니다.`;
        toast(`${name} 운동처방사 경력을 PDF 에서 불러왔습니다.`);
      }
    }
  }catch(e){
    console.error(e);
    TR_DOC[name].err = String(e && e.message) === 'pdfjs_load_failed'
      ? 'PDF 읽기 도구(pdf.js)를 인터넷에서 불러오지 못했습니다. 인터넷 연결 또는 사내망 차단(cdnjs.cloudflare.com)을 확인해 주세요. 파일은 보관됩니다.'
      : 'PDF 를 읽지 못했습니다(암호가 걸렸거나 손상된 파일일 수 있음). 파일은 그대로 보관되며 열어 보실 수 있습니다.';
  }
  TR_DOC[name].busy = false;
  render();
};
window.removeTrainerDoc = (name) => { delete TR_DOC[name]; render(); };

/* ============================================================
   경력 PDF 읽기
   ------------------------------------------------------------
   올린 PDF 에서 글자를 뽑아 운동처방사 경력 카드에 채웁니다.
   pdf.js 는 처음 한 번만 내려받아 씁니다(오프라인이면 원문 보기만 됩니다).
   ============================================================ */
const PDFJS_SRC    = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFJS_WORKER = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PDFJS_SRC;
    s.onload = () => {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_WORKER;
      res(window.pdfjsLib);
    };
    s.onerror = () => rej(new Error('pdfjs_load_failed'));
    document.head.appendChild(s);
  });
}

/* PDF 의 글자를 줄 단위로 뽑습니다. 같은 높이(y)에 있는 조각을 한 줄로 묶습니다. */
async function readPdfLines(buf){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: buf.slice(0)}).promise;
  const out = [];
  for(let i = 1; i <= doc.numPages; i++){
    const page = await doc.getPage(i);
    const tc = await page.getTextContent();
    const rows = new Map();
    tc.items.forEach(it => {
      if(!it.str || !it.str.trim()) return;
      const key = Math.round(it.transform[5] / 3);      // 3px 이내는 같은 줄로 봅니다
      if(!rows.has(key)) rows.set(key, []);
      rows.get(key).push({
        x: it.transform[4],
        w: it.width || 0,
        h: Math.abs(it.transform[3] || it.transform[0] || 10),
        s: it.str,
      });
    });
    [...rows.entries()]
      .sort((a, b) => b[0] - a[0])                      // 위에서 아래로
      .forEach(([, arr]) => {
        // 글자 조각을 이어 붙입니다. 한글 PDF 는 글자 하나씩 쪼개져 오는 경우가 많아
        // 무조건 띄어쓰기를 넣으면 '김 지 훈' 처럼 됩니다.
        // 조각 사이가 글자 크기의 1/4 보다 벌어졌을 때만 띄어 씁니다.
        let line = '', end = null;
        arr.sort((a, b) => a.x - b.x).forEach(o => {
          // 같은 낱말 안은 간격이 0 에 가깝고, 띄어쓰기는 글자 크기의 0.2 배쯤 벌어집니다.
          if(end !== null && o.x - end > o.h * 0.12 && !/\s$/.test(line)) line += ' ';
          line += o.s;
          end = o.x + o.w;
        });
        line = line.replace(/\s+/g, ' ').trim();
        if(line) out.push(line);
      });
  }
  return out;
}

/* 뽑은 줄을 소개 · 학력 · 경력 · 자격 · 전문 분야로 나눕니다.
   제목 줄을 만나면 그 아래를 해당 묶음으로 넣습니다. */
const PDF_HEADS = [
  ['career', /^(주요\s*)?(약력|경력|이력|근무\s*경력|career)/i],
  ['certs',  /^(자격|자격사항|보유\s*자격|면허|자격증|certificat|license)/i],
  ['spec',   /^(전문\s*분야|주요\s*분야|specialt)/i],
  ['edu',    /^(학력|전공|education)/i],
  ['intro',  /^(소개|한\s*마디|프로필|introduc)/i],
];

function parseTrainerPdf(lines){
  const out = {intro:'', edu:'', edus:[], certs:[], spec:[], career:[], raw:lines.slice()};
  let sec = '';
  const split = t => t.split(/\s*[,·/|]\s*|\s{2,}/).map(x => x.replace(/^#/, '').trim()).filter(Boolean);

  // 자격사항처럼 두 단으로 놓인 줄은 '• ' 기준으로 쪼개 한 항목씩 봅니다.
  const flatLines = [];
  // 오른쪽 단은 왼쪽 단을 다 읽은 뒤에 붙입니다 (PDF 두 단 순서 유지).
  lines.forEach(l => { const parts = l.split(/\s+[•▪◦\u2022]\s*/); parts.forEach((x, k) => { if(x.trim()) flatLines.push(k ? '\u0001' + x : x); }); });
  const right = {certs:[], spec:[], career:[]};
  flatLines.forEach(line0 => {
    const isRight = line0.charCodeAt(0) === 1;
    const line = isRight ? line0.slice(1) : line0;
    const t = line.replace(/^[•·▪◦\-*\u2022]\s*/, '').trim();
    if(!t) return;
    if(isRight && (sec === 'certs' || sec === 'spec')){ right[sec].push(...split(t)); return; }

    const flat = t.replace(/\s+/g, '');
    const head = PDF_HEADS.find(([, re]) => re.test(flat) && flat.length <= 12);
    if(head){
      sec = head[0];
      // '소개' 제목을 만나면, 제목 앞에서 임시로 잡아 둔 소개는 버립니다.
      if(sec === 'intro') out.intro = '';
      return;
    }

    if(sec === 'career'){
      // "現) 농협 … 건강운동관리사" / "前) 삼성 SDS …" 처럼 現·前 표기 줄
      const p = t.match(/^(現|前|현|전)\s*[)）]\s*(.+)$/);
      // "2019–2023  기업 출강 웰니스 강사" 처럼 연도로 시작하는 줄
      const m = t.match(/^(\d{4}\s*[–—~\-]\s*(?:\d{4}|현재|현\s*재|now|present))\s*[:.\-·]?\s*(.+)$/i)
             || t.match(/^(\d{4})\s*[:.\-·]\s*(.+)$/);
      if(p) out.career.push([p[1] === '현' ? '現' : p[1] === '전' ? '前' : p[1], p[2].trim()]);
      else if(m) out.career.push([m[1].replace(/\s+/g, ''), m[2].trim()]);
      else if(/(학사|석사|박사|대학교|대학원|학과)/.test(t)){           // 약력 안의 학력 줄 → 학력 칸
        if(!out.edu) out.edu = t;
        out.edus.push(t);
      }
      else if(out.career.length && !/^[A-Za-z가-힣]/.test(t)) out.career[out.career.length - 1][1] += ' ' + t;
      else out.career.push(['', t]);
    }
    else if(sec === 'certs') out.certs.push(...split(t));
    else if(sec === 'spec')  out.spec.push(...split(t));
    else if(sec === 'edu'){ if(!out.edu) out.edu = t; out.edus.push(...split(t).length > 1 && !/대학/.test(t) ? split(t) : [t]); }
    else if(sec === 'intro') out.intro = (out.intro + ' ' + t).trim();
    else if(!sec){ /* 제목 앞 줄(회사명·이름·직함)은 카드에 쓰지 않습니다 */ }
  });

  out.certs = [...new Set(out.certs.concat(right.certs))].slice(0, 14);
  out.spec  = [...new Set(out.spec.concat(right.spec))].slice(0, 12);
  return out;
}

/* 읽은 내용을 운동처방사 프로필에 반영합니다. 비어 있는 항목은 기존 값을 남깁니다. */
function applyPdfProfile(name, parsed){
  const cur = TRAINER_PROFILES[name] || {since:'', edu:'', certs:[], spec:[], career:[], intro:''};
  TRAINER_PROFILES[name] = {
    ...cur,
    intro:  parsed.intro  || cur.intro,
    edu:    parsed.edu    || cur.edu,
    certs:  parsed.certs.length  ? parsed.certs  : cur.certs,
    spec:   parsed.spec.length   ? parsed.spec   : cur.spec,
    career: parsed.career.length ? parsed.career : cur.career,
  };
  // 임직원 화면의 운동처방사 카드에도 반영 (자격 목록 · 경력 연차)
  const patch = {};
  if(parsed.spec.length)  patch.spec  = parsed.spec.slice(0, 4);
  if(parsed.career.length) patch.career = parsed.career.map(([w, t]) => careerLine(w, t)).slice(0, 12);
  if(parsed.certs.length)  patch.certs  = parsed.certs.slice(0, 14);
  if(parsed.intro)         patch.quote  = esc(parsed.intro);          // '소개' 제목 아래 한 줄 → 카드 소개
  if(parsed.edus.length)   patch.edu    = [...new Set(parsed.edus)].slice(0, 4);
  const yrs = careerYears(name); if(yrs) patch.years = yrs;
  if(Object.keys(patch).length) saveTrainerCard(name, patch);
}

/* 카드 아래에 붙는 'PDF 원문' 묶음 — 뽑은 글자를 모두 보여 줍니다. */
function trainerDocHTML(name){
  const d = TR_DOC[name];
  if(!d) return '';
  const raw = (d.lines || []);
  return `<div class="trdoc">
    <div class="trdoc-h">${ico('picture_as_pdf','')} ${esc(d.file)}
      <span>${(d.size/1024).toFixed(0)}KB · ${fmtDate(String(d.at).slice(0,10))} 올림</span></div>
    ${d.err ? `<p class="trdoc-e">${esc(d.err)}</p>` : ''}
    ${raw.length ? `<details class="trdoc-raw">
      <summary>PDF 원문 ${raw.length}줄 모두 보기</summary>
      <div class="trdoc-lines">${raw.map(l => `<p>${esc(l)}</p>`).join('')}</div>
    </details>` : ''}
    <div class="trdoc-a">
      <a class="mini" href="${d.url}" target="_blank" rel="noopener">PDF 열기</a>
      <a class="mini" href="${d.url}" download="${esc(d.file)}">내려받기</a>
    </div>
  </div>`;
}

/* 담당 운동처방사를 다른 사람으로 바꿉니다. */
window.replaceProgramHost = (pid, oldName, newName) => {
  if(!newName || oldName === newName) return;
  const cur = programHosts(programById(pid)).map(t => t.name);
  if(cur.includes(newName)){ toast('이미 배정된 운동처방사입니다.'); return render(); }
  HOST_OVERRIDE[pid] = cur.map(x => x === oldName ? newName : x);
  render();
};

window.saveProgramHosts = async () => {
  try{
    await DB.setSetting('program_hosts', JSON.stringify(HOST_OVERRIDE));
    toast('담당 운동처방사를 저장했습니다.');
  }catch(e){ console.error(e); toast('저장에 실패했습니다.'); }
  render();
};
const ALL_HOSTS = () => {
  const seen = [];
  PROGRAMS.forEach(p => programHosts(p).forEach(t => {
    if(!seen.includes(t.name)) seen.push(t.name);
  }));
  return seen;
};

function trainerProfile(name){
  return TRAINER_PROFILES[name] || {since:'', edu:'', certs:[], spec:[], career:[], intro:''};
}
/* 경력 한 줄 표기: 現) … / 前) … / 2019–2023 … */
function careerLine(w, t){ return (/^(現|前)$/.test(w) ? `${w}) ${t}` : `${w} ${t}`).trim(); }
function careerYears(name){
  const s = trainerProfile(name).since;
  if(!s) return null;
  return Math.max(1, new Date().getFullYear() - Number(s) + 1);
}

/* ---------- 프로그램 목록 ----------

/* 한국투자공사 대상 서비스는 프로그램 하나로 운영합니다.
   나중에 늘릴 때는 이 배열에 항목을 추가하면 화면이 자동으로 목록형으로 돌아갑니다. */
const PROGRAMS = [

    blurb:'근긴장을 풀고 자세를 바로잡아 업무 컨디션을 관리합니다.',

    durationMin:45, host:'김정환', role:'운동처방사',
    /* KIC 기본 담당 3명. 플랫폼 관리자 › 운동처방사 경력에서 바꾸면 program_hosts 설정이 우선합니다. */

    location:'KIC 본사 휴게실',
    /* v185: 운영 기간 — 이 기간 밖의 날짜는 캘린더에서 닫힙니다. 비우면('') 오늘부터 horizonDays 동안 엽니다. */
    openFrom:'2026-11-02', openTo:'2026-11-30',
    workDays:[1,2,3,4],                       /* v185: 월~목 (금요일 휴무) */
    /* v185: 휴게실(자리) — 시간대 기준 시각에서 5분씩 늦게 시작합니다.

const EDIT_CUTOFF_MIN = 30;   // v188: 프로그램 시작 30분 전까지 직접 변경·취소 (settings 의 edit_cutoff_min 도 30 으로 맞추세요)
/* "하루 전" / "3시간 전" / "30분 전" 처럼 읽기 좋게 */
const cutoffLabel = () => EDIT_CUTOFF_MIN % 1440 === 0 ? (EDIT_CUTOFF_MIN === 1440 ? '하루 전' : `${EDIT_CUTOFF_MIN/1440}일 전`)
  : EDIT_CUTOFF_MIN % 60 === 0 ? `${EDIT_CUTOFF_MIN/60}시간 전` : `${EDIT_CUTOFF_MIN}분 전`;

/* (호환용) 예전 이름을 참조하는 코드가 남아 있어도 깨지지 않게 둡니다. */
const EDIT_WINDOW_MIN = EDIT_CUTOFF_MIN;

/* 'YYYY-MM-DD' 와 'HH:MM[:SS]' 를 하나의 시각으로 만듭니다. */
function slotAt(dstr, tstr){
  if(!dstr || !tstr) return null;
  const [y,m,d]  = String(dstr).split('-').map(Number);
  const [h,mi]   = String(tstr).slice(0,5).split(':').map(Number);
  const dt = new Date(y, m-1, d, h, mi, 0, 0);
  return isNaN(dt.getTime()) ? null : dt;
}

/* 마감까지 남은 시간(ms). 지났으면 0 이하가 됩니다. */
function cutoffLeft(dstr, tstr){
  const dt = slotAt(dstr, tstr);
  if(!dt) return 0;
  return dt.getTime() - EDIT_CUTOFF_MIN*60000 - Date.now();
}

/* 아직 직접 변경·취소할 수 있는지 */
function canEditSlot(dstr, tstr){ return cutoffLeft(dstr, tstr) > 0; }

   (예전에는 스트레스를 물었지만, 프로그램 효과를 회차별로 보려면
    통증 쪽이 훨씬 직접적인 지표라 바꿨습니다) */
/* 통증이 있다고 답한 경우에만 부위를 여쭤봅니다. */
const PAIN_YES = ['조금 있습니다', '많이 있습니다'];

const RECHECK_Q = [
  {id:'pain_has',  type:'radio', q:'현재 통증이 있습니까?', required:true,
                   options:['없습니다','조금 있습니다','많이 있습니다']},
  /* when 이 false 면 화면에 그리지도, 필수로 따지지도 않습니다. */
  {id:'injury',    type:'bodymap', mapOnly:true, q:'통증이 있는 부위는 어디입니까?', required:true,
                   when: a => PAIN_YES.includes(a.pain_has),
                   hint:'그림에서 아픈 곳을 눌러 주세요 · 없으면 그냥 넘어가셔도 됩니다',
                   options: BODY_PARTS},
  /* 통증 정도는 위 그림에서 부위마다 고릅니다. 여기에는 가장 센 값이 들어갑니다. */
  {id:'pain',      type:'vas', hidden:true, q:'통증 강도 (VAS)', required:false, min:0, max:5},
  {id:'pain_note', type:'text', q:'지난 회차와 달라진 점이 있나요?', required:false,
                   placeholder:'선택 사항입니다'},
];

/* 재확인 대상 항목 id */
const RECHECK_IDS = RECHECK_Q.map(q => q.id);

/* 재확인을 권할 시점 — 마지막 문진 이후 이 일수가 지났거나,
   그 사이에 프로그램을 마쳤으면 다시 여쭤봅니다. */
const RECHECK_DAYS = 30;

/* 가장 최근 응답 — 재확인 기록이 있으면 그것, 없으면 가입 문진 */
function lastAnswers(){
  const h = BASE.history || [];
  if(h.length){
    const last = h[h.length - 1];
    return {ans: {...(BASE.saved||{}), ...last.ans}, at: last.at,
            label: fmtDateShort(String(last.at).slice(0,10)), kind:'recheck'};
  }
  if(BASE.saved && Object.keys(BASE.saved).length)
    return {ans: BASE.saved, at: BASE.savedAt, label: '가입 문진', kind:'baseline'};
  return null;
}

/* 예약에 함께 저장할 문진 스냅샷 — 가입 문진 + 가장 최근 재확인 */
function currentIntake(){
  const prev = lastAnswers();
  return prev ? {...prev.ans} : {};
}

/* 재확인 문항 — 지난 응답을 힌트로 붙여 변화가 보이게 합니다. */
function recheckQs(){
  const prev = lastAnswers();
  if(!prev) return RECHECK_Q;
  return RECHECK_Q.map(q => {
    const pv = prev.ans[q.id];
    if(!hasVal(pv)) return q;
    const txt = Array.isArray(pv) ? pv.join(', ') : String(pv);
    return {...q, hint: `지난 응답(${prev.label}) ${txt}` + (q.hint ? ' · ' + q.hint : '')};
  });
}

/* 언제 다시 여쭤볼지 */
/* 스트레스 추가 상담이 필요한 시점
   ── 프로그램을 한 번이라도 마쳤고,
      그 뒤로 스트레스를 다시 확인한 적이 없으면 받습니다.
      마친 프로그램이 없으면(첫 신청) 가입 문진으로 충분합니다. */
function recheckDue(){
  const prev = lastAnswers();
  if(!prev || !prev.at) return false;
  const last = new Date(prev.at);

  // 날짜만 비교합니다. (문진과 프로그램이 같은 날이어도 잡히도록)
  const lastDay = String(prev.at).slice(0, 10);
  const doneAfter = (MG.list || []).some(b =>
    b.status === 'done' && b.slot_date && String(b.slot_date) >= lastDay);
  if(doneAfter) return true;

  // 마친 프로그램이 있는데 문진이 오래된 경우에도 한 번 더 확인합니다.
  const everDone = (MG.list || []).some(b => b.status === 'done');
  if(!everDone) return false;
  return (Date.now() - last.getTime()) / 86400000 >= RECHECK_DAYS;
}

// 데모 모드용 집계. 실서비스에서는 서버(company_overview)가 같은 형태로 돌려줍니다.
function localOverview(companyId){
  const rows = local.all().filter(r => !companyId || (r.company || '') === companyId);
  const live = rows.filter(r=>r.status!=='canceled');
  // 만족도는 '이용 완료' 건에서만 셉니다. 취소된 뒤 남은 응답이 분자에 끼어 100%를 넘지 않게.
  const doneRows = rows.filter(r=>r.status==='done');
  const withS = doneRows.filter(r=>r.survey && typeof r.survey.overall==='number');
  const byProgram = {}, byDept = {}, byMonth = {};
  live.forEach(r=>{
    byProgram[r.program||'pt'] = (byProgram[r.program||'pt']||0)+1;
    const d = r.intake?.dept || '미입력';
    byDept[d] = (byDept[d]||0)+1;
    const m = (r.slot_date||'').slice(0,7);
    if(m) byMonth[m] = (byMonth[m]||0)+1;
  });
  const sortDesc = o => Object.entries(o).sort((a,b)=>b[1]-a[1]);
  return {
    total: live.length,
    done: rows.filter(r=>r.status==='done').length,
    upcoming: rows.filter(r=>r.status==='booked').length,
    canceled: rows.filter(r=>r.status==='canceled').length,
    people: new Set(live.map(r=>(r.email||'').toLowerCase())).size,
    avg_overall: withS.length ? (withS.reduce((s,r)=>s+r.survey.overall,0)/withS.length).toFixed(2) : null,
    responses: withS.length,   // 분모(done)와 같은 모집단
    by_program: sortDesc(byProgram).map(([program,n])=>({program,n})),
    // 5명 미만 부서는 역추적 방지를 위해 숨깁니다 (서버와 동일 규칙)
    by_dept: sortDesc(byDept).filter(([,n])=>n>=5).map(([dept,n])=>({dept,n})),
    by_month: Object.entries(byMonth).sort().map(([m,n])=>({m,n})),
  };
}

/* 임시 비밀번호 자동 생성: 헷갈리는 글자(0 O 1 l I) 제외. 길이는 관리자 화면에서 정합니다(기본 8, 고정 아님). */
let TEMP_PW_LEN = 8;
function tempPassword(len){ const C = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789'; let s = '';
  const L = Math.max(1, Number(len || TEMP_PW_LEN) || 8);
  const a = new Uint32Array(L); crypto.getRandomValues(a); for(const n of a) s += C[n % C.length]; return s; }

  async manageBooking(code, action, date, time, trainer){
    const c = code.trim().toUpperCase();
    if(!LIVE){
      const rows = local.all();
      const b = rows.find(x=>x.code===c);

      if(b.status !== 'booked') return 'not_editable';
      // 지금 잡혀 있는 일정 기준으로 마감을 판정합니다.

      if(action === 'reschedule'){
        if(rows.some(x=>x.code!==c && x.program===b.program && x.slot_date===date
                     && x.slot_time===time && x.status!=='canceled'))

        b.slot_date = date; b.slot_time = time; if(trainer !== undefined) b.trainer = trainer || null; local.save(rows); return 'changed';

    let res = await sb.rpc('manage_booking',
      {p_code:c, p_action:action, p_date:date||null, p_time:time||null, p_trainer:trainer||null});

      res = await sb.rpc('manage_booking', {p_code:c, p_action:action, p_date:date||null, p_time:time||null});

    if(e2) return {ok:false, msg:'역할 등록에 실패했습니다: '+e2.message};
    return {ok:true, role, needConfirm: !data.session};
  },

  /* --- 직원(회원) 인증 --- */
  // 데모 모드에서는 브라우저에 계정을 저장합니다. 실서비스는 Supabase Auth를 씁니다.
  memberStore: {
    all(){ try{ return JSON.parse(KSTORE.getItem('members')||'{}'); }catch{ return {}; } },
    save(m){ KSTORE.setItem('members', JSON.stringify(m)); },
    session(){ try{ return JSON.parse(KSTORE.getItem('memberSession')||'null'); }catch{ return null; } },
    setSession(u){ u ? KSTORE.setItem('memberSession', JSON.stringify(u))
                     : KSTORE.removeItem('memberSession'); },
  },
  // 간단 해시 (데모 전용 — 평문 저장만 피하는 수준)
  _hash(s){ let h=0; for(let i=0;i<s.length;i++){ h=(h<<5)-h+s.charCodeAt(i); h|=0; } return String(h); },

  /* profile = {sex, age, birth_year} — 가입할 때 주민등록번호로 확인한 값입니다.
     원본 숫자는 받지도, 저장하지도 않습니다. */
  async memberSignUp(name, email, password, company, profile, phone, empno){
    const e = authEmailOf(email);
    const pf = profile || null;
    const ph = (phone||'').trim() || null;
    const en = String(empno||'').trim();
    if(!LIVE){
      const m = this.memberStore.all();
      if(m[e]) return {ok:false, msg:'이미 사용 중인 아이디입니다. 로그인해 주세요.'};
      if(en && Object.values(m).some(r => String(r.empno||'') === en))
        return {ok:false, msg:`사번 ${en} 으로 이미 발급된 아이디가 있습니다. 사번당 아이디는 하나만 쓸 수 있습니다. 발급받은 아이디로 로그인하거나 담당자에게 문의해 주세요.`};
      m[e] = {name:name.trim(), email:e, company:company||'', pw:this._hash(password), empno:en || null,
              phone:ph, profile:pf, baseline:null, baselineAt:null};
      this.memberStore.save(m);
      this.memberStore.setSession({name:name.trim(), email:e, company:company||'',
                                   phone:ph, profile:pf, baselineAt:null});
      return {ok:true, user:{name:name.trim(), email:e, company:company||'',
                             phone:ph, profile:pf, baselineAt:null}};
    }
    // v178: 서버 함수가 승인 명단을 확인하고 계정을 만듭니다 (Supabase 의 공개 가입은 꺼 둠)
    const made = await this._provision({action:'signup', id:email, password, name:name.trim(), company:company||'', phone:ph, empno:en, profile:pf});
    if(!made.ok) return {ok:false, msg: made.msg || '가입하지 못했습니다.'};
    const {data, error} = await sb.auth.signInWithPassword({email:e, password});
    if(error) return {ok:false, msg:'계정은 만들어졌습니다. 로그인 화면에서 로그인해 주세요.'};
    await this.syncEmployee(name.trim(), company||'', ph);
    return {ok:true, user:{name:name.trim(), email:e, company:company||'', phone:ph, empno:en||null, profile:pf, baselineAt:null, mustChangePw:false}, needConfirm:false};

  /* ── 회원가입 승인 명단 — 플랫폼 관리자가 미리 넣어 둔 사람만 직접 회원가입할 수 있습니다 ──
     항목: {key:'아이디·이메일·사번 중 하나', name:'이름(선택)', at:'ISO'}  (키는 소문자로 비교) */
  approvedList(){ if(LIVE) return ACC.approvedCache || []; try{ return JSON.parse(KSTORE.getItem('signupApproved') || '[]'); }catch{ return []; } },
  approvedSave(list){ KSTORE.setItem('signupApproved', JSON.stringify(list)); },
  async approvedAdd(rows){
    if(LIVE){
      const items = rows.map(r => ({key:String(r.key||'').trim().toLowerCase(), name:String(r.name||'').trim() || null})).filter(r => r.key);
      if(!items.length) return 0;
      const before = new Set((ACC.approvedCache || []).map(x => x.key));
      const {error} = await sb.from('signup_approved').upsert(items, {onConflict:'key', ignoreDuplicates:true});
      if(error){ toast('승인 명단 저장 실패: ' + error.message); return 0; }
      await loadAccountsLive();
      return items.filter(x => !before.has(x.key)).length;
    }
    const list = this.approvedList(); let n = 0;
    rows.forEach(r => { const k = String(r.key||'').trim().toLowerCase(); if(!k || list.some(x => x.key === k)) return;
      list.push({key:k, name:String(r.name||'').trim(), at:new Date().toISOString()}); n++; });
    this.approvedSave(list); return n;
  },
  async approvedRemove(key){
    if(LIVE){ const {error} = await sb.from('signup_approved').delete().eq('key', key); if(error) toast('삭제 실패: ' + error.message); await loadAccountsLive(); return; }
    this.approvedSave(this.approvedList().filter(x => x.key !== key)); },
  /* 가입하려는 사람이 승인 명단에 있는지 — 아이디, 이메일, 사번 중 하나라도 맞으면 통과 */
  async isSignupApproved(id, empno){
    if(LIVE){
      const {data, error} = await sb.rpc('is_signup_approved', {p_id:String(id||''), p_empno:String(empno||'') || null});
      if(error){ console.error(error); return {ok:false}; }
      return data && data.ok ? {ok:true, hit:{name:data.name || ''}} : {ok:false, empty:!!(data && data.empty)};
    }
    const list = this.approvedList(); if(!list.length) return {ok:false, empty:true};
    const cands = [String(id||'').trim().toLowerCase(), String(empno||'').trim().toLowerCase(), authEmailOf(id||'')].filter(Boolean);
    const hit = list.find(x => cands.includes(x.key));
    return hit ? {ok:true, hit} : {ok:false};
  },

  /* ── 임직원 계정 발급(사번 기준) — 관리자용 ──
     데모: 브라우저 저장소. 운영(LIVE): 서비스 키가 필요하므로 Edge Function(provision_accounts)로 옮겨야 합니다. */
  memberList(){ if(LIVE) return ACC.membersCache || []; return Object.values(this.memberStore.all()); },
  /* 운영 모드: 서버 함수 호출 (로그인 토큰은 supabase-js 가 자동으로 붙입니다) */
  async _provision(body){
    const {data, error} = await sb.functions.invoke('provision-accounts', {body});
    if(error){
      let msg = error.message || '서버 함수 호출 실패';
      try{ const j = await error.context?.json?.(); if(j && j.msg) msg = j.msg; }catch(_){}
      return {ok:false, msg};
    }
    return data || {ok:false, msg:'응답 없음'};
  },
  async provisionMembers(rows, company){
    if(LIVE){
      // 비밀번호를 비운 줄은 여기서 만들어 보냅니다 (관리자가 정한 길이 사용)
      const prepared = rows.map(r => ({...r, pw: String(r.pw||'').trim() || tempPassword()}));
      const res = await this._provision({action:'create', rows:prepared});
      if(res.ok) await loadAccountsLive();
      return res;
    }
    const m = this.memberStore.all(); const out = [];
    rows.forEach(r => {
      const en = String(r.empno||'').trim(); const name = String(r.name||'').trim();
      const id = String(r.id || en).trim();
      if(!id || !name){ out.push({empno:en, name, id, status:'skip', note:'아이디·이름 누락'}); return; }
      if(!validLoginId(id)){ out.push({empno:en, name, id, status:'skip', note:LOGIN_ID_RULE}); return; }
      const e = authEmailOf(id);
      if(m[e]){ out.push({empno:en, name, id, status:'exists', note:'이미 있는 아이디'}); return; }
      if(en && Object.values(m).some(x => String(x.empno||'') === en)){ out.push({empno:en, name, id, status:'exists', note:'같은 사번의 아이디가 이미 있음'}); return; }
      const pw = String(r.pw||'').trim() || tempPassword();          // 줄에 적은 비밀번호가 있으면 그대로, 없으면 자동 생성
      m[e] = {name, email:e, company:'', pw:this._hash(pw), empno:en, phone:null, dept:String(r.dept||'').trim()||null,   // 회사는 첫 로그인 때 본인이 선택
              profile:null, baseline:null, baselineAt:null, mustChangePw:true, provisionedAt:new Date().toISOString()};
      out.push({empno:en, name, id, pw, status:'created'});
    });
    this.memberStore.save(m);
    return {ok:true, rows:out};
  },
  async resetMemberPw(email, given){
    if(LIVE){ const pw = String(given||'').trim() || tempPassword(); const res = await this._provision({action:'reset', email, pw}); if(res.ok) await loadAccountsLive(); return res; }
    const m = this.memberStore.all(); const rec = m[email]; if(!rec) return {ok:false, msg:'계정이 없습니다.'};
    const pw = String(given||'').trim() || tempPassword(); rec.pw = this._hash(pw); rec.mustChangePw = true; m[email] = rec; this.memberStore.save(m);
    return {ok:true, pw};
  },
  async removeMember(email){
    if(LIVE){ const res = await this._provision({action:'remove', email}); if(res.ok) await loadAccountsLive(); else toast(res.msg || '삭제하지 못했습니다.'); return res; }
    const m = this.memberStore.all(); delete m[email]; this.memberStore.save(m); return {ok:true};
  },

  /* 비밀번호 변경 — 현재 비밀번호가 맞을 때만 바꿉니다.
     운영(LIVE): 현재 비밀번호로 로그인해 확인한 뒤 Supabase Auth 의 비밀번호를 바꾸고, 다시 로그아웃합니다. */
  /* 첫 로그인 설정 저장 — 이름 · 성별/연령(주민번호 앞 7자리에서 계산) · 휴대폰. 원본 번호는 저장하지 않습니다. */
  async setFirstLoginInfo(email, name, profile, phone){
    const e = authEmailOf(email);
    if(!LIVE){
      const m = this.memberStore.all(); const rec = m[e]; if(!rec) return {ok:false};
      rec.name = name || rec.name; rec.profile = profile; rec.phone = phone || null; m[e] = rec; this.memberStore.save(m);
      const s = this.memberStore.session(); if(s && s.email === e) this.memberStore.setSession({...s, name:rec.name, profile, phone:rec.phone});
      return {ok:true};
    }
    const {error} = await sb.auth.updateUser({data:{name, phone, sex:profile.sex, age_band:profile.age, birth_year:profile.birth_year, must_change_pw:false}});
    if(error) return {ok:false, msg:error.message};
    await this.syncEmployee(name, (await this.currentUser())?.company || null, phone);
