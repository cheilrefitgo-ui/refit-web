/* 위 대시보드 숫자를 규칙에 따라 문장으로 정리합니다.
   사람이 쓴 소견이 아니라 자동 요약이므로, 화면에도 그렇게 밝힙니다. */
function aiSummaryHTML(o){
  const total = o.total || 0, done = o.done || 0, up = o.upcoming || 0;
  const cancel = o.canceled || 0, people = o.people || 0;
  const resp = o.responses || 0;
  const comp = total ? Math.round(done / total * 100) : 0;
  const rate = done ? Math.min(100, Math.round(resp / done * 100)) : 0;
  const sat  = o.avg_overall ? Number(o.avg_overall) : null;
  const depts = (o.by_dept || []).slice().sort((a,b) => b.n - a.n);

  const line = (icon, tone, text) =>
    `<li class="aiop ${tone}">${ico(icon,'aiop-i')}<span>${text}</span></li>`;
  const out = [];

  // 참여
  if(!total) out.push(line('info','flat','아직 신청 기록이 없습니다. 사내 안내를 먼저 진행해 주세요.'));
  else out.push(line('groups','flat',
    `임직원 <b>${people}명</b>이 <b>${total}건</b>을 신청했고, 그중 <b>${done}건</b>이 완료되었습니다.`));

  // 완료율
  if(total){
    if(comp >= 80) out.push(line('trending_up','good',
      `이용 완료율 <b>${comp}%</b>로 예약이 실제 이용까지 잘 이어지고 있습니다.`));
    else if(comp >= 50) out.push(line('trending_flat','flat',
      `이용 완료율 <b>${comp}%</b>입니다. 예정 ${up}건이 남아 있어 마감까지 지켜볼 구간입니다.`));
    else out.push(line('trending_down','warn',
      `이용 완료율이 <b>${comp}%</b>로 낮습니다. 일정 안내 문자를 한 번 더 보내는 편이 좋겠습니다.`));
  }

  // 취소
  if(total && cancel){
    const cp = Math.round(cancel / total * 100);
    out.push(line(cp >= 20 ? 'report' : 'event_busy', cp >= 20 ? 'warn' : 'flat',
      `취소가 <b>${cancel}건(${cp}%)</b>입니다.` +
      (cp >= 20 ? ' 시간대가 업무와 겹치지 않는지 확인이 필요합니다.' : '')));
  }

  // 만족도
  if(sat !== null){
    if(sat >= 4.5) out.push(line('sentiment_very_satisfied','good',
      `평균 만족도 <b>★${sat.toFixed(2)}</b>로 매우 높습니다.`));
    else if(sat >= 4) out.push(line('sentiment_satisfied','good',
      `평균 만족도 <b>★${sat.toFixed(2)}</b>로 양호합니다.`));
    else if(sat >= 3) out.push(line('sentiment_neutral','flat',
      `평균 만족도 <b>★${sat.toFixed(2)}</b>입니다. 자유 의견을 함께 살펴보시길 권합니다.`));
    else out.push(line('sentiment_dissatisfied','warn',
      `평균 만족도 <b>★${sat.toFixed(2)}</b>로 낮습니다. 진행 방식 점검이 필요합니다.`));
  }

  // 응답률
  if(done){
    if(rate < 50) out.push(line('rate_review','warn',
      `만족도 응답률이 <b>${rate}%</b>입니다. 표본이 적어 해석에 주의가 필요합니다.`));
    else out.push(line('rate_review','flat',
      `만족도 응답률 <b>${rate}%</b>로 집계에 쓰기 충분합니다.`));
  }

  // 부서 편차
  if(depts.length >= 2){
    const top = depts[0], low = depts[depts.length - 1];
    if(top.n >= low.n * 2) out.push(line('apartment','flat',
      `<b>${esc(top.dept)}</b>(${top.n}건)와 <b>${esc(low.dept)}</b>(${low.n}건)의 참여 차이가 큽니다. ` +
      `참여가 적은 부서에 별도 안내를 권합니다.`));
  }

  return `<div class="card aisum">
    <div class="card-h">${ico('auto_awesome','')} 종합 의견
      <span class="card-sub">자동 요약 · 참고용</span></div>
    <ul class="aiop-list">${out.join('')}</ul>
    <p class="sub" style="margin:10px 0 0">
      이 글은 위 숫자를 규칙에 따라 정리한 것입니다. 최종 판단은 담당자가 해 주세요.</p>
  </div>`;
}

/* 몸 상태 요약 — 서버/데모가 집계한 사전 상담 요약(S.admin.intakeSummary)만 씁니다.
   기업 관리자 화면은 개인 응답 원본을 받지 않으므로(companyRows 가 dept·age 만 남김) 여기서도 집계값만 다룹니다. */
function bodyStateSummary(sum){
  const q = (sum?.questions || []).find(x => x.id === 'injury');
  if(!q || !q.n) return { n:0, withPain:0, top:[], avgVas:null, high:0 };
  const none = typeof sum.injury_none === 'number' ? sum.injury_none
             : ((q.options || []).find(o => o.label === '없음')?.n || 0);
  const top = (q.options || []).filter(o => o.label !== '없음').slice(0, 5).map(o => ({label:o.label, n:o.n}));
  const vas = sum.vas || {};
  const pain = (sum.questions || []).find(x => x.id === 'pain');       // 예전 문진의 1~10 척도 (있을 때만)
  const avgVas = typeof vas.avg === 'number' ? vas.avg : (pain?.avg ? pain.avg / 2 : null);
  const n = typeof sum.injury_n === 'number' && sum.injury_n ? sum.injury_n : q.n;
  return { n, withPain:Math.max(0, n - none), top, avgVas, high: vas.high || 0 };
}

function parseAccountLines(text){
  return String(text||'').split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const c = l.split(/\s*[,\t]\s*|\s{2,}/).map(x => x.trim());
    if(c.length === 1){ const m = l.match(/^(\S+)\s+(\S.*)$/); if(m) return {id:m[1], name:m[2]}; return {id:l, name:''}; }
    return {id:c[0], name:c[1]||'', pw:c[2]||'', dept:c[3]||'', empno:c[4]||''};
  });
}
/* v194: 사번 모드 — 한 줄에 '사번, 이름, 부서(선택)' 만 적으면 아이디·임시 비밀번호를 사번으로 자동 설정합니다.
   엑셀에서 사번·이름·부서 열을 그대로 복사해 붙여 넣어도 됩니다 (탭 구분도 인식). */
function parseEmpnoLines(text){
  const out = [], seen = new Set(); const skipped = [];
  let col = {empno:0, name:1, dept:2};                                 // 제목 줄이 없을 때의 기본 열 순서
  const lines = String(text||'').split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  lines.forEach((l, li) => {
    const c = l.split(/\s*[,\t]\s*|\s{2,}/).map(x => x.trim());
    /* v214: 엑셀 제목 줄(번호 · 사번 · 성명 · 성별 · 부서 …)이 있으면 열 위치를 그 이름으로 잡습니다 — 번호·성별 열은 무시 */
    if(li === 0 && c.some(x => /^(사번|empno)$/i.test(x))){
      const f = re => c.findIndex(x => re.test(x));
      col = { empno:f(/^(사번|empno)$/i), name:f(/^(성명|이름|name)$/i), dept:f(/^(부서|소속|dept)$/i) };
      return;
    }
    const empno = String(c[col.empno] ?? '').replace(/\s+/g, '');
    if(!empno) return;
    if(!/^[A-Za-z0-9._-]{6,}$/.test(empno)){ skipped.push(`${empno} (${c[col.name] || ''})`); return; }   // '-' · 6자 미만 등
    if(seen.has(empno.toLowerCase())) return; seen.add(empno.toLowerCase());
    out.push({id:empno, name:(col.name >= 0 ? c[col.name] : '') || '', pw:empno, dept:(col.dept >= 0 ? c[col.dept] : '') || '', empno});
  });
  out.skipped = skipped;
  return out;
}

    programHosts(programById(r.program)).some(t => t.name === me));
}

function trDashPane(which){
  const me = myTrainerName();
  const rows = trScopeRows();
  const live = rows.filter(r => r.status !== 'canceled');
  const todayStr = iso(new Date());
  const today = live.filter(r => r.slot_date === todayStr);
  const from = new Date(); from.setDate(from.getDate() - from.getDay());
  const to = new Date(from); to.setDate(to.getDate() + 6);
  const week = live.filter(r => r.slot_date >= iso(from) && r.slot_date <= iso(to));
  const upcoming = live.filter(r => r.slot_date >= todayStr)
    .sort((a,b) => (a.slot_date+a.slot_time).localeCompare(b.slot_date+b.slot_time));
  const scores = rows.filter(r => r.survey && typeof r.survey.overall === 'number')
                     .map(r => r.survey.overall);
  const p = trainerProfile(me);
  const yrs = careerYears(me);

  if(which === 'week'){
    const byDay = {};
    week.forEach(r => { byDay[r.slot_date] = (byDay[r.slot_date] || 0) + 1; });
    const days = [];
    for(let i = 0; i < 7; i++){ const d = new Date(from); d.setDate(d.getDate()+i); days.push(d); }
    const max = Math.max(1, ...Object.values(byDay));
    return `<div class="kpis">
        <div class="kpi"><div class="kpi-l">이번 주 세션</div><div class="kpi-v">${week.length}건</div></div>
        <div class="kpi"><div class="kpi-l">담당 회원</div>
          <div class="kpi-v">${peopleFrom(week).length}명</div></div>
        <div class="kpi"><div class="kpi-l">가장 바쁜 날</div>
          <div class="kpi-v" style="font-size:16px">${
            Object.keys(byDay).length ? fmtDateShort(Object.entries(byDay).sort((a,b)=>b[1]-a[1])[0][0]) : '–'}</div></div>
      </div>
      <div class="card" style="margin-top:14px">
        <div class="card-h">요일별 세션</div>
        ${days.map(d => {
          const ds = iso(d), n = byDay[ds] || 0;
          return `<div class="bar-row">
            <div class="bar-label">${d.getMonth()+1}/${d.getDate()} ${['일','월','화','수','목','금','토'][d.getDay()]}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${n/max*100}%"></div></div>
            <div class="bar-val">${n}</div></div>`;
        }).join('')}
      </div>`;
  }

  return `
    <div class="eh-hero">
      <div class="eh-hi">${p.spec.join(' · ')}</div>
      <div class="eh-t">${esc(me)} 운동처방사${yrs ? ` · ${yrs}년차` : ''}</div>
      <div class="eh-next">
        <div class="eh-next-l">
          <div class="eh-when">오늘 ${today.length}건</div>
          <div class="eh-prog">${today.length
            ? esc(programById(today[0].program).name)
            : '오늘 예정된 세션이 없습니다'}</div>
          <div class="eh-where">${today.length
            ? `${fmtTime(String(today[0].slot_time).slice(0,5))} · ${esc(placeOf(programById(today[0].program), today[0]))}`
            : `다음 세션 ${upcoming[0] ? fmtDateShort(upcoming[0].slot_date) : '없음'}`}</div>
        </div>
        <button class="eh-cta" onclick="navGo('tr','tsched.list')">일정 보기</button>
      </div>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="kpi-l">오늘</div><div class="kpi-v">${today.length}건</div></div>
      <div class="kpi"><div class="kpi-l">이번 주</div><div class="kpi-v">${week.length}건</div></div>
      <div class="kpi"><div class="kpi-l">누적 세션</div><div class="kpi-v">${live.length}건</div></div>
      <div class="kpi"><div class="kpi-l">담당 회원</div><div class="kpi-v">${peopleFrom(live).length}명</div></div>
      <div class="kpi"><div class="kpi-l">평균 만족도</div>
        <div class="kpi-v">${scores.length ? '★'+(scores.reduce((a,b)=>a+b,0)/scores.length).toFixed(1) : '–'}</div></div>
    </div>
    <div class="card" style="margin-top:14px">
      <div class="card-h">다가오는 세션</div>
      ${upcoming.length ? upcoming.slice(0,6).map(r => {
        const pr = programById(r.program);
        return `<div class="rowcard">
          <div class="rowcard-av">${esc((r.name||'?').slice(0,1))}</div>
          <div class="rowcard-main">
            <div class="rowcard-t">${esc(pr.name)}</div>
            <div class="rowcard-s">${esc(r.name)} · ${esc(r.dept || r.intake?.dept || '')}</div>
          </div>
          <div class="rowcard-n">${fmtDateShort(r.slot_date)}<small>${fmtTime(String(r.slot_time).slice(0,5))}</small></div>
        </div>`;
      }).join('') : `<div class="empty">예정된 세션이 없습니다.</div>`}
    </div>`;
}

function trSchedulePane(which){
  const rows = trScopeRows().filter(r => r.status !== 'canceled');
  const todayStr = iso(new Date());
  const today = rows.filter(r => r.slot_date === todayStr)
    .sort((a,b) => String(a.slot_time).localeCompare(String(b.slot_time)));

  if(which === 'care'){
    // 사전 상담에서 주의가 필요한 응답을 남긴 회원
    const care = rows.filter(r => r.slot_date >= todayStr && r.intake && riskTags(r.intake).length)
      .sort((a,b) => (a.slot_date+a.slot_time).localeCompare(b.slot_date+b.slot_time));
    if(!care.length) return phBox('check','확인이 필요한 회원이 없습니다.',
      '앞으로 예정된 세션 중 부상·통증이나 높은 스트레스를 표시한 회원이 있으면 이곳에 나타납니다.');
    return `<p class="sub">세션 전에 먼저 확인하면 좋을 회원입니다. 강도를 조절하거나 동작을 바꿔야 할 수 있습니다.</p>
      <div style="margin-top:12px">
      ${care.map(r => `<div class="rowcard" style="border-color:#FFCFC9;background:#FFFAFA">
        <div class="rowcard-av" style="background:#FFDAD6;color:#93000A">${esc((r.name||'?').slice(0,1))}</div>
        <div class="rowcard-main">
          <div class="rowcard-t">${esc(r.name)} <span style="font-weight:500;color:var(--muted);font-size:12px">${esc(r.dept || r.intake?.dept || '')}</span></div>
          <div class="rowcard-s">${esc(programById(r.program).name)} · ${fmtDate(r.slot_date)} ${fmtTime(String(r.slot_time).slice(0,5))}</div>
          <div class="mtags" style="margin-top:5px">${riskTags(r.intake).map(t=>`<span class="mtag" style="background:#FFDAD6;color:#93000A">${esc(t)}</span>`).join('')}</div>
        </div>
      </div>`).join('')}</div>`;
  }

  if(!today.length) return phBox('today','오늘 예정된 세션이 없습니다.',
    '캘린더에서 다른 날짜의 일정을 확인할 수 있습니다.');
  return `<p class="sub">${fmtDate(todayStr)} · 총 ${today.length}건</p>
    <div style="margin-top:12px">
    ${today.map(r => {
      const pr = programById(r.program);
      const risk = r.intake ? riskTags(r.intake) : [];
      return `<div class="rowcard">
        <div class="rowcard-av">${fmtTime(String(r.slot_time).slice(0,5)).slice(0,2)}</div>
        <div class="rowcard-main">
          <div class="rowcard-t">${fmtTime(String(r.slot_time).slice(0,5))} · ${esc(pr.name)}</div>
          <div class="rowcard-s">${esc(r.name)} · ${esc(r.dept || r.intake?.dept || '')} · ${esc(placeOf(pr, r))}</div>
          ${risk.length ? `<div class="mtags" style="margin-top:5px">${risk.map(t=>`<span class="mtag" style="background:#FFDAD6;color:#93000A">${esc(t)}</span>`).join('')}</div>` : ''}
        </div>
        <div class="rowcard-n">${pr.durationMin}분<small>소요 시간</small></div>
      </div>`;
    }).join('')}</div>`;
}

function trMemberPane(which){
  const rows = trScopeRows();
  const people = peopleFrom(rows);
  if(!people.length) return phBox('groups','담당 회원이 아직 없습니다.',
    '내 프로그램에 신청이 들어오면 이곳에 회원 목록이 만들어집니다.');

  if(which === 'dept'){
    const map = new Map();
    people.forEach(p => {
      if(!map.has(p.dept)) map.set(p.dept, {dept:p.dept, n:0, book:0});
      const d = map.get(p.dept); d.n++; d.book += p.active;
    });
    const list = [...map.values()].sort((a,b) => b.n - a.n);
    const max = Math.max(1, ...list.map(d => d.book));
    return `<div class="card">
      <div class="card-h">부서별 담당 회원</div>
      ${list.map(d => `<div class="bar-row">
        <div class="bar-label">${esc(d.dept)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${d.book/max*100}%"></div></div>
        <div class="bar-val">${d.n}명</div></div>`).join('')}
    </div>`;
  }

  return `<p class="sub">내 프로그램을 이용한 회원입니다. 건강 상담 내용은 세션 준비에 필요한 범위에서만 표시됩니다.</p>
    <div style="margin-top:12px">
    ${people.map(p => `<div class="rowcard">
      <div class="rowcard-av">${esc(p.name.slice(0,1))}</div>
      <div class="rowcard-main">
        <div class="rowcard-t">${esc(p.name)}</div>
        <div class="rowcard-s">${esc(p.dept)}${p.last?` · 최근 ${fmtDateShort(p.last)}`:''}</div>
      </div>
      <div class="rowcard-n">${p.active}회<small>이용 ${p.done}회${p.sat?` · ★${p.sat.toFixed(1)}`:''}</small></div>
    </div>`).join('')}</div>`;
}

  const me = myTrainerName();
  const mine = PROGRAMS.filter(p => p.host === me);

  if(which === 'guide'){

      <div class="card-h">${esc(p.name)} <span class="card-sub">${p.durationMin}분 · ${esc(p.location)}</span></div>
      <p class="sub">${esc(p.blurb || '')}</p>
      <div class="mtags" style="margin-top:8px">${(p.tags||[]).map(t=>`<span class="mtag">${esc(t)}</span>`).join('')}</div>
      <table class="atable" style="margin-top:12px"><tbody>
        <tr><td>운영 요일</td><td>${p.workDays.map(d=>['일','월','화','수','목','금','토'][d]).join(' · ')}</td></tr>

    <div class="rowcard-av">${ico(ICON[p.icon]||p.icon||'exercise')}</div>

      <div class="rowcard-s">${p.durationMin}분 · ${esc(p.location)}</div>
    </div>
    <div class="rowcard-n">${cnt(p.id)}건<small>누적 신청</small></div>
  </div>`).join('');

function trResultPane(which){
  const rows = trScopeRows();
  const withSurvey = rows.filter(r => r.survey && typeof r.survey.overall === 'number')
    .sort((a,b) => (b.slot_date||'').localeCompare(a.slot_date||''));
  if(!withSurvey.length) return phBox('monitoring','아직 받은 피드백이 없습니다.',
    '회원이 세션 후 만족도를 남기면 이곳에 모입니다.');

  if(which === 'trend'){
    const byMonth = new Map();
    withSurvey.forEach(r => {
      const m = (r.slot_date||'').slice(0,7);
      if(!byMonth.has(m)) byMonth.set(m, []);
      byMonth.get(m).push(r.survey.overall);
    });
    const list = [...byMonth.entries()].sort();
    return `<div class="card">
      <div class="card-h">월별 평균 만족도 <span class="card-sub">5점 만점</span></div>
      ${list.map(([m, v]) => {
        const avg = v.reduce((a,b)=>a+b,0)/v.length;
        return `<div class="bar-row">
          <div class="bar-label">${esc(m)}</div>
          <div class="bar-track"><div class="bar-fill goal" style="width:${avg/5*100}%"></div></div>
          <div class="bar-val">${avg.toFixed(2)}</div></div>`;
      }).join('')}
    </div>`;
  }

  return `<p class="sub">회원이 세션 후 남긴 평가입니다. 최근 순으로 정렬됩니다.</p>
    <div style="margin-top:12px">
    ${withSurvey.slice(0,40).map(r => `<div class="rowcard">
      <div class="rowcard-av">${esc((r.name||'?').slice(0,1))}</div>
      <div class="rowcard-main">
        <div class="rowcard-t">${esc(programById(r.program).name)}</div>
        <div class="rowcard-s">${esc(r.name)} · ${fmtDate(r.slot_date)}</div>
        ${r.survey.comment ? `<div class="rowcard-s">“${esc(r.survey.comment)}”</div>` : ''}
      </div>
      <div class="rowcard-n">★${r.survey.overall}<small>${r.survey.nps!=null?`추천 ${r.survey.nps}`:''}</small></div>
    </div>`).join('')}</div>`;
}

function trainerRolePane(){
  const sec = S.nav.tr;
  const me = myTrainerName();
  const rows = trScopeRows();
  let body = '', title = '', sub = '';

  if(sec === 'tdash.today'){        title='오늘 요약';      sub='내 일정과 담당 현황';       body = trDashPane('today'); }
  else if(sec === 'tdash.week'){    title='이번 주 현황';    sub='요일별 세션 분포';          body = trDashPane('week'); }
  else if(sec === 'tsched.list'){   title='세션 목록';      sub='오늘 진행할 세션';          body = trSchedulePane('list'); }
  else if(sec === 'tsched.care'){   title='확인 필요 회원';  sub='세션 전 미리 볼 사항';       body = trSchedulePane('care'); }
  else if(sec === 'tcal.week'){     title='주간 일정';      sub='내 세션 캘린더';            S.nav.trView='week';  body = trainerSection(rows, 'cal'); }
  else if(sec === 'tcal.month'){    title='월간 일정';      sub='내 세션 캘린더';            S.nav.trView='month'; body = trainerSection(rows, 'cal'); }
  else if(sec === 'tmember.all'){   title='담당 회원';      sub='내 프로그램 이용 회원';      body = trMemberPane('all'); }
  else if(sec === 'tmember.dept'){  title='부서별';        sub='부서 단위 담당 현황';        body = trMemberPane('dept'); }
  else if(sec === 'tprog.mine'){    title='담당 프로그램';   sub='내가 진행하는 프로그램';     body = trProgramPane('mine'); }
  else if(sec === 'tprog.guide'){   title='프로그램 안내';   sub='운영 요일 · 시간 · 구성';    body = trProgramPane('guide'); }
  else if(sec === 'tresult.feedback'){ title='세션 피드백'; sub='회원이 남긴 평가';          body = trResultPane('feedback'); }
  else if(sec === 'tresult.trend'){ title='만족도 추이';    sub='월별 평균 변화';            body = trResultPane('trend'); }
  else { title='오늘 요약'; body = trDashPane('today'); }

  const yrs = careerYears(me);
  return adminShell('tr', '운동처방사', `${me}${yrs?` · ${yrs}년차`:''}`,
                    NAV.trainer, sec, title, sub, body);
}

/* ============================================================
   임직원 앱 화면
   ============================================================ */
function myRows(){ return (MG.list || []).map(b => ({...b})); }

/* 홈 배치
   HOME_STEPS_FIRST : true 면 '이렇게 진행됩니다' 3단계를 히어로 바로 아래에 두고 카드를 작게 그려 첫 화면에 다 보이게 합니다.
   HOME_QUICK       : false 면 가운데 바로가기 카드(프로그램 예약·체형 분석·MY)를 그리지 않습니다. */
const HOME_STEPS_FIRST = true;
const HOME_QUICK       = true;

function empTodayPane(){
  const rows = myRows();
  const todayStr = iso(new Date());
  const active = rows.filter(b => b.status !== 'canceled');
  const upcoming = active.filter(b => !sessionEnded(b) && b.slot_date >= todayStr)
    .sort((a,b) => (a.slot_date + a.slot_time).localeCompare(b.slot_date + b.slot_time));
  const next = upcoming[0];
  const todays = upcoming.filter(b => b.slot_date === todayStr);
  const year = new Date().getFullYear();
  const usedThisYear = active.filter(b => new Date(b.slot_date).getFullYear() === year).length;
  const left = Math.max(0, CONFIG.quota - usedThisYear);
  const doneCnt = rows.filter(b => sessionEnded(b)).length;
  scheduleSessionEndRefresh(active);

  const hero = `<div class="eh-hero">
    <div class="eh-hi">${todays.length ? '오늘 예정된 운동이 있어요' : next ? '예정된 운동이 있어요' : '예정된 운동이 없어요'}</div>
    <div class="eh-t">${esc(S.auth.user?.name || '')}님, 안녕하세요</div>
    ${next ? `<div class="eh-next">
      <div class="eh-next-l">
        <div class="eh-when">${next.slot_date === todayStr ? '오늘' : fmtDateShort(next.slot_date)} ${fmtTime(String(next.slot_time).slice(0,5))}</div>
        <div class="eh-prog">${esc(programById(next.program).name)}</div>
        <div class="eh-where">${esc(placeOf(programById(next.program), next))} · ${esc(hostLabel(programById(next.program), next))}</div>
      </div>
      <button class="eh-cta" onclick="navGo('emp','my.bookings')">예약 보기</button>
    </div>` : `<div class="eh-next">
      <div class="eh-next-l"><div class="eh-prog">아직 예약이 없습니다</div>
        <div class="eh-where">올해 이용 가능 ${CONFIG.quota}회 · ${left}회 남았어요.</div></div>
      <button class="eh-cta" onclick="navGo('emp','book')">예약하기</button>
    </div>`}
  </div>`;

  // 1회 서비스라 회차 재확인 안내는 두지 않습니다.
  // 상태를 다시 알리고 싶으면 MY > 내 정보 수정 에서 언제든 할 수 있습니다.
  const recheckBanner = '';

  // 왼쪽 메뉴와 짝이 맞도록 세 갈래만 둡니다.
  const quick = `<div class="eh-quick">
    <button class="eh-q" onclick="navGo('emp','book')">
      ${ico('event','eh-q-ico')}<div class="eh-q-t">프로그램 예약</div>
      <div class="eh-q-s">남은 지원 ${left}회 · 예정 ${upcoming.length}건</div></button>
    <button class="eh-q" onclick="navGo('emp','result.change')">
      ${ico('monitoring','eh-q-ico')}<div class="eh-q-t">체형 분석 및 운동 추천</div>
      <div class="eh-q-s">AI 분석 · 운동 추천</div></button>
    <button class="eh-q" onclick="navGo('emp','my.profile')">
      ${ico('person','eh-q-ico')}<div class="eh-q-t">MY</div>
      <div class="eh-q-s">나의 변화 · 완료 ${doneCnt}회</div></button>
  </div>`;

  // 예약 목록은 '나의 예약' 화면에서 봅니다. Home 에서는 겹쳐 보여 주지 않습니다.
  const q = HOME_QUICK ? quick : '';
  const steps = homeExtraHTML(next);
  if(!next) setTimeout(() => guideMaybeOpen(), 250);   // 예약 전 가이드 (처음 한 번)
  return `<section class="pane${HOME_STEPS_FIRST ? ' home-steps-first' : ''}">${hero}${recheckBanner}${
    HOME_STEPS_FIRST ? steps + q : q + steps}</section>`;
}

/* ============================================================
   Home 아래 — 이용 흐름과 준비 안내
   ------------------------------------------------------------
   빈 공간을 그림으로만 채우지 않고, 지금 무엇을 하면 되는지 알려 줍니다.
   예약 전에는 진행 흐름을, 예약이 잡힌 뒤에는 준비 안내를 앞세웁니다.
   그림은 바깥에서 받아오지 않고 SVG 로 그려 넣어 바로 뜹니다.
   ============================================================ */
/* 이용 안내 카드에 쓰는 사진 (운영 자료). 바꾸려면 이 값만 교체하면 됩니다. */
const STEP_IMG = {
  book:  'assets/step_book.d5fed35c.jpg',
  check: 'assets/step_check.140fe749.jpg',
  pt:    'assets/step_pt.982a8344.jpg',
};

function stepArt(kind){
  const src = STEP_IMG[kind];
  const alt = kind === 'book'  ? '노트북으로 프로그램 날짜와 시간을 고르는 모습'
            : kind === 'check' ? '운동처방사가 태블릿으로 체형 분석 결과를 설명하는 모습'
            :                    '운동처방사가 1:1 로 스트레칭을 지도하는 모습';
  if(!src) return '';
  return `<img class="hs-art" src="${src}" alt="${alt}" loading="lazy">`;
}

/* ------------------------------------------------------------
   예약 전 가이드 — 홈에 처음 들어왔을 때 작은 창으로 한 번 보여 줍니다.
   '다시 보지 않기'를 누르면 이 계정(브라우저)에서는 더 뜨지 않고,
   홈의 '이용 가이드' 링크로 언제든 다시 열 수 있습니다.
   ------------------------------------------------------------ */
function guideKey(){ return 'guideSeen:' + (S.auth.user?.email || 'anon'); }
window.guideMaybeOpen = () => {
  if(document.getElementById('guidebox')) return;
  if(KSTORE.getItem(guideKey()) === '1') return;
  if(!(S.nav.emp === 'home' || S.nav.emp === 'home.today')) return;
  openGuide();
};
window.openGuide = () => {
  document.getElementById('guidebox')?.remove();
  const steps = [
    ['event',       '프로그램 신청',   '원하는 날짜와 시간을 고르면 담당 운동처방사가 자동으로 배정됩니다.'],
    ['fact_check',  '바디 체크',  '작성하신 불편한 부위와 통증 강도, 체형 분석기(모티피지오) 측정 결과로 담당 운동처방사가 몸 상태를 미리 살핍니다.'],
    ['self_improvement', '1:1 세션 진행', '몸 상태에 맞춘 스트레칭과 운동을 1:1로 진행합니다.'],
  ];
  const box = document.createElement('div');
  box.id = 'guidebox';
  box.innerHTML = `<div class="gd-dim" onclick="closeGuide()"></div>
    <div class="gd" role="dialog" aria-modal="true" aria-labelledby="gdTitle">
      <button type="button" class="gd-x" onclick="closeGuide()" aria-label="닫기">${ico('close','')}</button>
      <div class="gd-kicker">예약 전 안내</div>
      <h2 id="gdTitle" class="gd-h">${esc(S.auth.user?.name || '')}님, 이렇게 진행됩니다</h2>
      <p class="gd-s">신청부터 세션까지 세 단계면 끝납니다. 아래 내용만 챙기시면 준비 끝입니다.</p>
      <ol class="gd-steps">${steps.map(([i, t, d], n) => `
        <li><span class="gd-n">${n+1}</span>
          <div><b>${esc(t)}</b><span>${esc(d)}</span></div></li>`).join('')}
      </ol>
      <div class="gd-tips">
        <div>${ico('checkroom','')}<b>편한 복장</b><span>운동복이 가장 좋지만, 몸을 굽히기 편한 옷이면 됩니다.</span></div>
        <div>${ico('schedule','')}<b>시작 10분 전 도착</b><span>${esc(PROGRAMS[0].location)}에서 진행합니다. 회사 건물 안이라 외부 이동은 없습니다.</span></div>
        <div>${ico('event_available','')}<b>변경·취소</b><span>프로그램 시작 ${cutoffLabel()}까지 '나의 예약'에서 직접 할 수 있습니다.</span></div>
      </div>
      <div class="gd-btns">
        <button type="button" class="lgbtn solid" onclick="closeGuide();navGo('emp','book')">예약하러 가기</button>
        <button type="button" class="lgbtn ghost" onclick="closeGuide()">나중에 할게요</button>
      </div>
      <label class="gd-keep"><input type="checkbox" id="gdNo"> 다시 보지 않기</label>
    </div>`;
  document.body.appendChild(box);
  document.body.classList.add('gd-open');
  box._esc = e => { if(e.key === 'Escape') closeGuide(); };
  document.addEventListener('keydown', box._esc);
  setTimeout(() => box.querySelector('.gd-x')?.focus(), 30);
};
window.closeGuide = () => {
  const box = document.getElementById('guidebox');
  if(!box) return;
  if(box.querySelector('#gdNo')?.checked) KSTORE.setItem(guideKey(), '1');
  document.removeEventListener('keydown', box._esc);
  document.body.classList.remove('gd-open');
  box.remove();
};

function homeExtraHTML(next){
  const steps = [
    ['book',  '1. 프로그램 신청',   '원하는 날짜와 시간을 고르면 담당 운동처방사가 자동으로 배정됩니다.'],
    ['check', '2. 바디 체크',  '작성하신 불편한 부위와 통증 강도, 체형 분석기(모티피지오) 측정 결과로 담당 운동처방사가 몸 상태를 미리 살핍니다.'],
    ['pt',    '3. 1:1 세션 진행',   '몸 상태에 맞춘 스트레칭과 운동을 1:1 로 진행합니다.'],
  ];

  return `<section class="hs">
    <div class="hs-h">
      <h2 class="hs-t">이렇게 진행됩니다
        <button type="button" class="hs-guide" onclick="openGuide()">${ico('help','')} 이용 가이드</button></h2>
      <p class="hs-s">신청부터 세션까지 세 단계면 끝납니다.</p>
    </div>
    <div class="hs-grid">${steps.map(([k, t, d]) => `
      <article class="hs-card">
        ${stepArt(k)}

function empAIPane(){
  return `<section class="pane">${aiBodyHTML()}</section>`;
}

/* 오늘 기준으로 아직 살아 있는 예약 */
function activeMine(){
  const t = iso(new Date());
  return (MG.list || []).filter(b => b.status !== 'canceled' && b.slot_date >= t)
    .sort((a,b) => (a.slot_date + a.slot_time).localeCompare(b.slot_date + b.slot_time));
}

/* 이미 마친(또는 날짜가 지난) 프로그램 */
function doneMine(){
  const t = iso(new Date());
  return (MG.list || []).filter(b =>
      b.status === 'done' || (b.status !== 'canceled' && b.slot_date < t))
    .sort((a,b) => (b.slot_date + b.slot_time).localeCompare(a.slot_date + a.slot_time));
}

/* 같은 프로그램을 같은 날짜에 또 잡으려는 경우만 막습니다.
   다른 프로그램이나, 같은 프로그램의 다른 날짜는 그대로 신청할 수 있습니다. */
function dupBooking(program, date){
  return activeMine().find(b => b.program === program && b.slot_date === date);
}
function dupDates(program){
  return activeMine().filter(b => b.program === program).map(b => b.slot_date);
}

/* 신청 화면 위에 붙는 '이미 예약 중' 안내 */
function bookingNotice(){
  const list = activeMine();
  if(!list.length) return '';
  const rows = list.slice(0, 3).map(b => {
    const p = programById(b.program);
    return `<li>${esc(p.name)} · ${fmtDate(b.slot_date)} ${fmtTime(String(b.slot_time).slice(0,5))}</li>`;
  }).join('');
  return `<div class="booknote">
    <div class="booknote-h">${ico('event_available','booknote-i')}
      <b>이미 예약 중인 프로그램입니다</b></div>
    <ul class="booknote-l">${rows}${list.length > 3 ? `<li>외 ${list.length-3}건</li>` : ''}</ul>
    <p class="booknote-s">신청은 1인 1회입니다. 날짜·시간을 바꾸시려면
      <b>나의 예약</b>에서 변경해 주세요.</p>
    <button class="mini" onclick="navGo('emp','my.bookings')">나의 예약 보기</button>
  </div>`;
}

/* 이름 옆에 작게 붙는 소속·성별·연령대 */
/* 이름 옆에 작게 붙는 소속·성별·나이.
   주민등록번호로 가입한 경우 생년이 있으므로 만 나이를 보여 주고,
   직접 선택한 경우에는 연령대를 그대로 씁니다. */
function myAgeText(){
  const b = BASE.saved || {};
  if(b.birth_year){
    const now = new Date();
    let age = now.getFullYear() - b.birth_year;
    return age > 0 && age < 120 ? age + '세' : (b.age || '');
  }
  return b.age || '';
}
function myMetaLine(){
  const b = BASE.saved || {};
  const sex = b.sex === '남성' ? '남' : b.sex === '여성' ? '여' : (b.sex || '');
  return [b.dept, sex, myAgeText()].filter(Boolean).join(' · ');
}

/* ---------- 운동 내역 ---------- */
/* 그 예약에 연결된 측정 기록 (없으면 null) */
function measureFor(b){
  return measureRecords().find(r => r.program === b.program &&
    String(r.at || '').slice(0,10) <= b.slot_date) || null;
}

/* 나의 예약 안에 들어가는 '완료한 프로그램' 묶음.
   예전 '운동 내역' 화면이 하던 일을 여기서 합니다. */

/* ============================================================
   회차별 측정 기록 (나의 변화)
   ------------------------------------------------------------
   한 건의 모양 — 서버 테이블로 옮길 때도 같은 열을 씁니다.
     { user_email, program, round, at, metrics:{ pain, parts, life, worse } }
   지금은 사전 상담 기록(BASE.history) 안에 함께 담아 두고,
   나중에 measurements 테이블이 생기면 이 함수만 바꿔 끼우면 됩니다.
   ============================================================ */

/* 통증 지장 정도를 숫자로 (그래프에 쓰려고) */
const LIFE_SCALE = {'거의 없음':0, '가끔 불편함':1, '자주 불편함':2, '일·운동을 못 할 정도':3};

function metricsOf(ans){
  const v = ans && ans.injury;
  const parts = (Array.isArray(v) ? v : (v ? [v] : []))
    .filter(x => x && x !== '없음');
  return {
    pain:  typeof ans.pain === 'number' ? ans.pain : null,
    parts: parts,
    partN: parts.length,
    life:  LIFE_SCALE[ans.pain_life] !== undefined ? LIFE_SCALE[ans.pain_life] : null,
    worse: ans.pain_move || null,
  };
}

/* 시간순 측정 기록. 가입 사전 상담이 기준(1회차)입니다. */
function measureRecords(){
  const email = (S.auth.user || {}).email || '';
  const out = [];
  if(BASE.saved && Object.keys(BASE.saved).length){
    out.push({user_email: email, program: null, round: 1, at: BASE.savedAt,
              label: '1회차', sub: '기준 · 가입 상담',
              ans: BASE.saved, metrics: metricsOf(BASE.saved)});
  }
  (BASE.history || []).forEach((h, i) => {
    const ans = {...(BASE.saved || {}), ...h.ans};
    out.push({user_email: email, program: h.program || null, round: i + 2,
              at: h.at, label: (i + 2) + '회차',
              sub: h.program ? (programById(h.program).name) : '통증 상담',
              ans, metrics: metricsOf(ans)});
  });
  return out;
}

/* 최초 대비 · 직전 대비 변화 */
function changeStats(recs, key){
  const vals = recs.map(r => r.metrics[key]).filter(v => typeof v === 'number');
  if(vals.length < 1) return null;
  const first = vals[0], last = vals[vals.length - 1];
  const prev = vals.length > 1 ? vals[vals.length - 2] : null;
  const rate = first === 0 ? null : Math.round((last - first) / first * 100);
  return {
    first, last, prev,
    diff: last - first,
    step: prev === null ? null : last - prev,
    rate,
    trend: last < first ? 'down' : last > first ? 'up' : 'flat',
    n: vals.length,
  };
}

function trendCard(title, unit, st, goodIsDown){
  if(!st) return '';
  const good = goodIsDown ? st.diff < 0 : st.diff > 0;
  const cls = st.diff === 0 ? '' : (good ? 'good' : 'warn');
  const icon = st.trend === 'down' ? 'trending_down' : st.trend === 'up' ? 'trending_up' : 'trending_flat';
  return `<div class="chg-card ${cls}">
    <div class="chg-t">${esc(title)}</div>
    <div class="chg-v">${st.last}<small>${esc(unit)}</small></div>
    <div class="chg-d">${ico(icon,'')}
      최초 ${st.first} → 현재 ${st.last}
      ${st.diff === 0 ? '· 변화 없음'
        : `· ${st.diff > 0 ? '+' : ''}${st.diff}${st.rate !== null ? ` (${st.rate > 0 ? '+' : ''}${st.rate}%)` : ''}`}
    </div>
    ${st.step === null ? '' : `<div class="chg-s">직전 회차 대비 ${
      st.step === 0 ? '변화 없음' : (st.step > 0 ? '+' : '') + st.step}</div>`}
  </div>`;
}

/* ---------- 나의 변화 — 회차별 몸 상태 ----------
   가입할 때 받은 사전 상담을 1회차로 두고,
   그 뒤 회차마다 다시 확인한 기록을 이어 붙여 그래프로 그립니다. */
function progressPoints(){

    pts.push({at: h.at, label: (i + 1) + '회차', ans: {...(BASE.saved||{}), ...h.ans}});
  });
  return pts;
}

const partsOf = a => {
  const v = a && a.injury;
  return (Array.isArray(v) ? v : (v ? [v] : [])).filter(x => x && x !== '없음');
};

/* 꺾은선 그래프 — 값이 하나뿐이면 점만 찍습니다. */
function lineChart(points, opts){
  const W = 520, H = 200, PL = 34, PR = 14, PT = 26, PB = 30;   // PT 는 값 글자 자리
  const max = opts.max, min = opts.min || 0;
  const n = points.length;
  const x = i => n === 1 ? (PL + (W-PL-PR)/2) : PL + i * (W-PL-PR) / (n-1);
  const y = v => PT + (max - v) / (max - min) * (H-PT-PB);

  const grid = [min, (min+max)/2, max].map(v =>
    `<line class="pg-grid" x1="${PL}" y1="${y(v).toFixed(1)}" x2="${W-PR}" y2="${y(v).toFixed(1)}"/>
     <text class="pg-ax" x="${PL-6}" y="${(y(v)+3.5).toFixed(1)}" text-anchor="end">${v}</text>`).join('');

  const line = n > 1
    ? `<polyline class="pg-line" points="${points.map((p,i)=>
        `${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ')}"/>`
    : '';

  const dots = points.map((p, i) =>
    `<circle class="pg-dot" cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="4.5"/>
     <text class="pg-val" x="${x(i).toFixed(1)}" y="${(y(p.v)-10).toFixed(1)}" text-anchor="middle">${p.v}</text>
     <text class="pg-lb" x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(p.label)}</text>`).join('');

  return `<svg class="pg-svg" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="${esc(opts.title||'')} 변화 그래프">
    ${grid}${line}${dots}
  </svg>`;
}

  const roundTable = `

      <div class="card-h">불편한 부위 수 <span class="card-sub">회차별로 고른 부위 개수</span></div>

  if(!PROF.pw){ PROF.msg = '비밀번호를 입력해 주세요.'; return render(); }

  const u = S.auth.user || {}, b = BASE.saved || {};
  PROF.unlocked = true; PROF.pw = '';
  PROF.form = {name: u.name || '', dept: b.dept || '', sex: b.sex || '', age: b.age || ''};
  // 운동 습관 네 문항은 지금 저장된 답을 그대로 가져와 고칩니다.
  PROF.ans = {};

};

window.saveProfile = async () => {
  if(!String(PROF.form.name || '').trim()){
    PROF.msg = '이름을 입력해 주세요.'; return render();
  }
  PROF.busy = true; PROF.msg = ''; render();

    PROF.busy = false; PROF.msg = '';
    render();
    document.querySelector('.qerr, .err')?.scrollIntoView({block:'center', behavior:'smooth'});

  }
  const res = await DB.updateProfile({
    name: PROF.form.name.trim(),
    dept: PROF.form.dept, sex: PROF.form.sex, age: PROF.form.age,
    extra: PROF.ans,           // 운동 습관 네 문항

  PROF.busy = false;
  if(!res.ok){ PROF.msg = res.msg || '저장에 실패했습니다.'; return render(); }
  S.auth.user = {...S.auth.user, name: PROF.form.name.trim()};
  BASE.saved = {...(BASE.saved||{}), ...PROF.ans,
                dept:PROF.form.dept, sex:PROF.form.sex, age:PROF.form.age};
  PROF.open = false; PROF.unlocked = false;
  toast('내 정보를 수정했습니다.');
  render();
};

/* ============================================================
   통증 강도 반원 게이지 · 부위 보기 (한국투자공사 버전)
   ============================================================ */

/* 반원 위의 점 (화면 좌표는 y가 아래로 커집니다) */
function arcPt(cx, cy, r, deg){
  const a = deg * Math.PI / 180;
  return [cx + r * Math.cos(a), cy - r * Math.sin(a)];
}

/* 통증 강도 반원 게이지 — 1~5 다섯 칸을 각각 다른 색으로 그리고,
   고른 칸만 진하게 남깁니다. */
function vasGaugeSVG(level, title){
  const CX = 62, CY = 62, R = 44, W = 13;
  const seg = 180 / VAS_MAX;                     // 5칸이면 한 칸 36°
  const arcs = [];
  for(let i = VAS_MIN; i <= VAS_MAX; i++){
    const a0 = 180 - (i - VAS_MIN) * seg;
    const a1 = a0 - seg;
    const [x0, y0] = arcPt(CX, CY, R, a0);
    const [x1, y1] = arcPt(CX, CY, R, a1);
    const on = (level === i);
    arcs.push(`<path d="M${x0.toFixed(1)} ${y0.toFixed(1)} A${R} ${R} 0 0 1 ${x1.toFixed(1)} ${y1.toFixed(1)}"
      fill="none" stroke="${vasColor(i)}" stroke-width="${on ? W + 4 : W}"
      stroke-linecap="butt" opacity="${on ? 1 : 0.22}"/>`);
  }
  const has = typeof level === 'number';
  return `<svg class="gauge" viewBox="0 0 124 78" xmlns="http://www.w3.org/2000/svg"
       role="img" aria-label="${esc(title || '')} 통증 강도 ${has ? level : '없음'}단계">
    ${arcs.join('')}
    <text class="gauge-v" x="${CX}" y="${CY - 6}" text-anchor="middle"
          fill="${has ? vasColor(level) : '#B9BFAC'}">${has ? level : '–'}</text>
    <text class="gauge-w" x="${CX}" y="${CY + 11}" text-anchor="middle">${
      has ? esc(VAS_WORDS[level]) : '응답 없음'}</text>
    <text class="gauge-e" x="${CX - R}" y="${CY + 13}" text-anchor="middle">1</text>
    <text class="gauge-e" x="${CX + R}" y="${CY + 13}" text-anchor="middle">${VAS_MAX}</text>
  </svg>`;
}

/* 사전 상담의 '불편하거나 뭉치는 부위' 를 보여 주는 칸.
   왼쪽에 해부학 그림(누를 수 없음), 오른쪽에 부위별 반원 게이지. */

/* v180: 항목 순서는 결과지 순위 숫자(rank) 기준. AI 가 준 부위 태그가 있으면 그것을, 없으면 이름 키워드로 부위를 정합니다. */
function motiRankedItems(rec){

    .sort((a, b) => (Number(a.rank) || a._idx + 1) - (Number(b.rank) || b._idx + 1))
    .map((i, k) => Object.assign(i, {rank:k + 1}));
}
function motiPickVideos(rec){

/* 불균형 항목 이름 → 부위 태그 (키워드 규칙) */
function motiTagOf(part){
  const p = String(part || '');
  if(/무릎/.test(p)) return 'knee';
  if(/골반.*(돌|회전)/.test(p)) return 'pelvis_rot';
  if(/골반.*(후방|뒤)/.test(p)) return 'pelvis_back';
  if(/골반|고관절|엉덩/.test(p)) return 'pelvis';
  if(/등뼈|흉추|굽은 등/.test(p)) return 'thoracic';
  if(/머리|거북목/.test(p)) return 'head';
  if(/O ?다리|X ?다리|발목|안짱|팔자|다리/.test(p)) return 'leg';   // '발목'은 '목'보다 먼저 봅니다
  if(/쇄골/.test(p)) return 'clavicle';
  if(/어깨|라운드|날개뼈|견갑/.test(p)) return 'shoulder';
  if(/목|경추/.test(p)) return 'neck';          // v181: '목' 항목 → 쇄골 영상(쇄골·목 주변 근육 운동)
  if(/허리|요추|전만|복부|코어/.test(p)) return 'lumbar';
  if(/측만|척추|굽은 등|후만/.test(p)) return 'thoracic';
  if(/종아리|햄스트링|아킬레스|허벅지/.test(p)) return 'knee';
  if(/발|아치|평발|족/.test(p)) return 'leg';
  if(/상체 기울|체중|무게 중심|무게중심|좌우 균형/.test(p)) return 'pelvis';
  // 영문 표기 (AI 판독·외부 결과지)
  if(/knee/i.test(p)) return 'knee';
  if(/pelvi|hip/i.test(p)) return /rot/i.test(p) ? 'pelvis_rot' : 'pelvis';
  if(/thorac|spine|kyph|scoli/i.test(p)) return 'thoracic';
  if(/head|forward/i.test(p)) return 'head';
  if(/neck|cervic/i.test(p)) return 'neck';
  if(/shoulder|scapul/i.test(p)) return 'shoulder';
  if(/clavic/i.test(p)) return 'clavicle';
  if(/leg|ankle|foot|bow/i.test(p)) return 'leg';
  if(/lumbar|low back/i.test(p)) return 'lumbar';
  if(/굴곡/.test(p)) return 'knee';             // 부위 이름 없이 '굴곡변형'만 있을 때
  if(/후방 이동/.test(p)) return 'thoracic';    // 부위 이름 없이 '후방 이동'만 있을 때
  return 'core';
}

/* 규칙 판독 — items(순위·각도·긴장도) 와 등급으로 종합 소견 3줄 + 운동 3개(id) */
function motiAnalyze(rec){
  const tagged = motiRankedItems(rec);
  const items = tagged;
  const top = tagged.slice(0, 2);
  const hi = tagged.filter(i => Number(i.tension) >= 66);
  const posture = tagged.filter(i => ['thoracic','neck','shoulder'].includes(i.tag));
  const g = rec.grade || '–', pct = rec.pct ? `상위 ${rec.pct}%` : '';
  const fmt = i => `${i.part}${i.deg ? '(' + String(i.deg).replace(/^[^0-9]*/, '').replace(/[^0-9°.]+$/, '') + ')' : ''}`;
  const l1 = top.length
    ? `전체 등급 ${g}${pct ? '(' + pct + ')' : ''} — ${top.map(fmt).join('과 ')}이(가) 결과지 상위에 올라 있어 ${top[0].tag.startsWith('pelvis') || ['knee','leg'].includes(top[0].tag) ? '하체 정렬' : '상체 정렬'}을 가장 먼저 바로잡아야 할 부분입니다.`
    : `전체 등급 ${g}${pct ? '(' + pct + ')' : ''} — 두드러진 불균형 항목이 없습니다.`;
  const l2 = posture.length
    ? `${posture.slice(0, 2).map(fmt).join(', ')}이(가) 함께 보여 장시간 앉는 자세에서 흔한 거북목·굽은 등 패턴에 해당합니다.`
    : `상체(등·목·어깨) 항목은 경계 이하로, 하체 중심으로 관리하면 됩니다.`;
  const l3 = hi.length
    ? `${hi.slice(0, 2).map(i => i.part + '(' + i.tension + '%)').join('·')}의 근육 긴장도가 높아 해당 부위 스트레칭을 우선하고, 이후 정렬 운동을 더하는 순서를 권합니다.`
    : `근육 긴장도가 위험 구간(66% 이상)인 부위는 없어, 정렬 운동 위주로 주 3회 이상 꾸준히 하시면 됩니다.`;

  // 운동 선택: 순위·긴장도 가중치로 태그 점수 → 태그를 덮는 운동 3개 (중복 태그 제외)
  const score = {};
  tagged.forEach(i => { const w = (10 - Math.min(9, i.rank - 1)) + Number(i.tension || 0) / 20; score[i.tag] = (score[i.tag] || 0) + w; });
  const ranked = EXERCISE_LIB.map(e => ({ e, s: e.tags.reduce((a, t) => a + (score[t] || 0), 0) }))
    .sort((a, b) => b.s - a.s);
  const picked = []; const used = new Set();
  for(const {e, s: sc} of ranked){
    if(picked.length >= 3) break;
    if(sc <= 0 && picked.length) continue;
    if(e.tags.some(t => used.has(t)) && ranked.length > 3) continue;
    picked.push(e.id); e.tags.forEach(t => used.add(t));
  }
  while(picked.length < 3){ const e = EXERCISE_LIB.find(x => !picked.includes(x.id)); if(!e) break; picked.push(e.id); }
  const targets = {};
  picked.forEach(id => { const e = EXERCISE_LIB.find(x => x.id === id);
    targets[id] = tagged.filter(i => e.tags.includes(i.tag)).slice(0, 2).map(i => `${i.rank}순위 ${i.part}`).join(' · ') || '전신 정렬'; });
  const vids = motiPickVideos(rec);
  return { summary:[l1, l2, l3], exercises: picked, targets, videos: vids.videos, videoTargets: vids.videoTargets };
}

/* ---------- 결과지 파일 → 이미지(dataURL). PDF 는 pdf.js 로 1쪽을 그립니다 ---------- */
async function fileToSheetImage(file){
  const MAXW = 1600;
  const shrink = (imgOrCanvas, w, h) => {
    const k = Math.min(1, MAXW / w); const c = document.createElement('canvas');
    c.width = Math.round(w * k); c.height = Math.round(h * k);
    c.getContext('2d').drawImage(imgOrCanvas, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', 0.85);
  };
  if(/pdf$/i.test(file.name) || file.type === 'application/pdf'){
    const lib = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await lib.getDocument({data: buf}).promise;
    const page = await pdf.getPage(1);
    const vp0 = page.getViewport({scale: 1});
    const scale = Math.min(2.5, MAXW * 1.25 / vp0.width);
    const vp = page.getViewport({scale});
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    return shrink(c, c.width, c.height);
  }
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => res(shrink(img, img.naturalWidth, img.naturalHeight));
    img.onerror = () => rej(new Error('이미지를 읽지 못했습니다.'));
    img.src = URL.createObjectURL(file);
  });
}

/* ---------- 결과지 등록/판독 창 (임직원 본인 · 플랫폼 관리자 공용) ---------- */
/* AI 판독 — 결과지 이미지를 서버(Edge Function)에 보내 등급·불균형 항목을 JSON 으로 받습니다.
   MOTI_AI_ENDPOINT 가 비어 있으면(데모) 서버 없이 샘플 판독 결과를 씁니다. */
const MOTI_AI_ENDPOINT = '';   // 비워 두면 운영 모드에서는 Supabase 주소/functions/v1/moti-read 를 자동으로 씁니다
function motiAiEndpoint(){ return MOTI_AI_ENDPOINT || (LIVE ? SUPABASE_URL.replace(/\/$/, '') + '/functions/v1/moti-read' : ''); }
async function motiAiRead(sheetDataURL){
  const MOTI_AI_ENDPOINT = motiAiEndpoint();
  if(MOTI_AI_ENDPOINT){
    const res = await fetch(MOTI_AI_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json',
      ...(typeof SUPABASE_ANON_KEY !== 'undefined' && SUPABASE_ANON_KEY ? {Authorization:'Bearer ' + SUPABASE_ANON_KEY} : {})},
      body: JSON.stringify({ image: sheetDataURL }) });
    if(!res.ok){
      if(res.status === 404 || res.status === 500) return { manual:true, reason:'AI 판독 서버(moti-read)가 아직 배포되지 않았거나 API 키가 없습니다. 값을 직접 입력해 주세요.' };
      throw new Error('AI 판독 서버 응답 오류 (' + res.status + ')');
    }
    const j = await res.json();
    if(!j || !Array.isArray(j.items)) throw new Error('AI 판독 결과 형식이 올바르지 않습니다.');
    return Object.assign({ demo:false }, j);
  }
  // v168: AI 판독 서버(MOTI_AI_ENDPOINT)가 없으면 예전처럼 샘플 판독값으로 자동 채웁니다.
  //        실제 결과지와 다를 수 있으므로 '읽은 항목 확인·수정' 칸이 열린 채로 보여 주고, 관리자가 고친 뒤 승인합니다.
  await new Promise(r => setTimeout(r, 600));
  return { demo:true, grade: MOTI_SAMPLE.grade, pct: MOTI_SAMPLE.pct, front: MOTI_SAMPLE.front, side: MOTI_SAMPLE.side, back: MOTI_SAMPLE.back,
           measured: MOTI_SAMPLE.measured, items: MOTI_SAMPLE.items.map(i => ({part:i.part, deg:i.deg, tension:i.tension, cause:i.cause})) };
}

window.motiPickFile = async (file) => {
  if(!file) return;
  const r = ME.rec;
  ME.busy = true; ME.msg = '결과지를 그림으로 바꾸는 중…'; renderMotiEditor();
  try{
    r.sheet = await fileToSheetImage(file);
    ME.msg = 'AI 가 등급과 불균형 항목을 읽는 중…'; renderMotiEditor();
    const ai = await motiAiRead(r.sheet);
    if(ai.manual){                       // 서버 없음 → 직접 입력
      if(ai.reason) toast(ai.reason);
      r.grade = ''; r.pct = ''; r.front = ''; r.side = ''; r.back = '';
      r.measured = iso(new Date()).replace(/-/g, '.');
      r.items = [1,2,3].map(() => ({part:'', deg:'', tension:'', cause:''}));
      r.summary = []; r.exercises = []; r.targets = {}; r.videos = []; r.videoTargets = {};
      r.aiDemo = true; r.manual = true; ME.showItems = true; ME.msg = ''; ME.busy = false;
      renderMotiEditor(); return;
    }
    r.manual = false;
    r.grade = ai.grade || r.grade; r.pct = ai.pct || r.pct; r.front = ai.front || ''; r.side = ai.side || ''; r.back = ai.back || '';
    r.measured = ai.measured || r.measured || iso(new Date()).replace(/-/g, '.');
    r.items = (ai.items || []).map((i, k) => ({ rank:k+1, part:i.part || '', deg:i.deg || '', tension:Number(i.tension) || 0, cause:i.cause || '', tag:i.tag || '' }));
    r.aiDemo = !!ai.demo;
    if(ai.demo) ME.showItems = true;     // 샘플 값이면 확인·수정 칸을 펼쳐 둡니다
    const a = motiAnalyze(r);
    // v180: AI 가 종합 소견 3줄을 돌려주면 그것을 쓰고, 없으면 규칙 소견
    r.summary = (Array.isArray(ai.summary) && ai.summary.length === 3) ? ai.summary : a.summary;

    r.exercises = a.exercises; r.targets = a.targets; r.videos = a.videos; r.videoTargets = a.videoTargets;

};
window.motiSaveFromEditor = (status) => {

/* 오른쪽 가운데 떠 있는 바로가기 메뉴.

const QUICK_LINKS = {
  home:    'https://cheilrefitcare.com/',
  blog:    'https://blog.naver.com/cheilrefitcare',
  youtube: 'https://www.youtube.com/channel/UCf_rpPJVcXa9xJ32s7Q4UEQ',

/* ────────────────────────────────────────────────────────────
   퀵메뉴 아이콘 — 여기만 고치면 됩니다.

   icon 에 이미지 주소를 넣으면 그 그림을 씁니다.
   비워 두면('') 지금처럼 코드로 그린 기본 아이콘이 나옵니다.
       icon: 'https://example.com/logo.png'
   size  : 버튼 안에서 그림이 차지할 크기(px)
   fit   : 'contain' 은 그림 전체가 보이고, 'cover' 는 칸을 꽉 채웁니다
   bg    : 버튼 배경색. 이미지에 배경이 있으면 '#fff' 로 두세요
   ──────────────────────────────────────────────────────────── */
/* v184: 각 사이트의 실제 아이콘(파비콘)을 구글 아이콘 서비스로 받아옵니다.
   주소 형식: https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&size=128&url=<사이트 주소>
   → url= 뒤의 사이트 주소만 바꾸면 그 사이트 아이콘으로 바뀝니다. 못 받아오면 기본 아이콘으로 자동 대체됩니다. */
const siteIcon = u => 'https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&size=128&url=' + encodeURIComponent(u);
const QUICK_ICONS = {
  home:    { icon:LOGO_URL,                      size:40, fit:'contain', bg:'#fff' },  // 공식 사이트 = 제일리핏케어 로고 (헤더와 같은 파일)
  blog:    { icon:siteIcon(QUICK_LINKS.blog),    size:36, fit:'contain', bg:'#fff' },  // 네이버 블로그 아이콘
  youtube: { icon:siteIcon(QUICK_LINKS.youtube), size:36, fit:'contain', bg:'#fff' },  // 유튜브 아이콘
};

/* 맨 위로. 창이 아니라 안쪽 상자가 스크롤되는 경우도 있어 함께 올립니다. */
window.goTopScroll = () => {
  const opt = {top:0, left:0, behavior:'smooth'};
  const tops = [window, document.scrollingElement, document.documentElement,
                document.body, document.getElementById('app')];
  tops.forEach(el => {
    if(!el) return;
    try{ el.scrollTo ? el.scrollTo(opt) : (el.scrollTop = 0); }
    catch(e){ try{ el.scrollTop = 0; }catch(e2){} }
  });
};

function quickMenuHTML(){
  /* 설정에 이미지 주소가 있으면 그 그림을, 없으면 기본 아이콘을 씁니다. */
  const art = (key, fallback) => {
    const c = QUICK_ICONS[key] || {};
    if(!c.icon) return fallback;
    // 가로로 긴 로고가 찌그러지지 않도록 높이는 자동으로 둡니다.
    // 그림을 못 받아오면(주소 변경·사내망 차단 등) 기본 아이콘으로 되돌립니다.
    return `<img src="${esc(c.icon)}" alt="" loading="lazy"
      style="width:${c.size || 34}px;max-height:${c.size || 34}px;height:auto;
             object-fit:${c.fit || 'contain'};display:block"
      onerror="this.style.display='none';
               this.parentNode.style.background='';
               this.nextElementSibling.style.display='flex'"><span
      class="qm-fb" style="display:none">${fallback}</span>`;
  };
  const bg = key => {
    const c = QUICK_ICONS[key] || {};
    return c.icon && c.bg ? ` style="background:${esc(c.bg)}"` : '';
  };

  const item = (key, href, cls, label, inner) => `<a class="qm-i ${cls}"
    href="${href}" target="_blank" rel="noopener noreferrer">
    <span class="qm-ico"${bg(key)}>${art(key, inner)}</span>
    <span class="qm-l">${label}</span></a>`;

  /* v184: 공식 사이트 · 블로그 · 유튜브 바로가기 복원 (QUICK_LINKS / QUICK_ICONS 값으로 그립니다) */
  // 공식 로고를 온라인에서 못 받아오면 헤더와 같은 내장 로고(LOGO_DEFAULT)를 씁니다.
  const homeFb = `<img src="${LOGO_DEFAULT}" alt="" style="width:40px;height:auto;display:block">`;
  const blogFb = `<span class="qm-blog-t">blog</span>`;
  const ytFb   = `<svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M9 7.5v9l7.5-4.5z" fill="#fff"/></svg>`;
  return `<nav class="quickmenu" aria-label="바로가기">
    ${item('home',    QUICK_LINKS.home,    'qm-home', '공식 사이트', homeFb)}
    ${item('blog',    QUICK_LINKS.blog,    'qm-blog', '블로그',      blogFb)}
    ${item('youtube', QUICK_LINKS.youtube, 'qm-yt',   '유튜브',      ytFb)}
    <button type="button" class="qm-top" onclick="goTopScroll()" aria-label="맨 위로">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 19V6M12 6l-6 6M12 6l6 6" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span>TOP</span>
    </button>
  </nav>`;
}

function empBody(){
  const sec = S.nav.emp;
  if(sec === 'book'){
    // 통증 상담이 필요하면 프로그램 선택보다 먼저 받습니다.
    if(S.needCheck && !S.checkDone) return checkPane();
    return S.step===1 ? programPane()
         : S.step===2 ? calendarPane()
         : donePane();
  }
  if(sec === 'home' || sec === 'home.today') return empTodayPane();
  if(sec === 'result.session')  return surveyPane();     // 예약 상세에서 들어옵니다
  if(sec === 'result.change')   return empChangePane();
  if(sec === 'my.profile')      return managePane('profile');
  if(sec === 'my.bookings')     return managePane('bookings');
  return empTodayPane();
}

function route(){
  const h = location.hash.replace(/^#\/?/, '');
  const seg = h.split('/');
  if(seg[0] === 'admin')  return {page:'admin'};
  if(seg[0] === 'survey') return {page:'emp', sec:'result.session', code:seg[1] || ''};
  if(seg[0] === 'join'){
    // 회사별 QR·링크로 들어오면 해당 회사가 미리 선택됩니다.
    const c = companyById(decodeURIComponent(seg[1] || ''));
    if(c) JOIN.picked = c;
    return {page:'emp', sec:null};
  }
  if(seg[0] === 'manage') return {page:'emp', sec:'my.bookings'};
  if(seg[0] === 'emp'){
    const s = seg[1] || 'home.today';
    return {page:'emp', sec: EMP_ALIAS[s] || s};
  }
  return {page:'emp', sec:null};       // sec=null : 지금 보고 있던 화면 유지
}

function render(){ window.__appReady = true;
  requestAnimationFrame(bmPlacePopovers);   // 바디맵 말풍선 위치 (DOM 이 바뀐 뒤)
  const r = route();
  let body;

  // 관리자 화면 — 자체 로그인을 쓰므로 직원 로그인 게이트를 거치지 않습니다.
  if(r.page === 'admin'){
    // 관리자 화면에서는 임직원용 상단 메뉴(Home·프로그램·예약·MY·관리자)를 쓰지 않습니다.
    // 로그인 전에는 로그인 화면처럼 로고 줄 없이 전체를 씁니다.
    body = S.admin.authed
      ? `${topNav(true)}
      <main class="flex-1 w-full bg-background">${adminPane()}</main>`
      : `<main class="flex-1 w-full bg-background">${adminPane()}</main>`;
    app.innerHTML = body;
    tickCountdown();
    if(S.admin.authed && S.admin.role === 'operator' && (S.nav.pf === 'system' || S.nav.pf === 'system.config')) setTimeout(drawAdminQR, 0);
    return;
  }

  // 발급받은 임시 비밀번호로 처음 로그인했으면 비밀번호부터 바꿉니다.
  if(S.auth.user && S.auth.user.mustChangePw){
    app.innerHTML = `<main class="flex-1 w-full bg-background">${firstPwPane()}</main>`;
    return;
  }
  // 로그인은 했지만 소속 회사가 아직 없으면 회사 연결 화면을 먼저 보여 줍니다.
  if(S.auth.user && !S.auth.user.company){
    body = `<main class="flex-1 w-full bg-background">${joinPane()}</main>`;
    app.innerHTML = body;
    return;
  }

  // 회사까지 연결됐지만 초기 문진을 아직 안 했으면 여기서 한 번 받습니다.
  if(S.auth.user && !baselineDone()){
    body = `<main class="flex-1 w-full bg-background">${baselinePane()}</main>`;
    app.innerHTML = body;
    return;
  }

  // 임직원 화면은 로그인해야 볼 수 있습니다.
  if(!S.auth.user){
    // 로그인 화면은 위 로고 줄 없이 전체를 씁니다. (로고는 왼쪽 소개 칸 안에 있습니다)
    body = `<main class="flex-1 w-full bg-background">${S.auth.checked ? authPane() : ''}</main>`;
    app.innerHTML = body;
    return;
  }

  // ※ 여기서 r.sec 을 다시 넣으면 안 됩니다.
  //    주소가 #/manage 인 상태에서는 화면을 그릴 때마다 '나의 예약'으로 되돌아가
  //    다른 메뉴를 눌러도 반응이 없는 것처럼 보입니다.
  //    주소로 들어온 화면은 boot() 에서 한 번만 정합니다.

  window.LG_OPEN = false;   // 로그아웃하면 다시 사진 첫 화면부터
  body = `${topNav()}
    ${S.nav.emp === 'book' ? mobileSteps() : ''}
    <div class="flex flex-1 w-full emp-wrap">
      ${empSideNav()}
      <main class="flex-1 min-w-0 p-margin-mobile md:p-margin-desktop bg-background">
        <div class="emp-main calmpage${S.nav.emp === 'book' ? ' bookpage' : ''}">${homeBtn()}${empBody()}</div></main>
      ${quickMenuHTML()}
    </div>
    ${siteFooter()}
    ${empTabBar()}`;

  app.innerHTML = body;
  tickCountdown();
}

/* 변경·취소 마감까지 남은 시간을 갱신합니다.
   기준은 '그 예약의 일정'입니다. 일정을 바꾸면 자동으로 다시 계산됩니다. */
function tickCountdown(){
  const el = document.getElementById('cd');
  if(!el) return;

  // 마이페이지에서는 조회한 예약, 신청 완료 화면에서는 방금 잡은 일정
  const left = (S.nav.emp.startsWith('my') && MG.info)
    ? cutoffLeft(MG.info.d, MG.info.t)
    : cutoffLeft(S.date, S.time);

  el.textContent = fmtRemain(left);
  if(left <= 0){
    el.classList.add('over');
    if(S.nav.emp.startsWith('my') && MG.state === 'ok'){ MG.state = 'expired'; render(); }
    return;
  }
  // 하루 넘게 남았으면 초 단위로 돌릴 필요가 없습니다.
  clearTimeout(tickCountdown._t);
  tickCountdown._t = setTimeout(tickCountdown, left > 86400000 ? 60000 : 1000);
}


/* ============================================================
   시연용 데이터 — 한국투자공사 임직원 50명이 참여한 상태
   · 데모 모드(LIVE=false)에서 처음 열 때 한 번만 localStorage 에 넣습니다.
   · 같은 브라우저에서 다시 넣으려면 콘솔에서  seedDemoKIC(true)
   · 지우려면  KSTORE.clear()
   ============================================================ */
const DEMO_SEED_KEY = 'demoSeed';
const DEMO_SEED_VER = 'kic-release-v2';
const DEMO_PEOPLE = 0;        // 시연용 임직원 수 (0 = 계정만 넣고 예약·상담 데이터 없음)
/* 시연 계정만 (없는 것만) 채웁니다 — 데이터 시드와 별개로 언제든 호출 가능 */
/* ── 코드에서 직접 정하는 임직원 발급 계정 ──
   플랫폼 관리자 화면(시스템 관리 › 임직원 계정 발급)을 쓰지 않고 코드에 적어 두는 방법입니다.
   한 줄에 한 명: { id:'아이디', pw:'임시 비밀번호', name:'이름', empno:'사번(선택)', dept:'부서(선택)' }
   - 아이디·비밀번호의 글자 수·형식 제한 없음 (아이디에 공백만 불가)
   - 파일을 여는 브라우저마다 '없는 아이디만' 새로 만들어지므로, 이미 비밀번호를 바꾼 사람의 계정은 덮어쓰지 않습니다.
   - 임직원은 첫 로그인 때 이름·주민번호 앞 7자리·휴대폰·새 비밀번호 → 소속 회사 → 사전 상담 순으로 진행합니다.
   - 운영 전에 테스트 줄(test)은 지우세요. */
const PROVISIONED_ACCOUNTS = [
  { id:'test', pw:'test1234', name:'테스트' },                       // 테스트용
  // { id:'kic001', pw:'welcome2026', name:'홍길동', empno:'2024001', dept:'운용전략본부' },
  // { id:'kic002', pw:'welcome2026', name:'김민지' },
];
window.ensureDemoAccounts = () => {
  // KIC 실사용 빌드: 임직원 테스트 계정(test/demo/demo2@kic.co.kr)은 만들지 않고, 남아 있으면 지웁니다.
  const H = DB._hash.bind(DB);
  const members = (() => { try{ return JSON.parse(KSTORE.getItem('members') || '{}'); }catch{ return {}; } })();
  let changed = false;
  ['test@kic.co.kr','demo@kic.co.kr','demo2@kic.co.kr'].forEach(e => { if(members[e]){ delete members[e]; changed = true; } });
  // 코드에 적어 둔 발급 계정(PROVISIONED_ACCOUNTS)을 없는 것만 만듭니다. 이미 있는 아이디는 건드리지 않습니다(비밀번호 바꾼 사람 보호).
  PROVISIONED_ACCOUNTS.forEach(a => {
    const e = authEmailOf(a.id); if(members[e]) return;
    members[e] = { name:a.name, email:e, company:'', pw:H(a.pw), empno:a.empno || null, dept:a.dept || null, phone:null,
                   profile:null, baseline:null, baselineAt:null, mustChangePw:true, provisionedAt:new Date().toISOString() };
    changed = true;
  });
  if(changed) KSTORE.setItem('members', JSON.stringify(members));
  // 관리자 계정은 필요합니다 (기업 관리자 · 플랫폼 관리자). 첫 로그인 후 '비밀번호 변경'으로 바꿔 쓰세요.
  const admins = (() => { try{ return JSON.parse(KSTORE.getItem('adminAccts') || '{}'); }catch{ return {}; } })();
  if(!admins['hr@kic.co.kr']) admins['hr@kic.co.kr'] = { email:'hr@kic.co.kr', pw:H('kic1234'), role:'company', company:'kic', trainer:null };
  if(!admins['admin@cheilrefitcare.com']) admins['admin@cheilrefitcare.com'] = { email:'admin@cheilrefitcare.com', pw:H('admin1234'), role:'operator', company:null, trainer:null };
  KSTORE.setItem('adminAccts', JSON.stringify(admins));
};
window.seedDemoKIC = (force) => {
  if(LIVE) return false;
  if(!force && KSTORE.getItem(DEMO_SEED_KEY) === DEMO_SEED_VER) return false;
  // KIC 실사용 빌드: 시연용 예약 50건 · 김한투/테스트/이서연 계정 · 체형 분석 샘플을 넣지 않습니다.
  // 같은 브라우저에 예전 시연 데이터가 남아 있으면 여기서 한 번 지웁니다. (관리자 계정은 ensureDemoAccounts 에서 보장)
  const members = (() => { try{ return JSON.parse(KSTORE.getItem('members') || '{}'); }catch{ return {}; } })();
  ['test@kic.co.kr','demo@kic.co.kr','demo2@kic.co.kr'].forEach(e => delete members[e]);
  KSTORE.setItem('members', JSON.stringify(members));
  const rows = (() => { try{ return JSON.parse(KSTORE.getItem('bookings') || '[]'); }catch{ return []; } })();
  const isDemo = r => /^kic\d{3}@kic\.co\.kr$/.test(r.email || '') || ['test@kic.co.kr','demo@kic.co.kr','demo2@kic.co.kr'].includes(r.email) || r.__sample;
  KSTORE.setItem('bookings', JSON.stringify(rows.filter(r => !isDemo(r))));
  KSTORE.removeItem('motiResults');
  KSTORE.setItem(DEMO_SEED_KEY, DEMO_SEED_VER);
  console.info('[KIC] 실사용 빌드 — 시연 데이터 없이 시작합니다.');
  return true;
};

async function boot(){
  console.info("[refit] booking v217");
  // 폴드·플립을 펼치거나 접을 때, 회전할 때: 폭이 바뀌면 화면을 다시 그립니다 (절대 좌표로 놓인 말풍선·차트가 어긋나지 않게)
  { let lastW = window.innerWidth, t = null;
    window.addEventListener('resize', () => { if(Math.abs(window.innerWidth - lastW) < 40) return;
      lastW = window.innerWidth; clearTimeout(t); t = setTimeout(() => { try{ render(); }catch(e){} }, 150); }); }
  if(!LIVE){ seedDemoKIC(); ensureDemoAccounts(); }
  // 회사 이름 등 관리자 설정을 먼저 불러와 반영합니다.
  try{
    const st = await DB.getSettings();
    if(st.company)  CONFIG.company  = st.company;
    if(st.logo) CONFIG.logo = st.logo;               // 비어 있으면 내장 로고 유지
    if(st.provider) CONFIG.provider = st.provider;
    if(st.program_hosts){
      try{
        const ov = JSON.parse(st.program_hosts);
        // v148: 테스트용 이름(김기천·박서연·이지훈)이 섞인 예전 배정은 버리고 기본 3명을 씁니다.
        const OLD = ['김기천','박서연','이지훈','박지영'];   // v183: 박지영 → 장혜윤 교체, 서버에 남은 예전 배정은 버림
        Object.keys(ov).forEach(k => { if(!Array.isArray(ov[k]) || !ov[k].length || ov[k].some(n => OLD.includes(n))) delete ov[k]; });
        Object.assign(HOST_OVERRIDE, ov);
        if(Object.keys(ov).length === 0) await DB.setSetting('program_hosts', '{}');
      }catch(e){ console.error(e); }
    }
    if(st.video_links){ try{ Object.assign(VIDEO_OVR_CACHE, JSON.parse(st.video_links)); }catch(e){ console.error(e); } }   // v180
    if(st.trainer_colors){
      try{ Object.assign(TR_COLOR_SET, JSON.parse(st.trainer_colors)); }
      catch(e){ console.error(e); }
    }
    // 한국투자공사 서비스는 1인 1회로 고정입니다.
    // 예전에 저장해 둔 설정값(예: 12회)에 끌려가지 않도록 여기서는 반영하지 않습니다.
    // 회차를 늘릴 때는 아래 줄의 주석을 풀고 CONFIG.quota 기본값도 함께 바꾸세요.
    // if(st.quota) CONFIG.quota = parseInt(st.quota, 10) || CONFIG.quota;
    document.title = APP_TITLE;
  }catch(e){ console.error(e); }

  const r = route();

  // 관리자 경로는 직원 로그인과 무관하게 자체 로그인을 씁니다.
  if(r.page==='admin'){
    S.admin.authed = await DB.session();
    if(S.admin.authed){
      S.admin.role = await DB.myRole();
      if(S.admin.role === 'company') S.admin.companyId = await DB.myCompany();
      return refreshAdmin();
    }
    return render();
  }

  // 직원 로그인 세션 확인 (한 번만)
  if(!S.auth.checked){
    try{
      S.auth.user = await DB.currentUser();
      // '로그인 상태 유지'를 끈 채 브라우저를 닫았다면 여기서 로그아웃합니다.
      if(S.auth.user && !sessionAlive()){
        await DB.memberSignOut();
        S.auth.user = null;
      }
    }catch(e){ console.error(e); }
    S.auth.checked = true;
    if(S.auth.user){ S.form.name = S.auth.user.name; S.form.email = S.auth.user.email; }
  }

  // 로그인 안 했으면 로그인 화면만 보여줍니다.
  if(!S.auth.user){ return render(); }

  // 새로고침으로 들어와도 기준선(초기 문진)을 갖고 시작합니다.
  await loadBaselineOnce();

  if(r.sec) S.nav.emp = r.sec;

  // 만족도 조사 화면은 대상 예약을 먼저 찾습니다.
  if(LIVE && S.nav.emp === 'result.change' && !MOTI_CACHE.mineLoaded) loadMyMoti();   // v180
  if(S.nav.emp === 'result.session' && SV.state !== 'form'){
    render(); await lookupMine();
    return;
  }
  // 나의 예약이 필요한 화면들
  if(EMP_NEED_MINE.includes(S.nav.emp)){
    render(); await loadMine();
    if(!S.nav.emp.startsWith('my')) { await loadTaken(); render(); }
    return;
  }
  render();               // 캘린더 먼저 그리고
  await loadTaken();      // 예약 현황이 오면 다시 그린다
  render();
}

window.addEventListener('hashchange', () => {
  SV.state = 'load'; SV.msg = ''; S.survey = {}; S.errors = {};
  MG.changing = false; MG.msg = '';
  boot();
});
boot();
</script>
</body>
</html>
