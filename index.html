/* ============================================================
   사전 상담 — 집계 대시보드 (관리자 탭)
   ============================================================ */
function aggQCard(q, rows){
  const vals     = rows.map(r => r.intake && r.intake[q.id]);
  const answered = vals.filter(hasVal);
  const n        = answered.length;
  const head = (badge, cls) => `<div class="card-h">${esc(q.q)}
      <span class="iq-badge ${cls||''}">${badge}</span>
      <span style="flex:1"></span>
      <span class="card-sub">${n}명 응답</span></div>`;

  // 자유 응답 — 카드 전체 너비로 목록 표시
  if(q.type==='text' || q.type==='textarea'){
    const notes = rows.filter(r => hasVal(r.intake && r.intake[q.id]));
    return `<div class="iq-card" style="grid-column:1/-1">
      ${head('자유 응답','free')}
      ${notes.length
        ? `<div class="iq-notes">${notes.slice(0,50).map(r=>`
            <div class="iq-note">
              <div class="iq-note-t">${esc(r.intake[q.id])}</div>
              <div class="iq-note-m">${esc(r.name||'')} · ${esc(programById(r.program).name)} · ${fmtDate(r.slot_date)}</div>
            </div>`).join('')}</div>`
        : `<div class="empty">작성된 내용이 없습니다.</div>`}
    </div>`;
  }

  // 척도 — 평균 + 분포 히스토그램
  if(q.type==='scale'){
    const min = (q.min===undefined?1:q.min), max = (q.max===undefined?5:q.max);
    const nums = answered.filter(v => typeof v==='number');
    const avg  = nums.length ? nums.reduce((a,b)=>a+b,0)/nums.length : null;
    const counts = [];
    for(let i=min;i<=max;i++) counts.push(nums.filter(v=>v===i).length);
    const mx = Math.max(1, ...counts);
    return `<div class="iq-card">
      ${head('척도','scale')}
      <div class="iq-avg">
        <span class="iq-avg-v">${avg===null?'–':avg.toFixed(1)}</span>
        <span class="iq-avg-l">평균 · ${min}~${max}점</span>
      </div>
      <div class="iq-hist">${counts.map((c,i)=>{
        const v = min+i, hot = (q.id==='stress') && v>=8;
        return `<div class="iq-bar ${hot?'hot':''}">
          <b>${c||''}</b><i style="height:${(c/mx*100).toFixed(1)}%"></i><span>${v}</span></div>`;
      }).join('')}</div>
      ${(q.low||q.high)?`<div class="iq-legend"><span>${esc(q.low||'')}</span><span>${esc(q.high||'')}</span></div>`:''}
    </div>`;
  }

  // 동의 — 비율 막대
  if(q.type==='consent'){
    const yes = rows.filter(r => r.intake && r.intake[q.id]).length;
    const pct = rows.length ? Math.round(yes/rows.length*100) : 0;
    return `<div class="iq-card">
      ${head('동의 항목')}
      <div class="iq-avg"><span class="iq-avg-v">${pct}%</span>
        <span class="iq-avg-l">${yes}/${rows.length}명 동의</span></div>
      <div class="iq-track" style="margin-top:8px"><div class="iq-fill top" style="width:${pct}%"></div></div>
    </div>`;
  }

  // 단일·복수 선택 — 많이 고른 순 막대
  const multi  = (q.type==='checkbox');
  const counts = {};
  (q.options||[]).forEach(o => counts[o] = 0);
  answered.forEach(v => {
    (Array.isArray(v)?v:[v]).forEach(o => { counts[o] = (counts[o]||0)+1; });
  });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const mx = Math.max(1, ...entries.map(e=>e[1]));
  return `<div class="iq-card">
    ${head(multi?'복수 선택':'단일 선택', multi?'multi':'')}
    ${n===0
      ? `<div class="empty">아직 응답이 없습니다.</div>`
      : entries.map(([o,c],i)=>`
        <div class="iq-row">
          <div class="iq-lab" title="${esc(o)}">${esc(o)}</div>
          <div class="iq-track">
            <div class="iq-fill ${isWarnOpt(q.id,o)?'warn':(i===0?'top':'')}" style="width:${(c/mx*100).toFixed(1)}%"></div>
          </div>
          <div class="iq-num"><b>${c}</b>명 ${n?Math.round(c/n*100):0}%</div>
        </div>`).join('')}
  </div>`;
}

function intakeTab(){
  const all = adminRows();
  if(all.length===0){
    return `<div class="card" style="margin-top:8px"><div class="empty">아직 신청 데이터가 없습니다. 신청이 들어오면 사전 상담 응답이 여기에 모입니다.</div></div>`;
  }

  const pf   = AD.intakeProgram || 'all';
  const progIds = [...new Set(all.map(r=>r.program).filter(Boolean))];
  const rows = (pf==='all' ? all : all.filter(r => (r.program||'')===pf))
                 .filter(r => r.intake && Object.keys(r.intake).length);

  const qs = intakeQsFor(pf==='all' ? (progIds.length?progIds:PROGRAMS.map(p=>p.id)) : [pf]);
  const consentN = rows.filter(r => r.intake && r.intake.consent).length;
  const riskRows = rows.filter(r => riskTags(r.intake).length);
  const noteN    = rows.filter(r => hasVal(r.intake && r.intake.note)).length;

  // 스트레스 문항은 모든 프로그램 공통이라 평균을 따로 뽑아 보여 줍니다.
  const stressNums = rows.map(r => r.intake && r.intake.stress).filter(v => typeof v==='number');
  const stressAvg  = stressNums.length ? (stressNums.reduce((a,b)=>a+b,0)/stressNums.length).toFixed(1) : null;
  const stressHigh = stressNums.filter(v => v>=8).length;

  const kpis = [
    ['사전상담 응답',  rows.length+'명', pf==='all' ? '전체 프로그램' : esc(programById(pf).name)],
    ['개인정보 동의',  rows.length?Math.round(consentN/rows.length*100)+'%':'–', `${consentN}/${rows.length}명`],
    ['주의 필요',      riskRows.length+'명', '부상·통증 표시'],
    ['요청사항 작성',  noteN+'명', rows.length?Math.round(noteN/rows.length*100)+'% 작성':''],
  ];

  // 문항 카드 — 자유응답은 맨 뒤로
  const ordered = [...qs].sort((a,b)=>{
    const w = t => (t==='text'||t==='textarea') ? 2 : (t==='consent' ? 1 : 0);
    return w(a.type) - w(b.type);
  });

  // 개인별 응답 목록
  const q = (AD.intakeQuery||'').toLowerCase().trim();
  const persons = rows
    .filter(r => !q || (r.name||'').toLowerCase().includes(q)
                    || (r.email||'').toLowerCase().includes(q)
                    || (r.code||'').toLowerCase().includes(q))
    .sort((a,b) => String(b.slot_date||'').localeCompare(String(a.slot_date||'')));

  return `
  <p class="sub" style="margin-bottom:4px">신청자가 작성한 <b>사전 상담 응답 전체</b>를 문항별로 모아 봅니다. 아래 개인별 목록에서 한 사람의 답변을 카드로 펼쳐 볼 수 있습니다.</p>

  <div class="iq-tools">
    <div class="filter-group">
      <label class="filter-label">프로그램</label>
      <select class="filter-sel" onchange="AD.intakeProgram=this.value;render()">
        <option value="all" ${pf==='all'?'selected':''}>전체 프로그램</option>
        ${progIds.map(id=>`<option value="${esc(id)}" ${pf===id?'selected':''}>${esc(programById(id).name)}</option>`).join('')}
      </select>
    </div>
    <div style="flex:1"></div>
    <button class="mini" onclick="exportCSV('intake')">사전상담 CSV 내보내기</button>
  </div>

  <div class="kpis" style="margin-top:14px">
    ${kpis.map(([l,v,s])=>`
      <div class="kpi"><div class="kpi-l">${l}</div><div class="kpi-v">${v}</div>
        ${s?`<div class="kpi-s">${s}</div>`:''}</div>`).join('')}
  </div>

  ${riskRows.length ? `
  <div class="iq-card iq-alert" style="margin-top:18px">
    <div class="card-h">${ico('warning')} 먼저 확인이 필요한 참여자
      <span style="flex:1"></span><span class="card-sub">이름을 누르면 응답 전체가 열립니다</span></div>
    <div class="ialert-list">
      ${riskRows.slice(0,30).map(r=>`
        <span class="ialert" onclick="openIntake('${String(r.id).replace(/'/g,"\\'")}')">
          <b>${esc(r.name||'')}</b><em>${esc(riskTags(r.intake).join(' · '))}</em></span>`).join('')}
    </div>
  </div>` : ''}

  <div class="iq-grid">
    ${ordered.map(qq => aggQCard(qq, rows)).join('')}
  </div>

  <div class="toolbar" style="margin-top:28px">
    <div class="card-h" style="margin-right:6px">개인별 응답</div>
    <input type="text" class="livesearch" placeholder="이름 · 이메일 · 신청코드 검색" value="${esc(AD.intakeQuery||'')}"
           id="intakeSearch" data-sel="#intakeSearch" autocomplete="off"
           oninput="AD.intakeQuery=this.value;searchRender(this)"
           style="flex:1;max-width:280px;border:1px solid var(--line);border-radius:8px;padding:9px 12px">
    <div style="flex:1"></div>
    <span class="filter-count">${persons.length}명</span>
  </div>

  <div class="mcards">
    ${persons.length===0 ? `<div class="card"><div class="empty">검색 결과가 없습니다.</div></div>` :
      persons.map(r=>{
        const open  = AD.intakeOpen===r.id;
        const risks = riskTags(r.intake);
        const key   = String(r.id).replace(/'/g,"\\'");
        return `
        <div class="mcard ${open?'open':''}" id="intake-${esc(String(r.id))}">
          <div class="mcard-head" onclick="toggleIntake('${key}')">
            <div class="mavatar">${esc((r.name||'?').slice(0,1))}</div>
            <div style="flex:1;min-width:0">
              <div class="mname">${esc(r.name||'')}</div>
              <div class="memail">${esc(programById(r.program).name)} · ${fmtDate(r.slot_date)} ${fmtTime(String(r.slot_time).slice(0,5))}</div>
            </div>
            <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
              ${r.intake && r.intake.dept ? `<span class="prisk">${esc(r.intake.dept)}</span>`:''}
              ${r.intake && r.intake.age  ? `<span class="prisk">${esc(r.intake.age)}</span>`:''}
              ${risks.length ? `<span class="prisk warn">주의 ${risks.length}</span>` : ''}
            </div>
            <div class="mchev">${open?'▲':'▼'}</div>
          </div>
          ${open ? `<div style="padding:0 16px 16px">${intakePersonCard(r)}</div>` : ''}
        </div>`;
      }).join('')}
  </div>`;
}

/* 시간을 고르면 그 시간에 비어 있는 담당자 중 한 명을 무작위로 배정합니다.
   (사람이 고르지 않으므로 특정 담당자에게 쏠리지 않습니다) */
/* v174: 시작 시각(= 자리)을 고르면 그 자리에 배치된 운동처방사가 담당자가 됩니다. */
window.pickTime = (t) => {
  const base = slotKey(t);
  const pos = positionsOf(S.date, base);
  const pick = pos.find(x => x.t === t && x.free) || (t === base ? pos.find(x => x.free) : null);
  S.hour = base;
  S.time = pick ? pick.t : null;
  S.trainer = pick ? (pick.trainer || '') : null;     // v185: '' = 자리는 잡았지만 담당 미정
  render();
};
window.pickSubTime = window.pickTime;
window.moveMonth = n => { S.cursor = new Date(S.cursor.getFullYear(), S.cursor.getMonth()+n, 1); render(); };
window.backTo = n => { S.step = n; S.errors = {}; render(); };
/* 날짜·시간을 고른 뒤
   - 추가 상담이 필요 없으면 곧바로 신청을 넣습니다.
   - 필요하면 스트레스 문항 한 단계를 거칩니다. */
window.continueBooking = () => {
  S.errors = {}; S.bookMsg = '';
  // 같은 프로그램·같은 날짜는 중복이므로 여기서 막습니다.
  const dup = dupBooking(S.program, S.date);
  if(dup){
    showBookMsg('이미 예약 중인 프로그램입니다.'); return;
  }
  S.intake = currentIntake();
  return submitBooking();
};

/* 통증 재확인을 저장하고 신청까지 마칩니다. */
window.submitCheckStep = async () => {
  CHK.msg = ''; S.bookMsg = '';
  if(!validate(RECHECK_Q, CHK.ans, 'chk')){
    render();
    document.querySelector('.qerr, .err')?.scrollIntoView({block:'center', behavior:'smooth'});
    return;
  }
  CHK.busy = true; render();

  // 같은 신청에서 여러 번 눌러도 측정 기록이 중복으로 쌓이지 않게 합니다.
  if(!CHK.saved){
    const res = await DB.saveRecheck(CHK.ans);
    if(!res.ok){
      CHK.busy = false;
      CHK.msg = res.msg || '저장에 실패했습니다.';
      return render();
    }
    BASE.history = (res.rec && res.rec.history)
                 || [...(BASE.history||[]), {at:res.at, ans:CHK.ans, program:null}];
    CHK.saved = true;
  }

  CHK.busy = false;
  CHK.ans = {};
  S.checkDone = true;        // 이제 프로그램 선택으로 넘어갑니다
  S.step = 1;
  toast('통증 상담을 저장했습니다. 프로그램을 골라 주세요.');
  render(); window.scrollTo(0,0);
};

window.submitBooking = async () => {
  // 사전 상담은 가입 때 받았으므로, 여기서는 신청자 정보만 확인합니다.
  if(S.bookBusy) return false;              // v134: 처리 중에 또 누르는 것을 막습니다
  S.intake = currentIntake();
  S.errors = {};
  fillFormFromAuth();                       // v134: 폼이 비어 있으면 로그인 정보로 채웁니다
  const loggedIn = !!(S.auth && S.auth.user);
  if(!S.form.name.trim()) S.errors.name = '이름을 입력해 주세요.';
  // 로그인한 임직원은 계정 아이디를 그대로 씁니다(이메일 형식이 아니어도 됨).
  if(loggedIn ? !S.form.email.trim() : !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(S.form.email.trim()))
    S.errors.email = '올바른 이메일을 입력해 주세요.';
  if(Object.keys(S.errors).length){
    // 일정 화면에는 이름·이메일 칸이 없어, 예전에는 아무 반응 없이 멈춘 것처럼 보였습니다.
    showBookMsg('신청자 정보를 확인하지 못했습니다. 다시 로그인한 뒤 신청해 주세요.');
    return false;
  }
  if(!S.date || !S.time){ showBookMsg('날짜와 시간을 다시 선택해 주세요.'); return false; }
  S.bookBusy = true; render();

  // 연간 지원 한도 확인
  S.bookMsg = '';
  try{
    const used = await DB.quotaUsed(S.form.email);
    if(used >= CONFIG.quota){
      S.bookBusy = false;
      showBookMsg(`올해 지원 횟수를 모두 사용하셨습니다. `
                + `(${used} / ${CONFIG.quota}회) 담당자에게 문의해 주세요.`);
      return false;
    }
  }catch(e){ console.error(e); }

  // 일정 화면에서 바로 신청하는 경우에는 제출 버튼이 없을 수 있습니다.
  const btn = $('#submitBtn');
  if(btn){ btn.disabled = true; btn.textContent = '신청하는 중…'; }
  const code = newCode();
  try{
    await DB.createBooking({
      code,
      company: S.auth.user?.company || null,   // 로그인한 직원의 소속 회사
      program: S.program,
      name: S.form.name.trim(),
      email: S.form.email.trim(),
      phone: S.form.phone.trim() || null,
      dept: S.intake.dept || null,          // 집계용. 회사 담당자는 부서 통계만 봅니다.
      slot_date: S.date,
      slot_time: S.time,
      trainer: S.trainer || (P().rooms ? null : (programHosts(P())[0] || {}).name) || null,   // v185: 담당 미정 자리는 비워 둠
      memo: S.form.memo.trim() || null,
      intake: S.intake,
      status: 'booked',
    });
    S.code = code; S.createdAt = Date.now(); S.bookBusy = false;
    // 방금 넣은 신청이 나의 예약·내 정보·운동 내역에 바로 보이도록
    // 목록을 비워 두고 다시 불러옵니다. (이걸 빠뜨리면 예전 목록이 그대로 남습니다)
    MG.list = null; MG.state = 'load';
    S.step = doneStep(); render(); window.scrollTo(0,0);
    // 이번 신청 직전에 받은 통증 상담을 이 프로그램의 측정으로 연결합니다.
    if(S.needCheck && S.checkDone){
      try{
        const r = await DB.tagLastMeasure(S.program);
        if(r && r.rec) BASE.history = r.rec.history || BASE.history;
      }catch(e){ console.error(e); }
    }
    loadMine();
    return true;
  }catch(err){
    console.error('[신청 실패]', err);
    S.bookBusy = false;
    S.bookMsg = bookErrorText(err);
    toast(S.bookMsg);
    if(err && err.code === '23505'){
      await loadTaken(); S.time = null; S.step = 2;
    }
    setTimeout(() => { document.querySelector('.book-alert')?.scrollIntoView({block:'center', behavior:'smooth'}); }, 30);
    // 실패했으면 화면을 반드시 다시 그립니다.
    // (이걸 빠뜨리면 화면에는 선택이 남아 있는데 실제 값은 비어 있는 상태가 됩니다)
    render();
    return false;
  }
};

/* 신청 실패 사유를 사람이 읽을 수 있는 문장으로 바꿉니다. */
function bookErrorText(err){
  const code = err && err.code;
  const msg  = String((err && (err.message || err.msg)) || '');

  if(code === '23505')
    return '방금 그 시간은 이미 신청된 시간입니다. 다른 시간을 골라 주세요.';

  // 브라우저 저장 공간이 가득 찬 경우 (데모 모드에서 자주 생깁니다)
  if(err && (err.name === 'QuotaExceededError' || code === 22 || code === 1014
             || /quota/i.test(msg) || /exceeded/i.test(msg)))
    return '브라우저 저장 공간이 가득 찼습니다. 관리자 > 설정에서 데이터를 정리하거나, '
         + '브라우저 저장소를 비운 뒤 다시 시도해 주세요.';

  if(/Failed to fetch|NetworkError/i.test(msg))
    return '서버에 연결하지 못했습니다. 인터넷 연결을 확인해 주세요.';

  return '신청에 실패했습니다.' + (msg || code ? ` (${msg || code})` : ' 잠시 후 다시 시도해 주세요.');
}

window.openMine = async (code) => {
  MG.editOpen = false;        // 상세를 열 때는 항상 닫힌 상태로 시작합니다
  const b = (MG.list || []).find(x => x.code === code);
  if(!b){ return loadMine(); }
  // 상세 표시에 필요한 형태로 맞춥니다 (d, t 필드).
  MG.info = {...b, d: b.slot_date, t: b.slot_time};

const isEmailId = s => /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(s||'').trim());
const validLoginId = s => isEmailId(s) || /^[A-Za-z0-9._-]+$/.test(String(s||'').trim());   // v199: 영문·숫자·. _ - 만 허용
const LOGIN_ID_RULE = '아이디는 영문·숫자·마침표(.)·밑줄(_)·하이픈(-)만 쓸 수 있습니다 (한글·공백 불가)';
/* 운영(Supabase) 모드는 이메일 형식 계정만 받으므로 사번은 '사번@kic.go.kr' 로 바꿔 씁니다.
   임직원은 로그인 때 사번만 적어도 되고, 사번@kic.go.kr 전체를 적어도 됩니다. 화면에는 사번만 보입니다.
   v200: id.cheilrefitcare.com → kic.go.kr. 바꾸면 provision-accounts 함수의 ID_DOMAIN 과 SQL 14 도 같이 맞춰야 합니다. */
const AUTH_ID_DOMAIN = 'kic.go.kr';
const authEmailOf = id => isEmailId(id) ? String(id).trim().toLowerCase() : `${String(id).trim().toLowerCase()}@${AUTH_ID_DOMAIN}`;
const displayId = e => String(e||'').replace(new RegExp('@' + AUTH_ID_DOMAIN.replace(/\./g,'\\.') + '$'), '');
window.submitAuth = async () => {
  AUTH.msg = ''; AUTH.msgSmall = false;

  /* v209: 로그인은 전체 주소(사번@kic.go.kr)로만 받습니다. 사번만 적으면 안내합니다. */
  if(AUTH.mode === 'login' && !isEmailId(email)){
    AUTH.msg = `@${AUTH_ID_DOMAIN}까지 입력해 주세요. (예: ${email}@${AUTH_ID_DOMAIN})`; AUTH.msgSmall = true; return render(); }
  if(!AUTH.pw){ AUTH.msg = '비밀번호를 입력해 주세요.'; return render(); }

  AUTH.busy = true; render();
  try{
    let res;
    if(AUTH.mode === 'signup'){
      if(!AUTH.name.trim()){ AUTH.msg = '이름을 입력해 주세요.'; AUTH.busy=false; return render(); }
      if(AUTH.pw.length < 6){ AUTH.msg = '비밀번호는 6자 이상으로 해주세요.'; AUTH.busy=false; return render(); }
      if(AUTH.pw !== AUTH.pw2){ AUTH.msg = '비밀번호가 서로 다릅니다.'; AUTH.busy=false; return render(); }
      const rr = rrnInfo(AUTH.rrnF, AUTH.rrnG);
      if(!rr.ok){ AUTH.msg = rr.msg; AUTH.busy=false; return render(); }
      if(!validPhone(AUTH.phone)){ AUTH.msg = '휴대폰 번호를 확인해 주세요. (예: 010-1234-5678)'; AUTH.busy=false; return render(); }
      // 확인이 끝나면 원본 숫자는 버리고 성별·연령대만 계정에 남깁니다.
      const profile = {sex: rr.sex, age: rr.band, birth_year: rr.year};
      const ap = await DB.isSignupApproved(email, AUTH.empno);
      if(!ap.ok){
        AUTH.msg = ap.empty
          ? '아직 회원가입이 열리지 않았습니다. 플랫폼 관리자가 승인 명단을 등록한 뒤 가입할 수 있습니다. 담당자에게 문의해 주세요.'
          : '플랫폼 관리자의 승인을 받은 분만 가입할 수 있습니다. 승인 명단에 등록된 아이디·이메일 또는 사번으로 가입하거나 담당자에게 문의해 주세요.';
        AUTH.busy = false; return render();
      }
      if(ap.hit.name && !AUTH.name.trim()) AUTH.name = ap.hit.name;
      res = await DB.memberSignUp(AUTH.name, email, AUTH.pw, AUTH.company, profile, AUTH.phone.trim(), String(AUTH.empno).trim());
      AUTH.rrnF = ''; AUTH.rrnG = '';
      if(res.ok && res.needConfirm){
        AUTH.busy=false; AUTH.mode='login'; AUTH.pw=''; AUTH.pw2='';
        AUTH.msg = '가입 확인 메일을 보냈습니다. 메일에서 인증 후 로그인해 주세요.';
        return render();
      }
    }else{
      res = await DB.memberSignIn(email, AUTH.pw, AUTH.company);
    }

    if(!res.ok){ AUTH.msg = res.msg || '처리에 실패했습니다.'; AUTH.busy=false; return render(); }

    // '로그인 상태 유지'를 끄면 브라우저를 닫을 때 로그아웃되도록 표시해 둡니다.
    rememberSession(AUTH.keep);

    // 로그인 성공 — 앞 사람의 자료를 먼저 비우고 새로 채웁니다.
    resetUserData();
    S.auth.user = res.user;
    AUTH.pw = ''; AUTH.pw2 = ''; AUTH.msg = ''; AUTH.busy = false;
    // 예약 폼에 로그인 정보 자동 반영
    S.form.name = res.user.name;

    if(res.user.company){
      // 회사까지 연결된 사용자는 예약 목록도 바로 채웁니다.
      // (이걸 빠뜨리면 무언가를 눌러야 목록이 나타납니다)
      await loadMine();
    }else{
      MG.state = 'empty';
    }
    await loadTaken();
    render(); window.scrollTo(0,0);
  }catch(e){
    console.error(e); AUTH.msg = '오류가 발생했습니다. 잠시 후 다시 시도해 주세요.'; AUTH.busy = false; render();
  }
};

/* '로그인 상태 유지' 처리.
   유지를 끄면 sessionStorage 에만 표시를 남깁니다.
   브라우저(탭)를 닫으면 그 표시가 사라지므로, 다음에 열 때 로그아웃됩니다. */
function rememberSession(keep){
  try{
    if(keep){ KSTORE.setItem('authKeep', '1'); sessionStorage.setItem('authAlive', '1'); }
    else    { KSTORE.removeItem('authKeep'); sessionStorage.setItem('authAlive', '1'); }
  }catch(e){ /* 저장을 막아 둔 브라우저에서는 그냥 넘어갑니다 */ }
}
function sessionAlive(){
  try{
    if(KSTORE.getItem('authKeep') === '1') return true;   // 유지를 켰으면 그대로
    return sessionStorage.getItem('authAlive') === '1';         // 같은 탭에서만 유효
  }catch(e){ return true; }
}

  S.auth.user = null;

// 모든 프로그램의 상담 문항을 중복 없이 모읍니다 (CSV 열 구성용)
function allIntakeQs(){
  const seen = new Set(); const out = [];
  PROGRAMS.forEach(p => intakeFor(p.id).forEach(q => {
    if(!seen.has(q.id)){ seen.add(q.id); out.push(q); }
  }));
  return out;
}

// CSV 내보내기 — 전체용·사전상담용이 같은 코드를 함께 씁니다.
const csvCell = v => {
  if(v===null || v===undefined) return '';
  if(Array.isArray(v)) v = v.join(' / ');
  const s = String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
};

function downloadCSV(name, lines){
  // 엑셀에서 한글이 깨지지 않도록 UTF-8 BOM 추가
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${name}_${iso(new Date())}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// kind: 'all' 전체(사전상담+피드백) · 'intake' 사전상담만
window.exportCSV = (kind='all') => {
  const intakeOnly = (kind==='intake');
  const rows = intakeOnly
    ? adminRows().filter(r => r.intake && Object.keys(r.intake).length)
    : adminRows();
  const cols = intakeOnly
    ? ['company','code','program','name','email','phone','slot_date','slot_time','status','memo']
    : ['company','code','program','name','email','phone','dept','slot_date','slot_time','status','memo','created_at'];
  const qs   = allIntakeQs();
  const head = [...cols,
    ...qs.map(q => '상담:'+q.q),
    ...(intakeOnly ? [] : SURVEY.map(q => '피드백:'+q.q))];
  const lines = [head.map(csvCell).join(',')];
  for(const r of rows){
    lines.push([
      ...cols.map(c => c==='company' ? csvCell(companyName(r.company))
                     : c==='program' ? csvCell(programById(r.program).name)
                     : csvCell(r[c])),
      ...qs.map(q => {
        const val = r.intake?.[q.id];
        const etc = r.intake?.[q.id + '_etc'];
        if(etc && String(etc).trim()){
          const arr = Array.isArray(val) ? val : (val ? [val] : []);
          return csvCell(arr.map(o => o === '기타' ? `기타(${etc})` : o));
        }
        return csvCell(val);
      }),
      ...(intakeOnly ? [] : SURVEY.map(q => csvCell(r.survey?.[q.id]))),
    ].join(','));
  }
  downloadCSV(intakeOnly ? '사전상담응답' : '웰니스신청', lines);
};

/* 사이드바 트리 */
function navTree(items, cur, roleKey){
  return items.map(it => {
    const kids = it.kids || [];
    const on = cur === it.id || kids.some(k => k.id === cur);
    const target = kids.length ? kids[0].id : it.id;
    return `<div class="snav-group">
      <button class="snav-item ${on?'on':''}" onclick="navGo('${roleKey}','${target}')">
        ${ico(it.icon,'snav-ico')}<span>${esc(it.label)}</span>
      </button>
      ${kids.length && on ? `<div class="snav-sub">
        ${kids.map(k => `<button class="snav-kid ${cur===k.id?'on':''}"
           onclick="navGo('${roleKey}','${k.id}')">${esc(k.label)}</button>`).join('')}
      </div>` : ''}
    </div>`;
  }).join('');
}

/* 모바일용 가로 칩 (모든 하위 항목을 평평하게 펼침) */
function navChips(items, cur, roleKey){
  const flat = [];
  items.forEach(it => {
    if(it.kids) it.kids.forEach(k => flat.push(k));
    else flat.push(it);
  });
  return `<div class="snav-chips">${flat.map(f =>
    `<button class="snav-chip ${cur===f.id?'on':''}" onclick="navGo('${roleKey}','${f.id}')">${esc(f.label)}</button>`
  ).join('')}</div>`;
}

/* 예약 행 → 임직원 단위로 묶기 */
function peopleFrom(rows){
  const map = new Map();
  rows.forEach(r => {
    const key = (r.email || r.name || '?').toLowerCase();
    if(!map.has(key)) map.set(key, {
      key, name:r.name || '이름 없음', email:r.email || '', dept:(r.dept || r.intake?.dept || '미지정'),
      company:r.company || '', rows:[], last:'',
    });
    const p = map.get(key);
    p.rows.push(r);
    const dp = r.dept || r.intake?.dept; if(dp) p.dept = dp;
    if((r.slot_date||'') > p.last) p.last = r.slot_date || '';
  });
  return [...map.values()].map(p => {
    const active = p.rows.filter(r => r.status !== 'canceled');
    const done   = p.rows.filter(r => r.status === 'done');
    const scores = p.rows.filter(r => r.survey && typeof r.survey.overall === 'number')
                         .map(r => r.survey.overall);
    return {...p,
      total: p.rows.length, active: active.length, done: done.length,
      sat: scores.length ? scores.reduce((a,b)=>a+b,0)/scores.length : null };
  }).sort((a,b) => b.total - a.total || a.name.localeCompare(b.name));
}

/* 운동처방사 목록 — 프로그램에 등록된 담당자를 기준으로 모읍니다. */
function trainersFrom(rows){
  // 같은 사람이 프로그램마다 다른 직함으로 적혀 있어도 한 명으로 묶습니다.
  const map = new Map();
  PROGRAMS.forEach(p => {
    // 한 프로그램을 여러 명이 맡을 수 있으므로 담당자마다 한 줄씩 만듭니다.
    programHosts(p).forEach(tr => {
      if(!map.has(tr.name))
        map.set(tr.name, {name:tr.name, roles:new Set(), programs:[], n:0, sat:[], places:new Set()});
      const t = map.get(tr.name);
      t.roles.add(tr.role || p.role);
      t.programs.push(p);
      t.places.add(p.location);
    });
  });
  rows.forEach(r => {
    const t = map.get(trKey(programById(r.program), r));
    if(!t) return;
    if(r.status !== 'canceled') t.n++;
    if(r.survey && typeof r.survey.overall === 'number') t.sat.push(r.survey.overall);
  });
  return [...map.values()].map(t => ({...t,
    role: [...t.roles].join(' · '),
    avg: t.sat.length ? (t.sat.reduce((a,b)=>a+b,0)/t.sat.length) : null,
  })).sort((a,b) => b.n - a.n || a.name.localeCompare(b.name));
}

   '일' 보기에서는 예약이 없는 시간도 빠짐없이 보여 주기 위해 씁니다. */
function programHourRange(){
  let lo = 24*60, hi = 0;
  PROGRAMS.forEach(p => (p.slots || []).forEach(t => {
    const [hh, mm] = String(t).split(':').map(Number);
    const s = hh*60 + mm;
    lo = Math.min(lo, s);
    hi = Math.max(hi, s + (p.durationMin || 60));
  }));
  if(lo > hi) return {lo: 9*60, hi: 19*60};
  return {lo, hi};
}

/* 같은 운동처방사가 같은 시간에 여러 명을 맡으면 한 칸으로 묶습니다.
   (칸을 쪼개지 않고, 한 칸 안에 임직원 이름을 여러 줄로 보여 줍니다) */
function trMergeSameSlot(evs){
  const map = new Map();
  evs.forEach(ev => {
    const k = ev.key + '|' + ev.s + '|' + ev.e;
    if(!map.has(k)) map.set(k, {...ev, mates: [ev]});
    else map.get(k).mates.push(ev);
  });
  return [...map.values()];
}

/* 같은 시간대가 겹치면 나란히 놓기.
   서로 맞물린 무리(cluster)끼리만 폭을 나눠서, 혼자 있는 일정은 칸을 다 쓰게 합니다. */
function trLayout(evs){
  const sorted = trMergeSameSlot(evs).sort((a,b) => a.s - b.s || a.e - b.e);
  let cluster = [], clusterEnd = -1;

  const flush = () => {
    if(!cluster.length) return;
    const lanes = [];
    cluster.forEach(ev => {
      let placed = false;
      for(let i = 0; i < lanes.length; i++){
        if(lanes[i][lanes[i].length-1].e <= ev.s){ lanes[i].push(ev); ev.lane = i; placed = true; break; }
      }
      if(!placed){ ev.lane = lanes.length; lanes.push([ev]); }
    });
    const n = Math.max(1, lanes.length);
    cluster.forEach(ev => ev.lanes = n);
    cluster = [];
  };

  sorted.forEach(ev => {
    if(cluster.length && ev.s >= clusterEnd) flush();
    cluster.push(ev);
    clusterEnd = cluster.length === 1 ? ev.e : Math.max(clusterEnd, ev.e);
  });
  flush();
  return sorted;
}

            <span class="tritem-r">${esc(t.role)}</span></span>
          <span class="tritem-c">${n}<small>건</small></span>
        </button>
        <button type="button" class="trcolor" title="${esc(t.name)} 색상 바꾸기"
                onclick="openColorPick('${esc(k)}')">${ico('palette','')}</button>
        ${TR_PICK === k ? colorPaletteHTML(k, colorOf[k]) : ''}
      </div>`;
    }).join('')}
    <div class="trcolor-a">
      <button class="mini nowrap" onclick="saveTrainerColors()">색상 저장</button>
      <span>달력·목록에 함께 적용</span>
    </div>
  </div>`;
}

/* 시간표 — 열(column)은 날짜일 수도, 운동처방사일 수도 있습니다.
   cols: [{head, evs, today, weekend}] */
function trTimeGrid(cols, colorOf, minCol, showNowLine, fullDay){
  const evs = cols.flatMap(c => c.evs);
  // 표시할 시간 범위.
  //   fullDay: 프로그램 운영 시간대를 통째로 (예약이 없는 시간도 보여 줍니다)
  //   그 외   : 일정이 있는 만큼만, 없으면 09~19시
  let lo = 9*60, hi = 19*60;
  if(fullDay){
    const r = programHourRange();
    lo = r.lo; hi = r.hi;
  }else if(evs.length){
    lo = Math.min(...evs.map(e => e.s));
    hi = Math.max(...evs.map(e => e.e));
  }
  if(evs.length){
    lo = Math.min(lo, ...evs.map(e => e.s));
    hi = Math.max(hi, ...evs.map(e => e.e));
  }
  const h0 = Math.max(0, Math.floor(lo/60) - 1);
  const h1 = Math.min(24, Math.ceil(hi/60) + 1);
  const hours = [];
  for(let x = h0; x < h1; x++) hours.push(x);
  const ROW = TR_ROW;
  const GUT = 72;
  const tmpl = `${GUT}px repeat(${cols.length}, minmax(${minCol}px, 1fr))`;
  const minW = GUT + cols.length * minCol;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();
  const nowOn = showNowLine && nowMin >= h0*60 && nowMin <= h1*60;

  const head = `<div class="trhead" style="grid-template-columns:${tmpl};min-width:${minW}px">
    <div class="trhead-g"></div>
    ${cols.map(c => c.head).join('')}
  </div>`;

  const gutter = `<div>${hours.map(x => `<div class="trgut-h">${pad(x)}:00</div>`).join('')}</div>`;

  const body = cols.map(c => {
    const laid = trLayout(c.evs);
    return `<div class="trcol ${c.weekend?'weekend':''}">
      ${hours.map(() => `<div class="trcol-h"></div>`).join('')}
      ${(nowOn && c.today) ? `<div class="trnow" style="top:${(nowMin - h0*60)/60*ROW}px"></div>` : ''}
      ${laid.map(ev => {
        const top = (ev.s - h0*60) / 60 * ROW;
        // 이름 줄 수에 맞춰 최소 높이를 늘려, 인원이 많아도 잘리지 않게 합니다.
        const rows = Math.ceil(((ev.mates || [ev]).length) / 2);
        const need = 20 + rows * 16;
        const hgt = Math.max(need, (ev.e - ev.s) / 60 * ROW - 3);
        const w   = 100 / ev.lanes;
        const col = colorOf[ev.key] || 'var(--accent)';
        const t1  = `${pad(Math.floor(ev.s/60))}:${pad(ev.s%60)}`;
        const t2  = `${pad(Math.floor(ev.e/60))}:${pad(ev.e%60)}`;
        // 칸 너비에 맞춰 보여줄 내용을 줄입니다. 글자가 중간에 잘리지 않게 합니다.
        // 겹치는 일정이 있으면 칸을 나눠 쓰므로 글자 크기를 줄입니다.
        const size = ev.lanes >= 3 ? 'narrow' : ev.lanes === 2 ? 'mid' : 'wide';
        // 시각은 왼쪽 시간 줄에서 이미 보이므로 블록 안에는 넣지 않습니다.
        // 한 시간대에 운동처방사 한 명이 한 건만 맡으므로 이름 두 줄이면 충분합니다.
        const who  = ev.key || '';
        const mates = ev.mates || [ev];
        const emps = mates.map(m => (m.row && m.row.name) || '').filter(Boolean);
        // 이름을 세로로 쌓으면 인원이 많을 때 칸 밖으로 잘립니다.
        // 가로로 이어 붙이고, 넘치면 줄바꿈합니다.
        const inner = `<div class="trev-t">${esc(who)}${
                        emps.length > 1 ? ` <em>${emps.length}명</em>` : ''}</div>`
                    + (emps.length ? `<div class="trev-emps">${
                        emps.map(e => `<span>${esc(e)}</span>`).join('')}</div>` : '');
        // left/right 를 함께 지정해 칸 안에서만 그려지도록 고정합니다.
        const l = ev.lane * w, r = 100 - (ev.lane + 1) * w;
        return `<div class="trev ${size==='wide'?'':size}"
          style="top:${top}px;height:${hgt}px;left:calc(${l}% + 2px);right:calc(${r}% + 2px);
                 border-left-color:${col};background:${col}14;color:${col}"
          title="${esc(who)}\n${t1}~${t2}\n${emps.map(esc).join(', ')}\n${esc(ev.prog.name)}">
          ${inner}
        </div>`;
      }).join('')}
    </div>`;
  }).join('');

  return `<div class="trcal"><div class="trscroll">
    ${head}
    <div class="trbody" style="grid-template-columns:${tmpl};min-width:${minW}px">${gutter}${body}</div>
  </div></div>`;
}

/* 날짜별 열 (주 보기) */
function trDateCols(evs, days, colorOf){
  const todayIso = iso(new Date());
  return days.map(d => {
    const ds = iso(d), on = ds === todayIso;
    const dayEvs = evs.filter(e => e.date === ds);

    // 그 날 들어오는 운동처방사를 요일 아래에 함께 적습니다.
    const cnt = new Map();
    dayEvs.forEach(e => cnt.set(e.key, (cnt.get(e.key) || 0) + 1));
    const who = [...cnt.entries()].sort((a,b) => b[1] - a[1] || a[0].localeCompare(b[0]));

    return {
      today: on,
      weekend: [0,6].includes(d.getDay()),
      evs: dayEvs,
      head: `<div class="trhead-c ${on?'today':''}">
        <div class="trhead-n">${d.getDate()}</div>
        <div class="trhead-d">${['일','월','화','수','목','금','토'][d.getDay()]}</div>
        ${who.length ? `<div class="trhead-who-list">
          ${who.map(([k, n]) => `<span class="trwho"
             style="background:${(colorOf&&colorOf[k])||'var(--accent)'}1c;color:${(colorOf&&colorOf[k])||'var(--accent)'}">
             ${esc(k)}${n > 1 ? ` ${n}` : ''}</span>`).join('')}
        </div>` : `<div class="trhead-who-none">–</div>`}
      </div>`,
    };
  });
}

/* 운동처방사별 열 (일 보기) — 겹쳐도 각자 자기 열을 쓰므로 글자가 잘리지 않습니다. */
function trPersonCols(evs, list, colorOf, isToday){
  let names = S.nav.trTrainer === 'all'
    ? list.filter(t => evs.some(e => e.key === t.name)).map(t => t.name)
    : [S.nav.trTrainer];
  if(!names.length) names = list.slice(0, 5).map(t => t.name);
  return names.map(n => {
    const t = list.find(x => x.name === n) || {name:n, role:''};
    const mine = evs.filter(e => e.key === n);
    const col = colorOf[n] || 'var(--accent)';
    return {
      today: isToday, weekend: false, evs: mine,
      head: `<div class="trhead-c who">
        <div class="trhead-who">
          <span class="trdot" style="background:${col}"></span>
          <span class="trhead-wn">${esc(t.name)}</span>
          <span class="trhead-wc">${mine.length}건</span>
        </div>
        <div class="trhead-wr">${esc(t.role || '')}</div>
      </div>`,
    };
  });
}

/* 월간 보기 */
function trMonthGrid(evs, colorOf){
  const c = S.nav.trCursor;
  const y = c.getFullYear(), m = c.getMonth();
  const start = new Date(y, m, 1).getDay();
  const days  = new Date(y, m+1, 0).getDate();
  const todayIso = iso(new Date());
  const byDate = new Map();
  evs.forEach(e => {
    if(!byDate.has(e.date)) byDate.set(e.date, []);
    byDate.get(e.date).push(e);
  });
  const cells = [];
  for(let i = 0; i < start; i++) cells.push(`<div class="mcal-c off"></div>`);
  for(let d = 1; d <= days; d++){
    const ds = `${y}-${pad(m+1)}-${pad(d)}`;
    const list = (byDate.get(ds) || []).sort((a,b) => a.s - b.s);

    // 그 날 들어오는 운동처방사별로 묶습니다. 몇 건이든 사람은 빠짐없이 나옵니다.
    const byWho = new Map();
    list.forEach(e => {
      if(!byWho.has(e.key)) byWho.set(e.key, []);
      byWho.get(e.key).push(e);
    });
    const who = [...byWho.entries()].sort((a,b) => b[1].length - a[1].length
                                              || a[1][0].s - b[1][0].s);

    cells.push(`<div class="mcal-c ${ds===todayIso?'today':''}"
        onclick="trPickDay('${ds}')" style="cursor:pointer">
      <div class="mcal-d">${d}</div>
      ${who.map(([k, evs]) => {
        const col = colorOf[k] || 'var(--accent)';
        const sorted = evs.slice().sort((a,b) => a.s - b.s);
        // 몇 건인지가 아니라 몇 시에 들어오는지를 보여 줍니다.
        const byTime = new Map();
        sorted.forEach(e => {
          const t = `${pad(Math.floor(e.s/60))}:${pad(e.s%60)}`;
          if(!byTime.has(t)) byTime.set(t, []);
          byTime.get(t).push((e.row && e.row.name) || '');
        });
        const lineOf = ([t, names]) => `${t} ${names.filter(Boolean).join(', ')}`.trim();
        const tip = sorted.map(e =>
          `${pad(Math.floor(e.s/60))}:${pad(e.s%60)} ${(e.row && e.row.name) || ''} · ${e.prog.name}`).join('\n');
        return `<div class="mtr" style="background:${col}18;color:${col}"
          title="${esc(k)}&#10;${esc(tip)}">
          <span class="mtr-n">${esc(k)}</span>
          <span class="mtr-c">${[...byTime.entries()].map(x => esc(lineOf(x))).join('<br>')}</span>
        </div>`;
      }).join('')}
    </div>`);
  }
  return `<div class="trcal" style="padding:10px">
    <div class="mcal" style="margin-top:0">
      ${['일','월','화','수','목','금','토'].map(d=>`<div class="mcal-h">${d}</div>`).join('')}
      ${cells.join('')}
    </div>
  </div>`;
}

function trainerPane(scopeRows){
  const all  = scopeRows || [];
  const list = trainersFrom(all);
  const colorOf = {};
  // 직접 정한 색이 있으면 그 색을 씁니다.
  list.forEach((t,i) => colorOf[t.name] =
    TR_COLOR_SET[t.name] || TR_COLORS[i % TR_COLORS.length]);

  const allEvs = trEvents(all);
  const {from, to} = trRange();
  const f = iso(from), t2 = iso(to);
  const inRange = allEvs.filter(e => e.date >= f && e.date <= t2);
  const shown = S.nav.trTrainer === 'all'
    ? inRange : inRange.filter(e => e.key === S.nav.trTrainer);

  // 보기 기간의 날짜 목록
  const days = [];
  if(S.nav.trView !== 'month'){
    const n = S.nav.trView === 'day' ? 1 : 7;
    for(let i = 0; i < n; i++){
      const d = new Date(from); d.setDate(d.getDate() + i); days.push(d);
    }
  }

  const rangeLabel = S.nav.trView === 'day'
    ? `${from.getFullYear()}년 ${from.getMonth()+1}월 ${from.getDate()}일`
    : S.nav.trView === 'week'
      ? `${from.getMonth()+1}월 ${from.getDate()}일 — ${to.getMonth()+1}월 ${to.getDate()}일`
      : `${from.getFullYear()}년 ${from.getMonth()+1}월`;

  const bar = `<div class="trbar">
    <div class="trseg">
      ${[['day','일'],['week','주'],['month','월']].map(([k,l]) =>
        `<button class="${S.nav.trView===k?'on':''}" onclick="trSetView('${k}')">${l}</button>`).join('')}
    </div>
    <button class="trnav" onclick="trMove(-1)">‹</button>
    <button class="trnav" onclick="trMove(1)">›</button>
    <button class="trtoday" onclick="trToday()">오늘</button>
    <span class="trrange">${rangeLabel}</span>
    <span class="trcount">표시 중 <b>${shown.length}</b>건${
      S.nav.trTrainer==='all' ? '' : ` · ${esc(S.nav.trTrainer)}`}</span>
  </div>`;

  // 일 보기는 운동처방사별로 열을 나눠 겹침 없이 넓게 보여 줍니다.
  const isToday = iso(from) === iso(new Date());
  const grid = S.nav.trView === 'month'
    ? trMonthGrid(shown, colorOf)
    : S.nav.trView === 'day'
      ? trTimeGrid(trPersonCols(shown, list, colorOf, isToday), colorOf, 200, isToday, true)
      : trTimeGrid(trDateCols(shown, days, colorOf), colorOf, 120, true);

  return `<div class="trwrap">
    <div class="trside">
      ${trMiniCal(allEvs)}
      ${trSidePanel(list, colorOf, inRange)}
    </div>
    <div class="trmain">
      ${bar}
      ${shown.length === 0 && S.nav.trView !== 'month'
        ? `<div class="trcal"><div class="trempty">
             이 기간에는 예약이 없습니다.${S.nav.trTrainer!=='all'?' 다른 운동처방사를 선택해 보세요.':''}
           </div></div>`
        : grid}
      ${S.nav.trView === 'week' && shown.some(e => e.lanes >= 3)
        ? `<div class="trhint">같은 시간에 3건 이상 겹치는 날은 칸이 좁아 시각만 표시됩니다.
             날짜를 누르거나 <b>일</b> 보기로 바꾸면 운동처방사별로 나눠서 넓게 볼 수 있습니다.</div>`
        : ''}
    </div>
  </div>`;
}

/* ------------------------------------------------------------
   운동처방사 상세 — 담당 프로그램별 예약까지 나눠서 봅니다.
   ------------------------------------------------------------ */
function trainerDetail(scopeRows, colorOf){
  const rows = (scopeRows || []).filter(r => r.status !== 'canceled');

  // 위쪽 배정 칸(1번·2번·3번 담당)과 같은 순서로 늘어놓습니다.
  // trainersFrom 은 예약이 많은 순으로 주기 때문에 그대로 쓰면 순서가 어긋납니다.
  const order = ALL_HOSTS();
  const rank = nm => { const i = order.indexOf(nm); return i < 0 ? 99 : i; };
  const list = trainersFrom(scopeRows || []).slice()
    .sort((a, b) => rank(a.name) - rank(b.name) || a.name.localeCompare(b.name));
  const cntByProgram = {};
  rows.forEach(r => { cntByProgram[r.program] = (cntByProgram[r.program] || 0) + 1; });

  return `<div class="trdgrid">
    ${list.map(t => {
      const col = colorOf[t.name] || 'var(--accent)';
      const progs = t.programs.slice().sort((a,b) =>
        (cntByProgram[b.id]||0) - (cntByProgram[a.id]||0));
      // 예약에 적힌 담당자 기준으로 셉니다. (프로그램 대표 담당자가 아니라)
      const done = rows.filter(r => trKey(programById(r.program), r) === t.name
                                 && r.status === 'done').length;
      const slotNo = order.indexOf(t.name) + 1;
      const p = trainerProfile(t.name);
      const yrs = careerYears(t.name);
      return `<div class="trdcard">
        <div class="trdhead">
          <div class="trdav" style="background:${col}1f;color:${col}">${esc(t.name.slice(0,1))}</div>
          <div style="flex:1;min-width:0">
            <div class="trdname">${esc(t.name)}
              ${slotNo ? `<span class="trdslot">${slotNo}번 담당</span>` : ''}
              ${yrs ? `<span class="trdyrs">${yrs}년차</span>` : ''}</div>
            <div class="trdrole">${esc(t.role)}${p.edu ? ' · ' + esc(p.edu) : ''}</div>
          </div>
        </div>
        <div class="trdstats">
          <div class="trdstat"><div class="trdstat-v">${t.n}</div><div class="trdstat-l">담당 세션</div></div>
          <div class="trdstat"><div class="trdstat-v">${done}</div><div class="trdstat-l">이용 완료</div></div>
          <div class="trdstat"><div class="trdstat-v">${t.avg ? '★'+t.avg.toFixed(1) : '–'}</div>
            <div class="trdstat-l">평균 만족도</div></div>
        </div>
        <div class="trdbody">
          ${p.intro ? `<div class="trdintro">${esc(p.intro)}</div>` : ''}
          ${p.career.length ? `<div class="trdsec">경력</div>
            <div class="trdcareer">${p.career.map(([when, what]) => `<div class="trdcar">
              <span class="trdcar-w">${esc(when)}</span>
              <span class="trdcar-t">${esc(what)}</span></div>`).join('')}</div>` : ''}
          ${p.certs.length ? `<div class="trdsec" style="margin-top:12px">자격</div>
            <div class="trdchips">${p.certs.map(c=>`<span class="trdchip">${esc(c)}</span>`).join('')}</div>` : ''}
          ${p.spec.length ? `<div class="trdsec" style="margin-top:12px">전문 분야</div>
            <div class="trdchips">${p.spec.map(c=>`<span class="trdchip alt">${esc(c)}</span>`).join('')}</div>` : ''}
          <div class="trdsec" style="margin-top:12px">담당 프로그램 ${t.programs.length}개</div>
          ${progs.map(p => `<div class="trdprog">
            <span class="trdprog-n">${esc(p.name)}</span>
            <span class="trdprog-c">${cntByProgram[p.id] || 0}건</span>
          </div>`).join('')}
          <div class="trdplace">${ico('place','snav-ico')} ${[...t.places].map(esc).join(' · ')}</div>
          ${trainerDocHTML(t.name)}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

/* ------------------------------------------------------------
   운동처방사 관리 — 왼쪽 메뉴에서 고른 화면을 그립니다.
   which: 'cal'(세션 현황) | 'detail'(운동처방사 상세)
   ------------------------------------------------------------ */
/* 프로그램별 담당 운동처방사 배정 · 경력 PDF 화면 */

    return `<div class="card" style="margin-bottom:16px">

        <span class="card-sub">${cur.length}명 · 같은 시간에 ${cur.length}명까지 받습니다</span></div>

      <div class="trslots">${cur.map((t, i) => {
        return `<div class="trslot">
          <div class="trslot-h">
            <span class="trslot-n">${i + 1}번 담당</span>
            <select onchange="if(this.value==='__new'){openNewTrainer('${esc(p.id)}','${esc(t.name)}')}
                              else{replaceProgramHost('${esc(p.id)}','${esc(t.name)}',this.value)}">
              ${pool.map(nm => `<option value="${esc(nm)}" ${nm === t.name ? 'selected' : ''}
                ${cur.some(x => x.name === nm) && nm !== t.name ? 'disabled' : ''}>${esc(nm)}</option>`).join('')}
              <option value="__new">+ 새 운동처방사 직접 입력</option>
            </select>
            <span class="trslot-x">
              <button type="button" class="mini" title="이 프로그램 배정만 해제"
                      onclick="unassignProgramHost('${esc(p.id)}','${esc(t.name)}')">배정 해제</button>
              <button type="button" class="mini danger" title="운동처방사 목록에서 삭제"
                      onclick="deleteTrainer('${esc(t.name)}')">${ico('delete','')} 삭제</button>
            </span>
          </div>
          ${TR_NEW[p.id + '|' + t.name] !== undefined ? `<div class="trnew">
            <input type="text" class="trnew-in" placeholder="새 운동처방사 이름"
                   value="${esc(TR_NEW[p.id + '|' + t.name])}"
                   oninput="setNewTrainer('${esc(p.id)}','${esc(t.name)}',this.value)"

        const ym = m => m ? m.replace('-', '.') : '';
        const period = months.length ? (months[0] === months[months.length-1] ? ym(months[0]) : `${ym(months[0])} ~ ${ym(months[months.length-1])}`) : '–';
        const people = new Set(rows.map(r => (r.email || '').toLowerCase()).filter(Boolean)).size;
        const done = rows.filter(r => r.status === 'done').length;
        return `<div class="prt-facts">

          <div><span>신청 / 이용 완료</span><b>${rows.length}건 / ${done}건</b></div>

    <footer class="prt-foot">© ${now.getFullYear()} ${esc(CONFIG.company)} · 임직원 웰니스 리포트 · 외부 공유 시 회사 정책을 따라 주세요.</footer>`;
  document.body.appendChild(box);
  const fname = `${name}_대시보드_${now.toISOString().slice(0,10)}`.replace(/[\\/:*?"<>|]/g, '_') + '.pdf';

  // ① html2pdf(jsPDF + html2canvas) 가 있으면 바로 파일로 저장 — v154: 페이지를 직접 나눕니다.
  //    · 가로 A4, 화면 대시보드와 같은 폭(1180px)으로 그려 카드 배치가 화면과 같습니다.
  //    · 각 섹션(운영 요약·참여 현황·만족도·건강 리포트)은 새 페이지에서 시작합니다.
  //    · 페이지 경계가 카드 중간에 걸리면 카드 위에서 자릅니다.
  const lib = await ensureHtml2pdf();
  if(lib){
    document.getElementById('pdfwrap')?.remove();
    const wrap = document.createElement('div'); wrap.id = 'pdfwrap';
    box.classList.add('pdfmode'); box.remove(); wrap.appendChild(box); document.body.appendChild(wrap);
    document.body.classList.add('pdfbusy');
    try{   // 참여 현황 섹션: 도넛 2장 | 완료율 + 부서별 상세 로 두 칸 배치 (한 쪽에 들어가게)
      const ppSec = box.querySelectorAll('.prt-sec')[1];
      const dg = ppSec && ppSec.querySelector('.dash-grid');
      if(dg){
        const after = []; let n = dg.nextElementSibling;
        while(n){ const nx = n.nextElementSibling; if(n.classList.contains('card')) after.push(n); n = nx; }
        if(after.length){
          const g = document.createElement('div'); g.className = 'pp-grid';
          const right = document.createElement('div'); right.className = 'pp-right';
          dg.parentNode.insertBefore(g, dg); g.appendChild(dg); after.forEach(c => right.appendChild(c)); g.appendChild(right);
        }
      }
    }catch(e){ console.error(e); }
    const cleanup = () => { wrap.remove(); document.body.classList.remove('pdfbusy'); };
    toast('PDF 만드는 중… 잠시만요.');
    setTimeout(async () => {
      try{
        // html2pdf 번들은 html2canvas·jsPDF 를 전역에 내놓지 않으므로 worker 를 통해 꺼내 씁니다.
        // 폭 312.2mm = 1180px(96dpi) 짜리 긴 페이지 하나로 그리게 해서, 화면과 같은 폭의 캔버스를 얻습니다.
        const SCALE = 2;
        const mark = document.createElement('div'); mark.style.cssText = 'height:6px;width:120px;background:#000;margin:0;padding:0';
        box.insertBefore(mark, box.firstChild);                      // 캔버스 안에서 상단 위치를 찾기 위한 표시
        const Hmm = Math.ceil((box.scrollHeight + 900) * 25.4 / 96);  // 내용 높이 + 여유 (html2pdf 가 위쪽에 여백을 두므로) · 너무 크면 브라우저가 캔버스를 비움
        const canvas = await lib().set({ margin: 0, pagebreak: { mode: [] },            // 자동 쪽나눔 끄기 (쪽은 아래에서 직접 나눔)
                                         jsPDF: { unit:'mm', format:[391.6, Hmm], orientation:'portrait' },   // 391.6mm = 1480px
                                         html2canvas: { scale: SCALE, useCORS: true, backgroundColor: '#ffffff', scrollX: 0, scrollY: 0,
                                                       windowWidth: window.innerWidth, windowHeight: window.innerHeight } })
                                  .from(box).toCanvas().get('canvas');
        // 표시(검은 막대 120×6px)가 캔버스 어디에 있는지 찾아 DOM 좌표 ↔ 캔버스 좌표 차이를 보정합니다 (세로·가로 모두)
        const cx = canvas.getContext('2d'); let markY = -1, markX = 0;
        {
          const SW = Math.min(canvas.width, 400 * SCALE), SH = Math.min(canvas.height, 1200 * SCALE);
          const strip = cx.getImageData(0, 0, SW, SH).data;
          const isBlack = (x, y) => { const i = (y * SW + x) * 4; return strip[i] < 50 && strip[i+1] < 50 && strip[i+2] < 50; };
          outer: for(let yy = 0; yy < SH; yy += 2){
            for(let xx = 0; xx < SW - 110 * SCALE; xx += 2){
              if(!isBlack(xx, yy)) continue;
              // 이 점부터 오른쪽으로 110px(×SCALE) 가 거의 다 검으면 막대
              let ok = 0, tot = 0; for(let k = 0; k < 110 * SCALE; k += 4){ tot++; if(isBlack(xx + k, yy)) ok++; }
              if(ok >= tot * 0.9){ markY = yy; markX = xx; break outer; }
              break;   // 이 행의 첫 검은 점이 막대가 아니면 다음 행
            }
          }
        }
        if(markY < 0) throw new Error('mark_not_found');            // 보정 불가 → 예전 방식으로
        const OFFX = markX / SCALE;                                  // 가로 오프셋(CSS px)
        const OFF = markY / SCALE;                                   // CSS px 단위 오프셋
        const W = box.offsetWidth;                                   // CSS px
        const seed = document.createElement('div'); seed.style.cssText = 'width:20px;height:20px;background:#fff'; seed.textContent = ' ';
        wrap.appendChild(seed);
        const pdf = await lib().set({ jsPDF: { unit:'mm', format:'a4', orientation:'landscape' }, html2canvas: { scale: 1 } })
                               .from(seed).toPdf().get('pdf');
        seed.remove();
        try{ pdf.deletePage(1); }catch(_){}                         // 씨앗 페이지 제거 → 아래에서 페이지를 하나씩 추가
        const PW = 297, PH = 210, M = 9, HEAD = 7;                  // 여백 · 상단 꼬리표 자리
        const cw = PW - M*2, ch = PH - M*2 - HEAD;
        const mmPerPx = cw / W;                                      // 폭을 페이지에 맞춤
        const pagePx = ch / mmPerPx;                                 // 한 페이지에 들어가는 높이(CSS px)
        const boxTop = box.getBoundingClientRect().top;
        const markH = mark.getBoundingClientRect().height + 4;
        const rel = el => { const r = el.getBoundingClientRect(); return {top: r.top - boxTop, bottom: r.bottom - boxTop}; };
        // 자르면 안 되는 덩어리 · 반드시 새 페이지에서 시작할 지점
        const total = Math.min(box.scrollHeight, [...box.querySelectorAll('*')].reduce((m, el) => { const r = el.getBoundingClientRect(); return r.height ? Math.max(m, r.bottom - boxTop) : m; }, 0) + 8);
        const secs = [...box.querySelectorAll('.prt-sec')];
        const groups = [];                                           // [y0, y1, label]
        // ① 표지 + 운영 요약의 첫 카드 행(신청 상태·이용 완료율·만족도 응답률)
        const firstRow = secs[0] && secs[0].querySelector('.dash-3');
        const sec0End = secs[1] ? rel(secs[1]).top : total;
        if(firstRow){
          const r = rel(firstRow);
          groups.push([markH, r.bottom + 6, '운영 요약']);
          groups.push([r.bottom + 6, sec0End, '한눈에 보기 · AI 종합 의견']);   // ② 한눈에 보기 + AI 의견
        } else groups.push([markH, sec0End, '운영 요약']);
        // ③④⑤ 나머지 섹션은 섹션 하나 = 한 쪽
        secs.slice(1).forEach((s, i) => { const t = rel(s).top; const e = secs[i + 2] ? rel(secs[i + 2]).top : total; groups.push([t, e, (s.querySelector('h2')||{}).textContent || '']); });
        const cuts = groups.filter(g => g[1] - g[0] > 20);
        cuts.forEach(([y0, y1], i) => {
          pdf.addPage();
          const sh = Math.round((y1 - y0) * SCALE);
          const sw = Math.round(W * SCALE);
          const c2 = document.createElement('canvas'); c2.width = sw; c2.height = sh;
          const ctx = c2.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, sw, sh);
          ctx.drawImage(canvas, Math.round(OFFX * SCALE), Math.round((y0 + OFF) * SCALE), sw, sh, 0, 0, sw, sh);
          const img = c2.toDataURL('image/jpeg', 0.94);
          // 쪽에 맞춤: 폭은 가득, 높이가 넘치면 비율을 유지해 줄이고 가운데 정렬
          const hmm = (y1 - y0) * mmPerPx;
          const k = Math.min(1, ch / hmm);
          const w = cw * k, h = hmm * k, x = M + (cw - w) / 2;
          pdf.setFontSize(8); pdf.setTextColor(140);
          try{ pdf.text(`Dashboard report · ${now.toISOString().slice(0,10)}`, M, M + 3); }catch(_){}
          try{ pdf.text(`${i+1} / ${cuts.length}`, PW - M, M + 3, {align:'right'}); }catch(_){}
          pdf.addImage(img, 'JPEG', x, M + HEAD, w, h);
        });
        pdf.save(fname);
        toast('PDF 파일로 저장했습니다.'); cleanup();
      }catch(e){
        console.error(e); cleanup();
        // 직접 분할이 안 되면 예전 방식(html2pdf 자동 분할)으로
        try{
          const wrap2 = document.createElement('div'); wrap2.id = 'pdfwrap'; wrap2.appendChild(box); document.body.appendChild(wrap2); document.body.classList.add('pdfbusy');
          await lib().set({ margin:[12,10,14,10], filename:fname, image:{type:'jpeg', quality:0.95},
            html2canvas:{scale:2, useCORS:true, backgroundColor:'#ffffff', scrollX:0, scrollY:-window.scrollY},
            jsPDF:{unit:'mm', format:'a4', orientation:'portrait'},
            pagebreak:{mode:['css','legacy'], before:'.brk', avoid:['.card','.kpi','table','.gauge-wrap']} }).from(box).save();
          toast('PDF 파일로 저장했습니다.'); wrap2.remove(); document.body.classList.remove('pdfbusy');
        }catch(e2){ console.error(e2); document.getElementById('pdfwrap')?.remove(); document.body.classList.remove('pdfbusy'); toast('PDF 생성에 실패해 인쇄창으로 엽니다.'); printFallback(); }
      }
    }, 150);
    return;
  }
  printFallback();

  // ② 없으면 인쇄창(대상: PDF 로 저장)
  function printFallback(){
    document.getElementById('coprint')?.remove();
    document.body.appendChild(box); box.classList.remove('pdfmode');
    document.body.classList.add('coprint');
    const prevTitle = document.title; document.title = fname.replace(/\.pdf$/, '');
    const done = () => { document.title = prevTitle; document.body.classList.remove('coprint'); box.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);
    setTimeout(() => { window.print(); setTimeout(done, 60000); }, 120);
  }
};

/* 내장된 html2pdf.js 를 처음 쓸 때 한 번만 로드합니다 (base64 → script). */
async function ensureHtml2pdf(){
  if(window.html2pdf) return window.html2pdf;
  const el = document.getElementById('h2p');
  if(el && el.dataset.b64){                                   // 단일 파일판: 내장된 코드 사용
    try{
      const code = decodeURIComponent(escape(atob(el.dataset.b64)));
      const sc = document.createElement('script'); sc.textContent = code; document.head.appendChild(sc);
      el.removeAttribute('data-b64');
      return window.html2pdf || null;
    }catch(e){ console.error(e); return null; }
  }
  const src = el && el.dataset.src;                           // v169 배포판: 'PDF 저장'을 누를 때만 내려받음
  if(!src) return null;
  toast('PDF 도구를 불러오는 중…');
  await new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); }).catch(e => console.error(e));
  return window.html2pdf || null;
}

/* ------------------------------------------------------------
   사전 상담 응답을 문항별 숫자로만 정리합니다. 이름은 담지 않습니다.
   ------------------------------------------------------------ */
function buildIntakeSummary(rows){
  const live = rows.filter(r => r.status !== 'canceled' && r.intake && Object.keys(r.intake).length);
  const qs = intakeQsFor([...new Set(rows.map(r => r.program))]);
  const out = { responses: live.length, consent: 0, questions: [] };

  live.forEach(r => { if((r.intake.consent || '') === '동의') out.consent++; });
  // 불편 부위 '없음'(또는 빈 응답) 인원 — 몸 상태 요약의 분모/분자에 씁니다
  out.injury_n    = live.filter(r => hasVal(r.intake.injury)).length;
  out.injury_none = live.filter(r => { const v = r.intake.injury; return !hasVal(v) || (Array.isArray(v) && v.every(x => x === '없음')); }).length;
  { let sum = 0, n = 0, high = 0;
    live.forEach(r => Object.values(r.intake.injury_vas || {}).forEach(v => { if(typeof v === 'number'){ sum += v; n++; if(v >= 4) high++; } }));
    out.vas = n ? { avg: sum / n, n, high } : null; }

  qs.forEach(q => {
    if(q.type === 'consent' || q.type === 'text') return;
    const item = { id:q.id, q:q.q, type:q.type };
    if(q.type === 'scale'){
      const vals = live.map(r => Number(r.intake[q.id])).filter(v => !isNaN(v) && v > 0);
      if(!vals.length) return;
      item.avg  = vals.reduce((a,b)=>a+b,0) / vals.length;
      item.hist = Array.from({length:10}, (_,i) => vals.filter(v => v === i+1).length);
      item.high = vals.filter(v => v >= 8).length;
      item.n    = vals.length;
    }else{
      const cnt = new Map();
      let n = 0;
      live.forEach(r => {
        const v = r.intake[q.id];
        if(!hasVal(v)) return;
        n++;
        (Array.isArray(v) ? v : [v]).forEach(x => cnt.set(x, (cnt.get(x) || 0) + 1));
      });
      if(!n) return;
      item.n = n;
      item.options = (q.options || [...cnt.keys()])
        .map(o => ({ label:o, n:cnt.get(o) || 0 }))
        .filter(o => o.n > 0)
        .sort((a,b) => b.n - a.n);
    }
    out.questions.push(item);
  });
  return out;
}

const CHART_COLORS = ['#4C5A82','#8FA3D9','#2E8B57','#4FB6C4','#3F6BD6',

/* 도넛 — 전체 중 각 항목이 차지하는 비중 */
function donutChart(items, opt = {}) {
  const total = items.reduce((a, b) => a + b.n, 0);
  if(!total) return `<div class="empty">아직 데이터가 없습니다.</div>`;
  const size = opt.size || 190, w = opt.width || 30;
  const r = (size - w) / 2, cx = size / 2, cy = size / 2, C = 2 * Math.PI * r;
  const gap = items.length > 1 ? 2 : 0;      // 조각 사이 틈
  let acc = 0;
  const arcs = items.map((it, i) => {
    const len = Math.max(0, C * it.n / total - gap);
    const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
      stroke="${it.color || chartColor(i)}" stroke-width="${w}"
      stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-acc}"
      stroke-linecap="${items.length > 1 ? 'butt' : 'round'}">
      <title>${esc(it.label)} ${it.n} (${Math.round(it.n/total*100)}%)</title></circle>`;
    acc += C * it.n / total;
    return seg;
  }).join('');

  const top = opt.centerTop !== undefined ? opt.centerTop
            : Math.round(items[0].n / total * 100) + '%';
  const sub = opt.centerSub !== undefined ? opt.centerSub : items[0].label;

  return `<div class="chart">
    <svg class="chart-svg" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#F0F1EA" stroke-width="${w}"/>
      <g transform="rotate(-90 ${cx} ${cy})">${arcs}</g>
      <text x="${cx}" y="${cy - 2}" text-anchor="middle"
            style="font-size:22px;font-weight:800;fill:var(--ink)">${esc(String(top))}</text>
      <text x="${cx}" y="${cy + 18}" text-anchor="middle"
            style="font-size:11.5px;fill:var(--muted)">${esc(String(sub))}</text>
    </svg>
    <div class="chart-legend">
      ${items.map((it, i) => `<div class="lg-row">
        <span class="lg-dot" style="background:${it.color || chartColor(i)}"></span>
        <span class="lg-name">${esc(it.label)}</span>
        <span class="lg-val">${it.n}${opt.unit || ''}</span>
        <span class="lg-pct">${Math.round(it.n / total * 100)}%</span>
      </div>`).join('')}
    </div>
  </div>`;
}

  /* ── 화면 폭에 따라 이어지는 크기 (320px 폰 ~ 태블릿) ──
     px 고정값 대신 clamp() 로 폭에 비례해 커지고 작아집니다. */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  @media(max-width:900px){
    .quickmenu{display:none!important}                      /* 탭바가 있는 폭에서는 플로팅 메뉴 숨김 */
    .emp-main{padding:clamp(10px,3vw,20px) clamp(10px,3.5vw,24px) 28px}

    .hs-t,.lgform-h{font-size:clamp(17px,4.6vw,24px)}
    .lgmain{padding:clamp(18px,4vw,32px) clamp(14px,4vw,28px) 40px}
    .lgside{min-height:clamp(150px,34vw,260px);max-height:clamp(170px,38vw,280px)}
    .gd{width:min(100%,460px)}
    .gd-h{font-size:clamp(16px,4.4vw,19px)}
    .prog-tags{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
    .hs-grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
    .emp-quick,.eh-q-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
    .dash-3,.sm-grid{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
    .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
    .shell-main{padding:clamp(10px,3vw,20px) clamp(10px,3vw,18px) 40px}
    .shell-h1{font-size:clamp(18px,4.6vw,24px)}
    .card{padding:clamp(12px,3.4vw,20px)}
    .calendar-grid td,.calendar-grid button{font-size:clamp(12px,3.4vw,14px)}
    .slotbtn{padding:clamp(8px,2.4vw,12px) 8px}
    .bmsvg{width:min(100%,420px)}
    .ebar{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  }
  /* 가로 모드 폰(높이가 낮을 때): 사진 더 낮게, 가이드 창은 스크롤 */
  @media(max-height:480px) and (max-width:900px){

    .gd{max-height:calc(100vh - 16px)}
  }

  @media(max-width:340px){

    .snav-chip{padding:6px 10px;font-size:12px}
  }

  /* ── v113 · 폰 전 기종 점검에서 나온 수정 ── */
  /* [1] 로그인·가입·회사연결·사전상담: 사진 안에 새겨진 문구("건강한 오늘이…")와 로고가 겹침
         → 폰에서는 로고를 사진 위 흰 띠에 두고, 사진은 그 아래 */
  @media(max-width:900px){
    .lgside{padding:0!important;min-height:0!important;max-height:none!important;display:block;background:#fff}
    .lgside-top{position:static;padding:10px 14px;background:#fff;border-bottom:1px solid #EEF1F5}
    .lgside-photo{position:static;display:block;width:100%;height:clamp(150px,36vw,240px);object-fit:cover;object-position:50% 22%}
    .lgwrap-wide .lgside-photo{object-position:40% 25%}
  }
  /* [2] 태블릿·폴드 펼침(701~900px): 하단 탭에 Home 이 있는데 오른쪽 위 Home 버튼이 소제목과 겹침 → 숨김 */
  @media(max-width:900px){ .emp-main .gohome{display:none!important} }
  /* [3] 시간 선택: 폰에서는 목록을 안쪽 스크롤 상자에 가두지 않고 그대로 펼침 (버튼 뒤로 목록이 숨던 문제) */
  @media(max-width:700px){
    #slotbox{max-height:none!important;overflow:visible!important;padding-right:0}
    #slotbox + div{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));background:#fff;padding-top:10px;padding-bottom:8px;
      margin-top:12px;box-shadow:0 -8px 12px -8px rgba(20,22,26,.12)}
  }
  /* [4] 회원가입 뒤로가기(둥근 화살표)가 좁은 폰(≤400px)에서 제목과 겹침 → 제목 오른쪽 여백 확보 */
  @media(max-width:700px){ .lgmain .lgback{top:14px;right:12px;width:34px;height:34px} .lgmain .lgform-h{padding-right:44px} }
  /* [5] 운영 설정의 QR 카드가 카드 폭보다 커서 오른쪽으로 삐져나감 */
  @media(max-width:700px){
    .qr-wrap{flex-direction:column;align-items:flex-start;gap:12px}
    .qr-wrap canvas,.qr-wrap img{max-width:100%;height:auto}
    .card{min-width:0}
    .card-h{flex-wrap:wrap;gap:4px 8px}
  }
  /* [6] 운동처방사 배정 줄: 이름 선택칸이 너무 좁아 이름이 잘림 → 선택칸을 한 줄 전체로, 버튼은 다음 줄 */
  @media(max-width:700px){
    .trslot-h{flex-wrap:wrap}
    .trslot-h select{flex:1 1 100%;min-width:0;order:1}
    .trslot-h .trslot-x{width:100%;margin-left:0;order:2;justify-content:flex-start}
  }
  /* [7] 관리자 상단 회사·메뉴 칩 줄: 넘치면 가로 스크롤(스크롤바 숨김, 손으로 밀기) + 오른쪽 끝 흐림 */
  @media(max-width:900px){
    .snav-chips,.cobar{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
    .snav-chips::-webkit-scrollbar,.cobar::-webkit-scrollbar{display:none}
    .cobar .cochip{white-space:nowrap;flex:none}
    .cobar .cobar-note{display:none}
  }
  /* [8] 긴 단어(이메일·코드)가 칸을 밀어내지 않게 · 표는 카드 안에서만 가로 스크롤 */
  @media(max-width:700px){
    .pm-who span,.mp-email,.lgdemo,.reco-target,.moti-meta{overflow-wrap:anywhere}
    .card:has(> table),.card:has(> .atable){overflow-x:auto}
  }
  /* [9] 아이콘 글꼴이 늦게 뜰 때 영문 이름(예: event_note)이 잠깐 보이는 것 방지 */
  .material-symbols-outlined{font-display:block;overflow:hidden;max-width:1.4em}
  /* [10] 폴드·플립 등 화면 폭이 바뀌는 기기: 폭이 바뀌면 배치를 다시 계산 */

  /* ── 모바일에서 글자 겹침·어긋남 수정 ── */
  @media(max-width:760px){
    /* 관리자 표: 세로로 풀지 말고 표 그대로 두고 가로 스크롤 */
    .card .atable,.card .atable tbody,.card .atable tr{display:table;width:100%}
    .card .atable{display:table;min-width:520px;border-collapse:collapse}
    .card .atable thead{display:table-header-group}
    .card .atable tbody{display:table-row-group}
    .card .atable tr{display:table-row;border:0;padding:0;margin:0;border-radius:0}
    .card .atable td,.card .atable th{display:table-cell;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  }
  @media(max-width:700px){
    .emp-main .gohome{display:none!important}              /* 하단 탭바에 Home 이 있음 — 제목과 겹치던 원형 버튼 제거 */
    .mp-email{white-space:normal;overflow:visible;line-height:1.45}
    .mp-head{align-items:flex-start}
    /* 가이드 창 준비 사항: 3열 격자 대신 세로 블록 (제목·설명 겹침 해결) */
    .gd-tips>div{display:flex!important;flex-wrap:wrap;align-items:baseline;gap:2px 6px;grid-template-columns:none!important}
    .gd-tips>div .material-symbols-outlined{position:static!important;flex:0 0 18px!important;align-self:center;padding:0!important}
    .gd-tips b{flex:none;white-space:normal;line-height:1.5}
    .gd-tips>div>span:not(.material-symbols-outlined){flex:1 1 100%!important;padding-left:24px;margin:0!important;line-height:1.5}
    /* 사전 상담·체크 보기: 긴 보기가 두 줄로 꺾이지 않게 */
    .lgqsec .grid.sm\\:grid-cols-2,.lgwrap-wide .lgqsec .grid.sm\\:grid-cols-2,
    .bookpage .grid.sm\\:grid-cols-2{grid-template-columns:1fr 1fr!important}
    .lgform .opt,.bookpage .opt{padding:11px 10px;font-size:14px;word-break:keep-all}
    .lgform .opt span,.bookpage .opt span{line-height:1.35}
    /* 신청 완료 티켓: 2열 → 1열 */
    .bookpage .grid.grid-cols-2{grid-template-columns:1fr}
    /* 프로그램 카드 제목·태그 */
    .prog-tag{font-size:11.5px;padding:5px 6px}
    /* 관리자 머리글: 제목 아래에 PDF 버튼 */
    .shell-head{flex-direction:column;align-items:flex-start;gap:8px}
    .shell-tools{margin-top:0}
  }
  @media(max-width:480px){
    .lgqsec .grid.sm\\:grid-cols-2,.lgwrap-wide .lgqsec .grid.sm\\:grid-cols-2,
    .bookpage .grid.sm\\:grid-cols-2{grid-template-columns:1fr!important}   /* 아주 좁으면 1열 */
    .hs-t{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  }

  /* ── 모바일(≤700px) 다듬기 ─────────────────────────────────
     화면 구조는 그대로 두고, 폰에서 거슬리는 부분만 정리합니다. */
  @media(max-width:700px){
    .quickmenu{display:none!important}                 /* 오른쪽 플로팅 메뉴는 폰에서 숨김 */
    .emp-main{padding:14px 12px 24px}
    .calmpage .pane{padding:0}
    .gohome{top:8px;right:8px;padding:5px 10px;font-size:11.5px}
    .eh-hero{padding:16px 14px}
    .eh-t{font-size:20px}
    .eh-next{flex-direction:column;align-items:stretch;gap:10px}
    .eh-cta{width:100%;text-align:center}
    .hs-grid{grid-template-columns:1fr}
    .hs-card img{height:150px}
    .hs-t{font-size:16px}
    .hs-guide{margin-left:6px}
    .eh-q-grid,.emp-quick{grid-template-columns:1fr 1fr}
    .prog-tags{grid-template-columns:1fr 1fr}
    .program-card>div:last-child button{padding:13px}
    /* 로그인·회사 연결·사전 상담: 사진은 짧게, 폼은 넓게 */
    .lgside{min-height:200px;max-height:220px}
    .lgside-photo{object-position:50% 25%}
    .lgmain{padding:22px 18px 40px}
    .lgform-h{font-size:22px}
    .lgqsec{padding:16px 14px 12px;border-radius:12px}
    .lgqsec .grid.sm\:grid-cols-2{grid-template-columns:1fr 1fr}
    .lgsteps{font-size:11px}
    .lgsteps-back{padding:4px 9px 4px 6px;font-size:11px}
    /* 입력칸 16px → iOS 자동 확대 방지 */
    input,select,textarea{font-size:16px!important}
    /* 가이드 창 */
    .gd{width:100%;max-height:calc(100vh - 24px);padding:18px 16px 14px;border-radius:14px}
    .gd-h{font-size:17px}
    .gd-steps li{padding:9px 10px}
    /* 예약: 캘린더·시간 */
    .calendar-grid td,.calendar-grid button{font-size:13px}
    .slotbtn{padding:10px 8px}
    #slotbox + div button{padding:13px}
    /* 관리자: 카드 속 표는 가로 스크롤 */
    .card{overflow-x:auto}
    .atable{min-width:560px}
    .kpis{grid-template-columns:1fr 1fr}
    .kpi.hero{grid-column:1 / -1}
    .dash-3,.sm-grid{grid-template-columns:1fr}
    .shell-tools{margin-top:8px}
    .pdfbtn span{display:inline}
    /* 하단 탭바 글자 */
    .ebar-item{font-size:10px}
    .ebar-item span{white-space:nowrap}
    /* 바디맵: 그림을 화면 폭에 맞춤 */
    .bmsvg{max-width:100%}
    .bmwrap{padding:10px 8px 12px}
    /* 관리자 로그인 역할 카드 */
    .lgrole{grid-template-columns:1fr 1fr}

  @media(max-width:420px){

  /* ── 시간대 안 5분 단위 시작 시각 ── */
  .pweeks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .pweeks span{display:inline-flex;flex-direction:column;gap:2px;padding:8px 12px;border:1px solid #E3E6ED;border-radius:10px;background:#fff;font-size:12.5px;color:#2B3345;min-width:118px}
  .pweeks span b{font-size:11px;color:#6B7280;font-weight:700}
  .anon-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .anon-list li{border:1px solid #E6E9EF;border-radius:10px;padding:10px 12px;background:#FAFBFD}
  .anon-meta{font-size:11.5px;color:#8A909C;margin-bottom:4px}
  .anon-text{font-size:13.5px;color:#1F2937;white-space:pre-line}
  .subslots{margin-top:10px;padding:10px 12px;border:1px dashed #C9D3F0;border-radius:10px;background:#F7F9FD;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .subslots-l{width:100%;font-size:11.5px;font-weight:700;color:#3A4667}
  .subslot{display:inline-flex;flex-direction:column;align-items:center;gap:1px;min-width:74px;padding:6px 10px;border:1px solid #DDE1E8;border-radius:9px;background:#fff;font-size:13px;font-weight:700;color:#14161A;cursor:pointer}
  .subslot small{font-size:10px;font-weight:500;color:#8A909C}
  .subslot.on{background:#4C5A82;border-color:#4C5A82;color:#fff}.subslot.on small{color:#DCE5F8}
  .subslot.taken{opacity:.5;cursor:not-allowed;background:#F2F4F8}
  .subslot.room{flex:1 1 100%;min-width:0;flex-direction:row;justify-content:flex-start;align-items:center;gap:10px;padding:8px 12px}
  .subslot.room small{margin-left:auto}
  .subslot em{font-style:normal;font-size:12px;font-weight:700;color:#3A4667}
  .subslot.on em{color:#fff}
  .subslots-n{width:100%;font-size:11px;color:#8A909C}

  /* ── 운동처방사 카드 편집기 ── */
  .tce-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .tce{border:1px solid #E6E9EF;border-radius:12px;padding:10px;background:#FAFBFE}
  .tce-prev .tcard{margin:0}
  /* v175: 편집 화면의 카드 3장도 행을 공유 — 사진·소개·학력·경력·자격 줄 수가 달라도 같은 높이 */
  .tce-grid{align-items:stretch}
  .tce-grid>.tce{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:subgrid;grid-row:span 8;align-content:start}
  .tce-grid>.tce>.tce-prev{display:contents}
  .tce-grid>.tce .tcard{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:subgrid;grid-row:span 6;align-content:start}
  .tce-grid>.tce .tcard>.tcard-body{display:contents}
  .tce-grid>.tce>.tce-act{grid-row:7}
  .tce-grid>.tce>.tce-form{grid-row:8}
  .acc-tbl{margin-top:8px;font-size:13px}.acc-tbl code{background:#EEF2FA;padding:2px 6px;border-radius:6px;font-weight:700}
  .tce-drop{margin-top:10px}
  .tce-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .tce-act label.mini{cursor:pointer;display:inline-flex;align-items:center;gap:3px}
  .tce-form{margin-top:10px;border-top:1px dashed #E6E9EF;padding-top:10px}
  .tce-form textarea,.tce-form input[type=text]{width:100%;border:1px solid #DDE1E8;border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  .tce-form .me-grid input,.tce-form .me-grid select{width:100%}

  /* ── 운동처방사 배정 · 해제/삭제 버튼 ── */
  .trslot-h{flex-wrap:wrap}
  .trslot-x{display:inline-flex;gap:6px;margin-left:auto}
  .mini.danger{color:#C0562E;border-color:#EBC9BE}
  .mini.danger:hover{background:#FBEFEA;border-color:#C0562E;color:#A3431F}
  .mini .material-symbols-outlined{font-size:14px;vertical-align:-2px}

  /* ── 건강 리포트 · 보기 많은 문항은 2칸 + 범례를 도넛 옆에 고정 ── */
  .hgrid{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}   /* 카드 최소 폭을 키워 범례가 옆에 들어갈 자리 확보 */
  .hcard .chart{flex-wrap:nowrap;align-items:center;gap:14px}
  .hcard .chart-legend{font-size:12px;gap:5px 7px;flex:1 1 auto;grid-template-columns:10px minmax(72px,1fr) auto auto}
  .hcard .lg-name{white-space:normal;overflow:visible;line-height:1.3;word-break:keep-all}
  @media(max-width:700px){ .hcard .chart{flex-wrap:wrap} }
  .hcard.wide{grid-column:span 2}
  .hcard.wide .chart{flex-wrap:nowrap;align-items:center;gap:20px}
  .hcard.wide .chart-legend{grid-template-columns:10px minmax(0,1fr) auto auto 10px minmax(0,1fr) auto auto;flex:1 1 auto}
  .hcard.wide .lg-name{white-space:normal;overflow:visible;line-height:1.3}
  @media(max-width:700px){ .hcard.wide{grid-column:auto} .hcard.wide .chart{flex-wrap:wrap} .hcard.wide .chart-legend{grid-template-columns:10px minmax(0,1fr) auto auto} }
  /* ── 한눈에 보기 · 별점 분포 ── */

  #coprint{display:none}
  /* html2pdf 로 그릴 때(pdfmode): 화면 밖에 A4 폭으로 펼쳐 두고 캔버스로 찍습니다 */
  /* v151: PDF 캡처용 사본은 화면 '뒤'(z-index:-1)에 두어 사용자에게 보이지 않습니다. 스크롤도 건드리지 않습니다. */
  #pdfwrap{position:absolute;left:0;top:0;width:1480px;z-index:-1;background:#fff;pointer-events:none}
  body.pdfbusy #app{position:relative;z-index:1}
  #coprint.pdfmode{display:block;position:static;width:auto;max-width:100%;padding:0;background:#fff;color:#14161A;font-size:12.5px}
  #coprint.pdfmode{padding:0 6px}
  #coprint.pdfmode .dash-3,#coprint.pdfmode .sm-grid{grid-template-columns:repeat(3,minmax(0,1fr))}   /* 화면과 같은 3열 */
  #coprint.pdfmode .hgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  #coprint.pdfmode .hgrid>.hcard:only-child{grid-column:1/-1}
  #coprint.pdfmode .hgrid>.hcard:only-child .chart{justify-content:flex-start;gap:14px}
  #coprint.pdfmode .hgrid>.hcard:only-child .chart-legend{flex:0 0 auto;gap:5px 7px;
    grid-template-columns:10px minmax(72px,max-content) auto auto 10px minmax(72px,max-content) auto auto}
  #coprint.pdfmode .hgrid>.hcard:only-child .chart-legend .lg-row:nth-child(odd) .lg-pct{padding-right:24px}
  #coprint.pdfmode .kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
  /* 참여 현황: 왼쪽에 부서별·연령대별 도넛, 오른쪽에 완료율 + 부서별 상세 */
  #coprint.pdfmode .pp-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;margin-top:16px;align-items:start}
  #coprint.pdfmode .pp-grid .dash-grid{grid-template-columns:1fr 1fr;margin-top:0}
  #coprint.pdfmode .pp-grid .card{margin-top:0!important}
  #coprint.pdfmode .pp-grid .pp-right{display:flex;flex-direction:column;gap:16px}
  #coprint.pdfmode .prt-sec{margin:0 0 10px}
  #coprint.pdfmode .prt-foot{margin-top:8px}
  #coprint.pdfmode .hcard.wide{grid-column:span 2}
  #coprint.pdfmode .card,#coprint.pdfmode .hcard{break-inside:avoid}
  #coprint.pdfmode .prt-sec.brk{page-break-before:always}
    #coprint.pdfmode .prt-cover{padding:0 0 18px;margin:0 0 22px;border-bottom:2px solid #14161A}
    #coprint.pdfmode .prt-brand{margin-bottom:22px}
    #coprint.pdfmode .prt-kicker{font-size:11px;letter-spacing:.14em;color:#6B7280;font-weight:700}
    #coprint.pdfmode .prt-h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:4px 0 8px}
    #coprint.pdfmode .prt-meta{font-size:11.5px;color:#6B7280}
    #coprint.pdfmode .prt-facts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
    #coprint.pdfmode .prt-facts>div{border:1px solid #DDE1E8;border-radius:8px;padding:8px 10px}
    #coprint.pdfmode .prt-facts span{display:block;font-size:10.5px;color:#8A909C;margin-bottom:2px}
    #coprint.pdfmode .prt-facts b{font-size:13px;font-weight:800;color:#14161A}
    #coprint.pdfmode .prt-sec{margin:0 0 26px}
    #coprint.pdfmode .prt-sec.brk{break-before:page;page-break-before:always}
    #coprint.pdfmode .prt-sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px;padding-bottom:8px;
      border-bottom:1px solid #E6E9EF}
    #coprint.pdfmode .prt-n{width:22px;height:22px;border-radius:999px;background:#14161A;color:#fff;font-size:12px;

/* 반원 게이지 — 완료율·동의율처럼 "하나의 비율" */
function gaugeChart(pct, label, sub, color) {
  const p = Math.max(0, Math.min(100, pct));
  const w = 190, r = 72, cx = w / 2, cy = 88, sw = 18;
  const len = Math.PI * r;
  const col = color || (p >= 70 ? '#2E8B57' : p >= 40 ? '#B7791F' : '#C0562E');
  const path = `M ${cx - r} ${cy} A ${r} ${r} 0 0 1 ${cx + r} ${cy}`;
  return `<div class="gauge-wrap">
    <svg width="${w}" height="105" viewBox="0 0 ${w} 105">
      <path d="${path}" fill="none" stroke="#F0F1EA" stroke-width="${sw}" stroke-linecap="round"/>
      <path d="${path}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
            stroke-dasharray="${len * p / 100} ${len}"/>
      <text x="${cx}" y="${cy - 12}" text-anchor="middle"
            style="font-size:26px;font-weight:800;fill:${col}">${Math.round(p)}%</text>
      <text x="${cx}" y="${cy + 8}" text-anchor="middle"
            style="font-size:11.5px;fill:var(--muted)">${esc(label || '')}</text>
    </svg>
    ${sub ? `<div class="gauge-sub">${esc(sub)}</div>` : ''}
  </div>`;
}

/* 라인(면적) — 시간에 따른 변화 */
function lineChart(points, opt = {}) {
  if(points.length === 0) return `<div class="empty">아직 데이터가 없습니다.</div>`;
  if(points.length === 1){
    return `<div class="oneval">${esc(points[0].x)} · <b>${points[0].y}${opt.unit||''}</b>
      <span>기간이 하나뿐이라 추이를 그릴 수 없습니다.</span></div>`;
  }
  const W = 640, H = 190, pad = { l:38, r:14, t:16, b:26 };
  const yMax = opt.yMax || Math.max(1, ...points.map(p => p.y)) * 1.15;
  const yMin = opt.yMin || 0;
  const x = i => pad.l + i * (W - pad.l - pad.r) / (points.length - 1);
  const y = v => pad.t + (1 - (v - yMin) / (yMax - yMin)) * (H - pad.t - pad.b);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(' ');
  const area = `${line} L${x(points.length-1).toFixed(1)},${y(yMin)} L${x(0).toFixed(1)},${y(yMin)} Z`;
  const ticks = [0, 0.5, 1].map(t => yMin + (yMax - yMin) * t);
  return `<svg class="linechart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    ${ticks.map(t => `<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(t)}" y2="${y(t)}"
        stroke="#EFEFEA" stroke-width="1"/>
      <text x="${pad.l-6}" y="${y(t)+4}" text-anchor="end"
        style="font-size:10px;fill:#9a9a92">${opt.fmtY ? opt.fmtY(t) : Math.round(t)}</text>`).join('')}
    <path d="${area}" fill="var(--accent)" opacity="0.12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5"
          stroke-linejoin="round" stroke-linecap="round"/>
    ${points.map((p, i) => `<circle cx="${x(i)}" cy="${y(p.y)}" r="4"
        fill="#fff" stroke="var(--accent)" stroke-width="2.5">
        <title>${esc(p.x)} · ${opt.fmtY ? opt.fmtY(p.y) : p.y}${opt.unit || ''}</title></circle>`).join('')}
    ${points.map((p, i) => (points.length <= 8 || i % Math.ceil(points.length / 8) === 0)
        ? `<text x="${x(i)}" y="${H-8}" text-anchor="middle"
             style="font-size:10px;fill:#9a9a92">${esc(p.x)}</text>` : '').join('')}
  </svg>`;
}

/* 100% 스택바 — 긍정/보통/부정처럼 한 줄로 나누는 비율 */
function stackBar(segs, opt = {}) {
  const total = segs.reduce((a, b) => a + b.n, 0);
  if(!total) return `<div class="empty">아직 데이터가 없습니다.</div>`;
  return `<div>
    <div class="stackbar">
      ${segs.map((s, i) => {
        const pct = s.n / total * 100;
        return `<div style="width:${pct}%;background:${s.color || chartColor(i)}"
          title="${esc(s.label)} ${s.n} (${Math.round(pct)}%)">${pct >= 12 ? Math.round(pct) + '%' : ''}</div>`;
      }).join('')}
    </div>
    <div class="stackbar-lg">
      ${segs.map((s, i) => `<span class="lg-row" style="flex:0 0 auto">
        <span class="lg-dot" style="background:${s.color || chartColor(i)}"></span>
        <span>${esc(s.label)} <b>${s.n}${opt.unit || ''}</b></span></span>`).join('')}
    </div>
  </div>`;
}
